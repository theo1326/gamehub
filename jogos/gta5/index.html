<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ludix City 3D</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
canvas{display:block}

#hud{
 position:fixed;
 top:15px;
 left:15px;
 z-index:20;
 color:white;
}

.box{
 background:rgba(0,0,0,.72);
 backdrop-filter:blur(10px);
 padding:11px 17px;
 border-radius:12px;
 margin-bottom:8px;
 border:1px solid rgba(255,255,255,.16);
}

#vida{
 width:210px;
 height:15px;
 background:#333;
 border-radius:20px;
 overflow:hidden;
 margin-top:6px;
}

#barra{
 width:100%;
 height:100%;
 background:#19dc5a;
}

#missao{
 position:fixed;
 top:15px;
 right:15px;
 z-index:20;
 color:white;
 background:rgba(0,0,0,.72);
 backdrop-filter:blur(10px);
 padding:16px;
 border-radius:12px;
 min-width:250px;
 border:1px solid rgba(255,255,255,.16);
}

#controles{
 position:fixed;
 bottom:15px;
 left:15px;
 z-index:20;
 color:white;
 background:rgba(0,0,0,.72);
 padding:12px 16px;
 border-radius:12px;
 line-height:1.6;
}

#mensagem{
 position:fixed;
 bottom:40px;
 left:50%;
 transform:translateX(-50%);
 z-index:30;
 color:white;
 background:rgba(0,0,0,.88);
 padding:13px 25px;
 border-radius:25px;
 opacity:0;
 transition:.3s;
 pointer-events:none;
}

#mira{
 position:fixed;
 left:50%;
 top:50%;
 width:18px;
 height:18px;
 transform:translate(-50%,-50%);
 z-index:15;
 pointer-events:none;
}

#mira:before,
#mira:after{
 content:"";
 position:absolute;
 background:white;
 box-shadow:0 0 4px #000;
}

#mira:before{
 width:18px;
 height:2px;
 top:8px;
}

#mira:after{
 width:2px;
 height:18px;
 left:8px;
}

#mouseInfo{
 position:fixed;
 bottom:15px;
 right:15px;
 z-index:20;
 color:white;
 background:rgba(0,0,0,.72);
 padding:10px 15px;
 border-radius:10px;
 font-size:13px;
}
</style>
</head>

<body>

<div id="hud">

  ❤️ VIDA
  <div id="vida">
   <div id="barra"></div>
  </div>

</div>

<div id="missao">

</div>

<div id="controles">

</div>

<div id="mouseInfo">

</div>

<div id="mira"></div>

for(const x of [-17,17,63,97,-97,-63])

 FAIXAS
===================================================== */

/* =====================================================
 PRÉDIOS
===================================================== */

const cores=[
 0x59616c,
 0x6d5e56,
 0x486174,
 0x777777,
 0x55596c,
 0x806449,
 0x536b76
];

function predio(
 x,z,w,d,h,cor
){

 const grupo=new THREE.Group();

 const corpo=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    w,h,d
   ),
   new THREE.MeshStandardMaterial({
    color:cor,
    roughness:.75
   })
  );

 corpo.position.y=h/2;
 corpo.castShadow=true;
 corpo.receiveShadow=true;

 grupo.add(corpo);


 const topo=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    w+.5,.4,d+.5
   ),
   new THREE.MeshStandardMaterial({
    color:0x292d32
   })
  );

 topo.position.y=h+.2;

 grupo.add(topo);


 const janelaMat=
  new THREE.MeshStandardMaterial({
   color:0x8ed4ed,
   emissive:0x204555,
   emissiveIntensity:.45
  });


 for(let y=3;y<h-2;y+=4){

  for(
   let wx=-w/2+2;
   wx<w/2-1;
   wx+=4
  ){

   const janela=
    new THREE.Mesh(
     new THREE.BoxGeometry(
      1.4,1.4,.08
     ),
     janelaMat
    );

   janela.position.set(
    wx,y,d/2+.05
   );

   grupo.add(janela);
  }
 }


 grupo.position.set(x,0,z);

 scene.add(grupo);
}


for(
 let x=-240;
 x<=240;
 x+=40
){

 for(
  let z=-240;
  z<=240;
  z+=40
 ){

   Math.abs(x)<38 ||

   Math.abs(x-80)<38 ||

   12+Math.random()*55;

   x+Math.random()*8-4,
   z+Math.random()*8-4,
   25,
   25,
   h,
   cores[
    Math.floor(
     Math.random()*cores.length
    )
   ]
  );
 }
}

/* =====================================================
 PERSONAGEM DETALHADO
===================================================== */

  });

  });

  new THREE.MeshStandardMaterial({
   color:0x20242a,

  });


 /* tronco */

   new THREE.CapsuleGeometry(

 tronco.position.y=1.55;
 tronco.castShadow=true;

 p.add(tronco);

  );

  );

 p.add(cabeca);

   ),

    color:0x21150e,
    roughness:1
   })
  );

 cabelo.scale.y=.5;
 cabelo.position.y=2.83;

 p.add(cabelo);


 /* olhos */

 const olhoMat=
  new THREE.MeshBasicMaterial({
   color:0x111111
  });

 for(const lado of [-1,1]){

  const olho=
   new THREE.Mesh(
    new THREE.SphereGeometry(

   );

  );

/* =====================================================
 CARRO DO JOGADOR
===================================================== */

function carroModelo(cor,tipo=0){

 const carro=new THREE.Group();

 /*
  REGRA:
  frente do carro = -Z
  eixo lateral = X
 */


 const carroceria=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    4.5,.72,2
   ),
   new THREE.MeshStandardMaterial({
    color:cor,
    metalness:.35,
    roughness:.25
   })
  );

 carroceria.position.y=.8;
 carroceria.castShadow=true;

 carro.add(carroceria);


 /* cabine */

 const cabine=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    tipo===1?2.6:2.15,
    .9,
    1.65
   ),
   new THREE.MeshStandardMaterial({
    color:0x111820,
    metalness:.2,
    roughness:.18
   })
  );

 cabine.position.set(
   tipo===1?.25:.35,
   1.42,
   0
 );

 cabine.castShadow=true;

 carro.add(cabine);


 /* teto */

 if(tipo===2){

  const teto=
   new THREE.Mesh(
    new THREE.BoxGeometry(
     2.5,.15,1.75
    ),
    new THREE.MeshStandardMaterial({
     color:cor
    })
   );

  teto.position.set(
   .25,1.92,0
  );

  carro.add(teto);
 }


 /* rodas */

 const rodaGeo=
  new THREE.CylinderGeometry(
   .48,.48,.38,24
  );

 const rodaMat=
  new THREE.MeshStandardMaterial({
   color:0x101010,
   roughness:.9
  });


 const rodaPos=[
  [-1.5,.48,-.9],
  [1.5,.48,-.9],
  [-1.5,.48,.9],
  [1.5,.48,.9]
 ];


 const rodas=[];


 for(const pos of rodaPos){

  const roda=
   new THREE.Mesh(
    rodaGeo,
    rodaMat
   );

  /*
   Eixo da roda = X
  */

  roda.rotation.z=
   Math.PI/2;

  roda.position.set(
   pos[0],
   pos[1],
   pos[2]
  );

  roda.castShadow=true;

  carro.add(roda);

  rodas.push(roda);
 }


 /* faróis */

 const farolMat=
  new THREE.MeshStandardMaterial({
   color:0xffffff,
   emissive:0xffffff,
   emissiveIntensity:1.2
  });

 for(const lado of [-1,1]){

  const farol=
   new THREE.Mesh(
    new THREE.BoxGeometry(
     .25,.25,.12
    ),
    farolMat
   );

  farol.position.set(
   -2.25,
   .9,
   lado*.62
  );

  carro.add(farol);
 }


 /* lanternas */

 const lanternaMat=
  new THREE.MeshStandardMaterial({
   color:0xff1111,
   emissive:0xff0000,
   emissiveIntensity:.7
  });

 for(const lado of [-1,1]){

  const lanterna=
   new THREE.Mesh(
    new THREE.BoxGeometry(
     .18,.25,.12
    ),
    lanternaMat
   );

  lanterna.position.set(
   2.25,
   .9,
   lado*.62
  );

  carro.add(lanterna);
 }


 carro.userData.rodas=rodas;

 return carro;
}

carro.position.set(

/* =====================================================
 TRÂNSITO
===================================================== */

const carrosTrafego=[];

const coresCarros=[
 0xffffff,
 0x111111,
 0x1c58b7,
 0xd92121,
 0xf0c52b,
 0x6f7378,
 0x239b56,
 0xe67e22,

];


function criarCarroTrafego(){

 const tipos=
  Math.floor(

    Math.floor(

}


/*
  Três corredores horizontais
  e três verticais.
*/

for(let i=0;i<20;i++){

  criarCarroTrafego();

 const linha=
  Math.floor(
   Math.random()*6
  );

 let velocidade=
  .06+
  Math.random()*.07;


 /*
  horizontal
 */

 if(linha<3){

  const ruas=[
   -80,

  ];

  carroNpc.position.set(
   Math.random()*500-250,

  carroNpc.userData.eixo="x";

   (carroNpc.rotation.y>0?1:-1);

 }
 else{

  const ruas=[
   -80,
   0,
   80
  ];

  carroNpc.position.set(
   ruas[linha-3],
   0,
   Math.random()*500-250
  );

  carroNpc.rotation.y=
   Math.random()<.5
   ? 0
   : Math.PI;

  carroNpc.userData.eixo="z";

  carroNpc.userData.velocidade=
   velocidade*
   (carroNpc.rotation.y===0?1:-1);
 }


 scene.add(carroNpc);

 carrosTrafego.push(carroNpc);
}


/* =====================================================
 CONTROLES
===================================================== */

const teclas={};

addEventListener(

  ]=true;

  if(

);


/* =====================================================
 CÂMERA DO MOUSE
===================================================== */

let cameraYaw=0;
let cameraPitch=.35;

let mouseAtivo=false;

const sensibilidade=.0025;


renderer.domElement.addEventListener(
 "click",
 ()=>{
  renderer.domElement.requestPointerLock();
 }
);


document.addEventListener(
 "pointerlockchange",
 ()=>{

  mouseAtivo=
   document.pointerLockElement===
   renderer.domElement;

  document.getElementById(
   "mouseInfo"
  ).style.display=
   mouseAtivo
   ? "none"
   : "block";
 }
);


document.addEventListener(
 "mousemove",
 e=>{

  if(!mouseAtivo)
   return;

  cameraYaw-=
   e.movementX*sensibilidade;

  cameraPitch-=
   e.movementY*sensibilidade;

  cameraPitch=
   THREE.MathUtils.clamp(
    cameraPitch,
    -.15,
    1.05
   );
 }
);

 ESTADO
===================================================== */

let dentroDoCarro=false;
let velocidadeCarro=0;
let dinheiro=1000;
let vida=100;

 ENTRAR NO CARRO

 }
 else{

  dentroDoCarro=false;

  jogador.visible=true;

  /*
   Sai pela lateral direita.
  */

  const saida=
   new THREE.Vector3(
    3.2,0,0
   );

  saida.applyQuaternion(
   carro.quaternion
  );

  jogador.position.copy(
   carro.position
  );

  jogador.position.add(
   saida
  );

  mensagem(
   "🚶 Você saiu do carro!"
  );
 }
}


/* =====================================================
 ANIMAÇÃO PESSOAS
===================================================== */

function animarPessoa(
 p,
 andando
){

 const d=p.userData;

 if(andando){

  d.fase+=.18;

  const movimento=
   Math.sin(d.fase)*.65;

  d.pernaE.rotation.x=
   movimento;

  d.pernaD.rotation.x=
   -movimento;

  d.bracoE.rotation.x=
   -movimento*.7;

  d.bracoD.rotation.x=
   movimento*.7;

  p.position.y=
   Math.abs(
    Math.sin(d.fase*2)
   )*.025;

 }
 else{

  d.pernaE.rotation.x=
   THREE.MathUtils.lerp(
    d.pernaE.rotation.x,
    0,.2
   );

  d.pernaD.rotation.x=
   THREE.MathUtils.lerp(
    d.pernaD.rotation.x,
    0,.2
   );

  d.bracoE.rotation.x=
   THREE.MathUtils.lerp(
    d.bracoE.rotation.x,
    0,.2
   );

  d.bracoD.rotation.x=
   THREE.MathUtils.lerp(
    d.bracoD.rotation.x,
    0,.2
   );
 }
}


/* =====================================================
 MOVIMENTO JOGADOR
===================================================== */

function atualizarJogador(){

 if(dentroDoCarro){

  moverCarro();

  return;
 }


 const frente=
  new THREE.Vector3(
   -Math.sin(cameraYaw),
   0,
   -Math.cos(cameraYaw)
  );

 const direita=
  new THREE.Vector3(
   Math.cos(cameraYaw),
   0,
   -Math.sin(cameraYaw)
  );

 const dir=
  new THREE.Vector3();


 if(teclas["w"])
  dir.add(frente);

 if(teclas["s"])
  dir.sub(frente);

 if(teclas["d"])
  dir.add(direita);

 if(teclas["a"])
  dir.sub(direita);


 const andando=
  dir.length()>0;

 animarPessoa(
  jogador,
  andando
 );


 if(andando){

  dir.normalize();

  const velocidade=
   teclas["shift"]
   ? .23
   : .115;

  jogador.position.add(
   dir.multiplyScalar(
    velocidade
   )
  );

  const angulo=
   Math.atan2(
    dir.x,
    dir.z
   );

  jogador.rotation.y=
   THREE.MathUtils.lerp(
    jogador.rotation.y,
    angulo,
    .25
   );
 }
}


/* =====================================================
 MOVIMENTO NPC
===================================================== */

function atualizarNPCs(){

 npcs.forEach(
  npc=>{

   const d=npc.userData;

   d.troca--;

   if(d.troca<=0){

    d.direcao+=
     (Math.random()-.5)*.8;

    d.troca=
     100+Math.random()*200;
   }


   const dir=
    new THREE.Vector3(
     Math.sin(d.direcao),
     0,
     Math.cos(d.direcao)
    );


   npc.position.add(
    dir.multiplyScalar(
     d.velocidade
    )
   );


   npc.rotation.y=
    d.direcao;

   animarPessoa(
    npc,
    true
   );


   if(
    Math.abs(npc.position.x)>245
   )
    d.direcao=
     Math.PI-d.direcao;

   if(
    Math.abs(npc.position.z)>245
   )
    d.direcao=
     -d.direcao;
  }
 );
}


/* =====================================================
 CARRO DO JOGADOR
===================================================== */

function moverCarro(){

 /*
  ACELERAÇÃO
 */

 if(teclas["w"])
  velocidadeCarro+=.014;

 if(teclas["s"])
  velocidadeCarro-=.018;


 velocidadeCarro*=.975;


 velocidadeCarro=
  THREE.MathUtils.clamp(
   velocidadeCarro,
   -.42,
   .85
  );


 /*
  DIREÇÃO
 */

 const abs=
  Math.abs(
   velocidadeCarro
  );


 if(abs>.01){

  if(teclas["a"])
   carro.rotation.y+=
    .035*abs*
    (velocidadeCarro>=0?1:-1);

  if(teclas["d"])
   carro.rotation.y-=
    .035*abs*
    (velocidadeCarro>=0?1:-1);
 }


 /*
  FRENTE REAL DO CARRO = -Z
 */

 const frente=
  new THREE.Vector3(
   0,0,-1
  );

 frente.applyQuaternion(
  carro.quaternion
 );


 carro.position.add(
  frente.multiplyScalar(
   velocidadeCarro
  )
 );


 /*
  RODAS
 */

 carro.userData.rodas.forEach(
  roda=>{

   roda.rotation.x+=
    velocidadeCarro*.7;
  }
 );
}


/* =====================================================
 TRÂNSITO
===================================================== */

function atualizarTrafego(){

 carrosTrafego.forEach(
  carro=>{

   const v=
    carro.userData.velocidade;


   if(
    carro.userData.eixo==="x"
   ){

    carro.position.x+=v;

    carro.userData.rodas
     .forEach(
      roda=>{
       roda.rotation.x+=v*.7;
      }
     );


    if(carro.position.x>270)
     carro.position.x=-270;

    if(carro.position.x<-270)
     carro.position.x=270;

   }
   else{

    carro.position.z+=v;

    carro.userData.rodas
     .forEach(
      roda=>{
       roda.rotation.x+=v*.7;
      }
     );


    if(carro.position.z>270)
     carro.position.z=-270;

    if(carro.position.z<-270)
     carro.position.z=270;
   }
  }
 );
}


/* =====================================================
 CÂMERA
===================================================== */

function atualizarCamera(){

 const alvo=
  dentroDoCarro
  ? carro
  : jogador;


 const distancia=
  dentroDoCarro
  ? 11
  : 8.5;


 const altura=
  dentroDoCarro
  ? 5.5
  : 5.2;


 const offset=
  new THREE.Vector3(
   0,0,distancia
  );


 const rotacao=
  new THREE.Euler(
   cameraPitch,
   cameraYaw,
   0,
   "YXZ"
  );


 offset.applyEuler(
  rotacao
 );


 const destino=
  alvo.position.clone()
   .add(offset);

 destino.y+=altura;


 camera.position.lerp(
  destino,
  .13
 );


 const olha=
  alvo.position.clone();

 olha.y+=1.3;

 camera.lookAt(
  olha
 );
}


/* =====================================================
 MISSÃO
===================================================== */

const marcador=
 new THREE.Mesh(
  new THREE.CylinderGeometry(
   5,5,.2,48
  ),
  new THREE.MeshBasicMaterial({
   color:0xffcc00
  })
 );

marcador.position.set(
 -70,.2,-70
);

scene.add(marcador);


const borda=
 new THREE.Mesh(
  new THREE.TorusGeometry(
   5,.12,12,48
  ),
  new THREE.MeshBasicMaterial({
   color:0xffffff
  })
 );

borda.rotation.x=
 Math.PI/2;

borda.position.copy(
 marcador.position
);

scene.add(borda);


let missaoConcluida=false;


function verificarMissao(){

 if(missaoConcluida)
  return;


 const objeto=
  dentroDoCarro
  ? carro
  : jogador;


 const distancia=
  objeto.position.distanceTo(
   marcador.position
  );


 if(distancia<8){

  missaoConcluida=true;

  dinheiro+=500;

  document.getElementById(
   "dinheiro"
  ).textContent=
   "$"+dinheiro;


  marcador.material.color.set(
   0x00ff55
  );

  borda.material.color.set(
   0x00ff55
  );


  document.getElementById(
   "missao"
  ).innerHTML=
   "✅ <b>MISSÃO CONCLUÍDA!</b><br><br>Você ganhou $500.";

  mensagem(
   "💰 +$500"
  );
 }
}


/* =====================================================
 LIMITES
===================================================== */

function limitar(obj){

 obj.position.x=
  THREE.MathUtils.clamp(
   obj.position.x,
   -255,255
  );

 obj.position.z=
  THREE.MathUtils.clamp(
   obj.position.z,
   -255,255
  );
}


/* =====================================================
 MENSAGEM
===================================================== */

let timerMensagem;

function mensagem(texto){

 const el=
  document.getElementById(
   "mensagem"
  );

 el.textContent=texto;

 el.style.opacity=1;

 clearTimeout(
  timerMensagem
 );

 timerMensagem=
  setTimeout(
   ()=>{
    el.style.opacity=0;
   },
   2000
  );
}


/* =====================================================
 ANIMAÇÕES
===================================================== */

function animarCidade(){

 marcador.rotation.y+=.02;

 borda.rotation.z+=.02;

 marcador.position.y=
  .2+
  Math.sin(
   Date.now()*.003
  )*.12;

 borda.position.y=
  marcador.position.y;
}


/* =====================================================
 LOOP
===================================================== */

function animar(){

 requestAnimationFrame(
  animar
 );

 atualizarJogador();

 atualizarNPCs();

 atualizarTrafego();

 atualizarCamera();

 verificarMissao();

 animarCidade();


 limitar(
  dentroDoCarro
  ? carro
  : jogador
 );


 renderer.render(
  scene,
  camera
 );
}


/* =====================================================
 REDIMENSIONAMENTO
===================================================== */

addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 }
);


/* =====================================================
 INICIAR
===================================================== */

animar();

</script>
