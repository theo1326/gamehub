<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludix City 3D</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    top:15px;
    left:15px;
    z-index:20;
    color:white;
}

.box{
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(10px);
    padding:12px 18px;
    border-radius:12px;
    margin-bottom:8px;
    border:1px solid rgba(255,255,255,.15);
}

#vida{
    width:210px;
    height:15px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
    margin-top:6px;
}

#barra{
    width:100%;
    height:100%;
    background:#19dc5a;
}

#missao{
    position:fixed;
    top:15px;
    right:15px;
    z-index:20;
    color:white;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(10px);
    padding:16px;
    border-radius:12px;
    min-width:250px;
    border:1px solid rgba(255,255,255,.15);
}

#controles{
    position:fixed;
    bottom:15px;
    left:15px;
    z-index:20;
    color:white;
    background:rgba(0,0,0,.72);
    padding:12px 16px;
    border-radius:12px;
    line-height:1.6;
}

#mensagem{
    position:fixed;
    bottom:35px;
    left:50%;
    transform:translateX(-50%);
    z-index:30;
    color:white;
    background:rgba(0,0,0,.88);
    padding:13px 25px;
    border-radius:25px;
    opacity:0;
    transition:.3s;
    pointer-events:none;
}

#mira{
    position:fixed;
    left:50%;
    top:50%;
    width:18px;
    height:18px;
    transform:translate(-50%,-50%);
    z-index:15;
    pointer-events:none;
}

#mira:before,
#mira:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 4px #000;
}

#mira:before{
    width:18px;
    height:2px;
    top:8px;
}

#mira:after{
    width:2px;
    height:18px;
    left:8px;
}

#mouseInfo{
    position:fixed;
    bottom:15px;
    right:15px;
    z-index:20;
    color:white;
    background:rgba(0,0,0,.7);
    padding:10px 15px;
    border-radius:10px;
    font-size:13px;
}

#fade{
    position:fixed;
    inset:0;
    background:#000;
    z-index:100;
    pointer-events:none;
    opacity:0;
    transition:opacity .5s;
}
</style>
</head>

<body>

<div id="fade"></div>

<div id="hud">

    <div class="box">
        ❤️ VIDA
        <div id="vida">
            <div id="barra"></div>
        </div>
    </div>

    <div class="box">
        💰 DINHEIRO:
        <b id="dinheiro">$1000</b>
    </div>

    <div class="box">
        ⭐ PROCURADO:
        <b id="procurado">0</b>
    </div>

</div>

<div id="missao">
    🎯 <b>MISSÃO</b>
    <br><br>
    Vá até o marcador amarelo.
</div>

<div id="controles">
    <b>🎮 CONTROLES</b><br>
    W A S D — andar<br>
    SHIFT — correr<br>
    E — entrar/sair do carro<br>
    Mouse — controlar câmera<br>
    Clique — capturar câmera
</div>

<div id="mouseInfo">
    🖱️ Clique na tela para controlar a câmera
</div>

<div id="mira"></div>
<div id="mensagem"></div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =====================================================
   CENA
===================================================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x78bce8);

scene.fog =
    new THREE.Fog(
        0x78bce8,
        90,
        520
    );


/* =====================================================
   CÂMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        68,
        window.innerWidth / window.innerHeight,
        0.1,
        1200
    );

camera.position.set(
    0,
    5,
    10
);


/* =====================================================
   RENDERIZADOR
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=1.15;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   CÉU
===================================================== */

const sky =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            700,
            32,
            16
        ),
        new THREE.MeshBasicMaterial({
            color:0x75b9e8,
            side:THREE.BackSide
        })
    );

scene.add(sky);


/* =====================================================
   LUZ DO SOL
===================================================== */

const sol =
    new THREE.DirectionalLight(
        0xfff2d0,
        3
    );

sol.position.set(
    120,
    220,
    100
);

sol.castShadow=true;

sol.shadow.mapSize.width=4096;
sol.shadow.mapSize.height=4096;

sol.shadow.camera.left=-300;
sol.shadow.camera.right=300;
sol.shadow.camera.top=300;
sol.shadow.camera.bottom=-300;

sol.shadow.camera.near=1;
sol.shadow.camera.far=600;

scene.add(sol);


const ambiente =
    new THREE.HemisphereLight(
        0xaad8ff,
        0x29452a,
        1.5
    );

scene.add(ambiente);


/* =====================================================
   CHÃO
===================================================== */

const chao =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            700,
            700
        ),
        new THREE.MeshStandardMaterial({
            color:0x397f3c,
            roughness:1
        })
    );

chao.rotation.x=-Math.PI/2;

chao.receiveShadow=true;

scene.add(chao);


/* =====================================================
   ESTRADAS
===================================================== */

function criarEstrada(
    x,
    z,
    largura,
    profundidade
){

    const rua =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                largura,
                .1,
                profundidade
            ),
            new THREE.MeshStandardMaterial({
                color:0x202124,
                roughness:.92
            })
        );

    rua.position.set(
        x,
        .05,
        z
    );

    rua.receiveShadow=true;

    scene.add(rua);
}


criarEstrada(0,0,560,28);
criarEstrada(0,80,560,28);
criarEstrada(0,-80,560,28);

criarEstrada(0,0,28,560);
criarEstrada(80,0,28,560);
criarEstrada(-80,0,28,560);


/* =====================================================
   CALÇADAS
===================================================== */

function criarCalcada(
    x,
    z,
    largura,
    profundidade
){

    const calcada =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                largura,
                .18,
                profundidade
            ),
            new THREE.MeshStandardMaterial({
                color:0x969696,
                roughness:.95
            })
        );

    calcada.position.set(
        x,
        .1,
        z
    );

    calcada.receiveShadow=true;

    scene.add(calcada);
}


for(
    const z of [-17,17,63,97,-97,-63]
){

    criarCalcada(
        0,
        z,
        560,
        5
    );
}

for(
    const x of [-17,17,63,97,-97,-63]
){

    criarCalcada(
        x,
        0,
        5,
        560
    );
}


/* =====================================================
   FAIXAS
===================================================== */

function faixa(
    x,
    z,
    horizontal=true
){

    const faixa =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                horizontal ? 8 : .35,
                .025,
                horizontal ? .35 : 8
            ),
            new THREE.MeshBasicMaterial({
                color:0xf5f5f5
            })
        );

    faixa.position.set(
        x,
        .12,
        z
    );

    scene.add(faixa);
}


for(
    let x=-270;
    x<270;
    x+=16
){

    faixa(x,0,true);
    faixa(x,80,true);
    faixa(x,-80,true);
}


for(
    let z=-270;
    z<270;
    z+=16
){

    faixa(0,z,false);
    faixa(80,z,false);
    faixa(-80,z,false);
}


/* =====================================================
   PRÉDIOS
===================================================== */

const coresPredios=[
    0x59616c,
    0x6e625a,
    0x465e70,
    0x777777,
    0x55596d,
    0x806449,
    0x4f6672
];


function criarPredio(
    x,
    z,
    largura,
    profundidade,
    altura,
    cor
){

    const grupo =
        new THREE.Group();


    const edificio =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                largura,
                altura,
                profundidade
            ),
            new THREE.MeshStandardMaterial({
                color:cor,
                roughness:.72,
                metalness:.05
            })
        );

    edificio.position.y=
        altura/2;

    edificio.castShadow=true;
    edificio.receiveShadow=true;

    grupo.add(edificio);


    /* topo */

    const topo =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                largura+.5,
                .45,
                profundidade+.5
            ),
            new THREE.MeshStandardMaterial({
                color:0x292d32,
                roughness:.8
            })
        );

    topo.position.y=
        altura+.22;

    topo.castShadow=true;

    grupo.add(topo);


    /* janelas */

    const janelaMaterial =
        new THREE.MeshStandardMaterial({
            color:0x9ed7ef,
            emissive:0x25495a,
            emissiveIntensity:.45,
            roughness:.25
        });


    for(
        let y=3;
        y<altura-2;
        y+=3.8
    ){

        for(
            let wx=-largura/2+2;
            wx<largura/2-1;
            wx+=3.8
        ){

            const janela =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        1.35,
                        1.35,
                        .08
                    ),
                    janelaMaterial
                );

            janela.position.set(
                wx,
                y,
                profundidade/2+.05
            );

            grupo.add(janela);
        }
    }


    /* porta */

    const porta =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.5,
                2.8,
                .08
            ),
            new THREE.MeshStandardMaterial({
                color:0x252525
            })
        );

    porta.position.set(
        0,
        1.4,
        profundidade/2+.07
    );

    grupo.add(porta);


    grupo.position.set(
        x,
        0,
        z
    );

    scene.add(grupo);
}


/* cidade */

for(
    let x=-240;
    x<=240;
    x+=40
){

    for(
        let z=-240;
        z<=240;
        z+=40
    ){

        if(
            Math.abs(x)<38 ||
            Math.abs(z)<38 ||
            Math.abs(x-80)<38 ||
            Math.abs(z-80)<38 ||
            Math.abs(x+80)<38 ||
            Math.abs(z+80)<38
        ){

            continue;
        }


        const altura =
            12+
            Math.random()*55;


        const cor =
            coresPredios[
                Math.floor(
                    Math.random()*
                    coresPredios.length
                )
            ];


        criarPredio(
            x+Math.random()*8-4,
            z+Math.random()*8-4,
            25,
            25,
            altura,
            cor
        );
    }
}


/* =====================================================
   ÁRVORES
===================================================== */

function criarArvore(x,z){

    const grupo =
        new THREE.Group();


    const tronco =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .3,
                .45,
                3.2,
                10
            ),
            new THREE.MeshStandardMaterial({
                color:0x684128,
                roughness:1
            })
        );

    tronco.position.y=1.6;

    tronco.castShadow=true;

    grupo.add(tronco);


    const copa =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2.25,
                18,
                16
            ),
            new THREE.MeshStandardMaterial({
                color:0x176d2e,
                roughness:1
            })
        );

    copa.position.y=4;

    copa.castShadow=true;

    grupo.add(copa);


    grupo.position.set(
        x,
        0,
        z
    );

    scene.add(grupo);
}


for(
    let i=0;
    i<110;
    i++
){

    const x=
        Math.random()*520-260;

    const z=
        Math.random()*520-260;


    if(
        Math.abs(x)<32 ||
        Math.abs(z)<32
    ){

        continue;
    }


    criarArvore(x,z);
}


/* =====================================================
   POSTES
===================================================== */

function criarPoste(x,z){

    const poste =
        new THREE.Group();


    const haste =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .11,
                .15,
                6,
                10
            ),
            new THREE.MeshStandardMaterial({
                color:0x272727,
                roughness:.7
            })
        );

    haste.position.y=3;

    haste.castShadow=true;

    poste.add(haste);


    const lampada =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .35,
                12,
                12
            ),
            new THREE.MeshBasicMaterial({
                color:0xffedaa
            })
        );

    lampada.position.y=6;

    poste.add(lampada);


    const luz =
        new THREE.PointLight(
            0xffd78a,
            .8,
            18
        );

    luz.position.y=6;

    poste.add(luz);


    poste.position.set(

    );

}


for(
    let x=-240;
    x<=240;
    x+=40
){

    criarPoste(x,14);
    criarPoste(x,-14);
}


/* =====================================================
   PERSONAGEM
===================================================== */

function criarPersonagem(
    roupa=0x2255cc
){

    const personagem =
        new THREE.Group();


    const corpo =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .9,
                1.35,
                .55
            ),
            new THREE.MeshStandardMaterial({
                color:roupa,
                roughness:.8
            })
        );

    corpo.position.y=1.55;

    corpo.castShadow=true;

    personagem.add(corpo);


    const cabeca =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .38,
                20,
                20
            ),
            new THREE.MeshStandardMaterial({
                color:0xc68642,
                roughness:.9
            })
        );

    cabeca.position.y=2.55;

    cabeca.castShadow=true;

    personagem.add(cabeca);


    const cabelo =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .4,
                18,
                18
            ),
            new THREE.MeshStandardMaterial({
                color:0x20140d
            })
        );

    cabelo.scale.y=.5;

    cabelo.position.y=2.82;

    personagem.add(cabelo);


    function criarBraco(lado){

        const braco =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .28,
                    1.1,
                    .28
                ),
                new THREE.MeshStandardMaterial({
                    color:roupa
                })
            );

        braco.position.set(
            lado*.62,
            1.55,
            0
        );

        braco.castShadow=true;

        personagem.add(braco);

        return braco;
    }


    function criarPerna(lado){

        const perna =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .3,
                    1.1,
                    .3
                ),
                new THREE.MeshStandardMaterial({
                    color:0x222222
                })
            );

        perna.position.set(
            lado*.23,
            .55,
            0
        );

        perna.castShadow=true;

        personagem.add(perna);

        return perna;
    }


    personagem.userData={
        bracoE:criarBraco(-1),
        bracoD:criarBraco(1),
        pernaE:criarPerna(-1),
        pernaD:criarPerna(1),
        fase:Math.random()*10,
        andando:false
    };


    return personagem;
}


/* =====================================================
   JOGADOR
===================================================== */

const jogador =
    criarPersonagem(
        0x2255cc
    );

jogador.position.set(
    0,
    0,
    10
);

scene.add(jogador);


/* =====================================================
   NPCs
===================================================== */

const npcs=[];

for(
    let i=0;
    i<35;
    i++
){

    const cores=[
        0xcc3333,
        0x33aa66,
        0xddaa22,
        0x8844cc,
        0xeeeeee,
        0x2255cc,
        0xff6633
    ];


    const npc =
        criarPersonagem(

                Math.floor(

                )
            ]
        );

    );


    npc.userData.direcao=

    npc.userData.velocidade=

        Math.random()*200;

/* =====================================================
   CARRO
===================================================== */

function criarCarro(cor){

    const carro =
        new THREE.Group();


    /* carroceria */

    const carroceria =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.4,
                .72,
                2
            ),
            new THREE.MeshStandardMaterial({
                color:cor,
                metalness:.3,
                roughness:.28
            })
        );

    carroceria.position.y=.8;

    carroceria.castShadow=true;

    carro.add(carroceria);


    /* capô */

    const capo =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.25,
                .18,
                1.75
            ),
            new THREE.MeshStandardMaterial({
                color:cor,
                metalness:.3,
                roughness:.28
            })
        );

    capo.position.set(
        -1.45,
        1.17,
        0
    );

    carro.add(capo);


    /* cabine */

    const cabine =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.15,
                .9,
                1.65
            ),
            new THREE.MeshStandardMaterial({
                color:0x101820,
                metalness:.15,
                roughness:.18
            })
        );

    cabine.position.set(
        .35,
        1.4,
        0
    );

    cabine.castShadow=true;

    carro.add(cabine);


    /* rodas */

    const rodaGeo =
        new THREE.CylinderGeometry(
            .48,
            .48,
            .38,
            24
        );

    const rodaMat =
        new THREE.MeshStandardMaterial({
            color:0x101010,
            roughness:.9
        });


    /*
       IMPORTANTE:
       O carro usa o eixo Z como frente.
       As rodas ficam nos lados X.
    */

    const posicoesRodas=[
        [-1.45,.48,-.88],
        [ 1.45,.48,-.88],
        [-1.45,.48, .88],
        [ 1.45,.48, .88]
    ];


    const rodas=[];


    posicoesRodas.forEach(
        pos=>{

            const roda =
                new THREE.Mesh(
                    rodaGeo,
                    rodaMat
                );

            /*
               O cilindro gira originalmente
               no eixo Y.
               Girando 90 graus no Z,
               o eixo da roda fica no X.
            */

            roda.rotation.z=
                Math.PI/2;

            roda.position.set(
                pos[0],
                pos[1],
                pos[2]
            );

            roda.castShadow=true;

            carro.add(roda);

            rodas.push(roda);
        }
    );


    /* calotas */

    const calotaGeo =
        new THREE.CylinderGeometry(
            .18,
            .18,
            .4,
            16
        );

    const calotaMat =
        new THREE.MeshStandardMaterial({
            color:0xaaaaaa,
            metalness:.7,
            roughness:.2
        });


    posicoesRodas.forEach(
        pos=>{

            const calota =
                new THREE.Mesh(
                    calotaGeo,
                    calotaMat
                );

            calota.rotation.z=
                Math.PI/2;

            calota.position.set(
                pos[0],
                pos[1],
                pos[2]
            );

            carro.add(calota);
        }
    );


    /* faróis */

    const farolMat =
        new THREE.MeshStandardMaterial({
            color:0xffffff,
            emissive:0xffffff,
            emissiveIntensity:1
        });


    for(
        const lado of [-1,1]
    ){

        const farol =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .25,
                    .25,
                    .12
                ),
                farolMat
            );

        /*
           Frente do carro = -Z
        */

        farol.position.set(
            -2.2,
            .9,
            lado*.62
        );

        carro.add(farol);
    }


    /* lanternas */

    const lanternaMat =
        new THREE.MeshStandardMaterial({
            color:0xff1111,
            emissive:0xff0000,
            emissiveIntensity:.5
        });


    for(
        const lado of [-1,1]
    ){

        const lanterna =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .18,
                    .25,
                    .12
                ),
                lanternaMat
            );

        lanterna.position.set(
            2.2,
            .9,
            lado*.62
        );

        carro.add(lanterna);
    }


    carro.userData.rodas=rodas;

    return carro;
}


const carro =
    criarCarro(
        0xd92121
    );


carro.position.set(
    8,
    0,
    10
);

scene.add(carro);


/* =====================================================
   CONTROLES
===================================================== */

const teclas={};


window.addEventListener(
    "keydown",
    e=>{

        teclas[
            e.key.toLowerCase()
        ]=true;


        if(
            e.key.toLowerCase()==="e"
        ){

            entrarCarro();
        }
    }
);


window.addEventListener(
    "keyup",
    e=>{

        teclas[
            e.key.toLowerCase()
        ]=false;
    }
);


/* =====================================================
   CÂMERA DO MOUSE
===================================================== */

let cameraYaw=0;

let cameraPitch=.35;

let mouseAtivo=false;

let mouseSensibilidade=.0025;


renderer.domElement.addEventListener(
    "click",
    ()=>{

        renderer.domElement.requestPointerLock();

    }
);


document.addEventListener(
    "pointerlockchange",
    ()=>{

        mouseAtivo=
            document.pointerLockElement===
            renderer.domElement;

        document.getElementById(
            "mouseInfo"
        ).style.display=
            mouseAtivo
            ? "none"
            : "block";
    }
);


document.addEventListener(
    "mousemove",
    e=>{

        if(!mouseAtivo)
            return;


        cameraYaw -=
            e.movementX*
            mouseSensibilidade;


        cameraPitch -=
            e.movementY*
            mouseSensibilidade;


        cameraPitch=
            THREE.MathUtils.clamp(
                cameraPitch,
                -0.15,
                1.05
            );
    }
);


/* =====================================================
   ESTADO
===================================================== */

let dentroDoCarro=false;

let velocidadeCarro=0;

let dinheiro=1000;

let vida=100;

let procurado=0;

let tempoAnimacao=0;


/* =====================================================
   ENTRAR / SAIR DO CARRO
===================================================== */

function entrarCarro(){

    if(!dentroDoCarro){

        const distancia=
            jogador.position.distanceTo(
                carro.position
            );


        if(
            distancia<5
        ){

            dentroDoCarro=true;

            jogador.visible=false;

            mensagem(
                "🚗 Você entrou no carro!"
            );
        }

    }
    else{

        dentroDoCarro=false;

        jogador.visible=true;

        const saida=
            new THREE.Vector3(
                3,
                0,
                0
            );

        saida.applyQuaternion(
            carro.quaternion
        );

        jogador.position.copy(
            carro.position
        );

        jogador.position.add(
            saida
        );

        mensagem(
            "🚶 Você saiu do carro!"
        );
    }
}


/* =====================================================
   ANIMAÇÃO DOS PERSONAGENS
===================================================== */

function animarPersonagem(
    personagem,
    andando
){

    const d=
        personagem.userData;


    if(!d.pernaE)
        return;


    if(andando){

        d.fase+=.18;

        const movimento=
            Math.sin(d.fase)*.65;


        d.pernaE.rotation.x=
            movimento;

        d.pernaD.rotation.x=
            -movimento;

        d.bracoE.rotation.x=
            -movimento*.7;

        d.bracoD.rotation.x=
            movimento*.7;


        personagem.position.y=
            Math.abs(
                Math.sin(
                    d.fase*2
                )
            )*.035;

    }
    else{

        d.pernaE.rotation.x=
            THREE.MathUtils.lerp(
                d.pernaE.rotation.x,
                0,
                .2
            );

        d.pernaD.rotation.x=
            THREE.MathUtils.lerp(
                d.pernaD.rotation.x,
                0,
                .2
            );

        d.bracoE.rotation.x=
            THREE.MathUtils.lerp(
                d.bracoE.rotation.x,
                0,
                .2
            );

        d.bracoD.rotation.x=
            THREE.MathUtils.lerp(
                d.bracoD.rotation.x,
                0,
                .2
            );

        personagem.position.y=
            THREE.MathUtils.lerp(
                personagem.position.y,
                0,
                .2
            );
    }
}


/* =====================================================
   MOVIMENTO DO JOGADOR
===================================================== */

function atualizarJogador(){

    if(dentroDoCarro){

        moverCarro();

        return;
    }


    /*
       Movimento relativo à câmera.
    */

    const frente =
        new THREE.Vector3(
            -Math.sin(cameraYaw),
            0,
            -Math.cos(cameraYaw)
        );


    const direita =
        new THREE.Vector3(
            Math.cos(cameraYaw),
            0,
            -Math.sin(cameraYaw)
        );


    const direcao=
        new THREE.Vector3();


    if(teclas["w"])
        direcao.add(frente);

    if(teclas["s"])
        direcao.sub(frente);

    if(teclas["d"])
        direcao.add(direita);

    if(teclas["a"])
        direcao.sub(direita);


    const andando=
        direcao.length()>0;


    animarPersonagem(
        jogador,
        andando
    );


    if(andando){

        direcao.normalize();


        const velocidade=
            teclas["shift"]
            ? .23
            : .115;


        jogador.position.add(
            direcao.multiplyScalar(
                velocidade
            )
        );


        const angulo=
            Math.atan2(
                direcao.x,
                direcao.z
            );


        jogador.rotation.y=
            THREE.MathUtils.lerp(
                jogador.rotation.y,
                angulo,
                .25
            );
    }
}


/* =====================================================
   NPCs
===================================================== */

function atualizarNPCs(){

    npcs.forEach(
        npc=>{

            const d=
                npc.userData;


            d.troca--;


            if(d.troca<=0){

                d.direcao +=
                    (Math.random()-.5)
                    *.9;

                d.troca=
                    100+
                    Math.random()*200;
            }


            const direcao=
                new THREE.Vector3(
                    Math.sin(d.direcao),
                    0,
                    Math.cos(d.direcao)
                );


            npc.position.add(
                direcao.multiplyScalar(
                    d.velocidade
                )
            );


            npc.rotation.y=
                d.direcao;


            animarPersonagem(
                npc,
                true
            );


            if(
                Math.abs(
                    npc.position.x
                )>245
            ){

                d.direcao=
                    Math.PI-d.direcao;
            }


            if(
                Math.abs(
                    npc.position.z
                )>245
            ){

                d.direcao=
                    -d.direcao;
            }
        }
    );
}


/* =====================================================
   CARRO
===================================================== */

function moverCarro(){

    if(teclas["w"])
        velocidadeCarro+=.014;

    if(teclas["s"])
        velocidadeCarro-=.018;


    velocidadeCarro*=.975;


    velocidadeCarro=
        THREE.MathUtils.clamp(
            velocidadeCarro,
            -.42,
            .85
        );


    /*
       Direção do carro:
       -Z = frente
    */

    const velocidadeAbs=
        Math.abs(
            velocidadeCarro
        );


    if(
        teclas["a"] &&
        velocidadeAbs>.01
    ){

        carro.rotation.y +=
            .035*
            velocidadeAbs*
            (velocidadeCarro>=0?1:-1);
    }


    if(
        teclas["d"] &&
        velocidadeAbs>.01
    ){

        carro.rotation.y -=
            .035*
            velocidadeAbs*
            (velocidadeCarro>=0?1:-1);
    }


    const frente=
        new THREE.Vector3(
            0,
            0,
            -1
        );


    frente.applyQuaternion(
        carro.quaternion
    );


    carro.position.add(
        frente.multiplyScalar(
            velocidadeCarro
        )
    );


    /*
       Faz as rodas girarem
       corretamente conforme o carro anda.
    */

    carro.userData.rodas.forEach(
        roda=>{

            roda.rotation.x +=
                velocidadeCarro*.7;
        }
    );
}


/* =====================================================
   CÂMERA
===================================================== */

function atualizarCamera(){

    const alvo=
        dentroDoCarro
        ? carro
        : jogador;


    const distancia=
        dentroDoCarro
        ? 11
        : 8.5;


    const altura=
        dentroDoCarro
        ? 5.5
        : 5.2;


    /*
       Câmera totalmente controlada
       pelo mouse.
    */

    const offset=
        new THREE.Vector3(
            0,
            0,
            distancia
        );


    const rotacao=
        new THREE.Euler(
            cameraPitch,
            cameraYaw,
            0,
            "YXZ"
        );


    offset.applyEuler(
        rotacao
    );


    const destino=
        alvo.position
        .clone()
        .add(offset);


    destino.y +=
        altura;


    camera.position.lerp(
        destino,
        .13
    );


    const alvoCamera=
        alvo.position
        .clone();


    alvoCamera.y+=1.3;


    camera.lookAt(
        alvoCamera
    );
}


/* =====================================================
   MISSÃO
===================================================== */

const marcador =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            5,
            5,
            .2,
            48
        ),
        new THREE.MeshBasicMaterial({
            color:0xffcc00
        })
    );


marcador.position.set(
    -70,
    .2,
    -70
);

scene.add(marcador);


const marcadorBorda =
    new THREE.Mesh(
        new THREE.TorusGeometry(
            5,
            .12,
            12,
            48
        ),
        new THREE.MeshBasicMaterial({
            color:0xffffff
        })
    );

marcadorBorda.rotation.x=
    Math.PI/2;

marcadorBorda.position.copy(
    marcador.position
);

scene.add(marcadorBorda);


let missaoConcluida=false;


function verificarMissao(){

    if(missaoConcluida)
        return;


    const objeto=
        dentroDoCarro
        ? carro
        : jogador;


    const distancia=
        objeto.position.distanceTo(
            marcador.position
        );


    if(distancia<8){

        missaoConcluida=true;

        dinheiro+=500;


        document.getElementById(
            "dinheiro"
        ).textContent=
            "$"+dinheiro;


        marcador.material.color.set(
            0x00ff55
        );

        marcadorBorda.material.color.set(
            0x00ff55
        );


        document.getElementById(
            "missao"
        ).innerHTML=
            "✅ <b>MISSÃO CONCLUÍDA!</b><br><br>Você ganhou $500.";


        mensagem(
            "💰 +$500"
        );
    }
}


/* =====================================================
   LIMITES
===================================================== */

function limitar(objeto){

    objeto.position.x=
        THREE.MathUtils.clamp(
            objeto.position.x,
            -255,
            255
        );


    objeto.position.z=
        THREE.MathUtils.clamp(
            objeto.position.z,
            -255,
            255
        );
}


/* =====================================================
   MENSAGEM
===================================================== */

let timerMensagem;


function mensagem(texto){

    const elemento=
        document.getElementById(
            "mensagem"
        );


    elemento.textContent=
        texto;


    elemento.style.opacity=1;


    clearTimeout(
        timerMensagem
    );


    timerMensagem=
        setTimeout(
            ()=>{
                elemento.style.opacity=0;
            },
            2000
        );
}


/* =====================================================
   ANIMAÇÕES
===================================================== */

function animarCidade(){

    marcador.rotation.y+=.02;

    marcadorBorda.rotation.z+=.02;

    marcador.position.y=
        .2+
        Math.sin(
            Date.now()*.003
        )*.12;

    marcadorBorda.position.y=
        marcador.position.y;
}


/* =====================================================
   LOOP
===================================================== */

function animar(){

    requestAnimationFrame(
        animar
    );


    atualizarJogador();

    atualizarNPCs();

    atualizarCamera();

    verificarMissao();

    animarCidade();


    limitar(
        dentroDoCarro
        ? carro
        : jogador
    );


    renderer.render(
        scene,
        camera
    );
}


/* =====================================================
   REDIMENSIONAMENTO
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            window.innerWidth/
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =====================================================
   INICIAR
===================================================== */

animar();

</script>
