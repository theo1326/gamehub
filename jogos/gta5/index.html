<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludix City 3D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    top:15px;
    left:15px;
    z-index:10;
    color:white;
    background:rgba(0,0,0,.65);
    padding:14px;
    border-radius:12px;
    min-width:230px;
    box-shadow:0 5px 20px rgba(0,0,0,.35);
}

#hud h1{
    font-size:20px;
    margin-bottom:8px;
}

#hud p{
    margin:4px 0;
    font-size:14px;
}

#healthBox{
    width:190px;
    height:12px;
    background:#333;
    border-radius:10px;
    overflow:hidden;
    margin-top:8px;
}

#health{
    height:100%;
    width:100%;
    background:#35d46b;
}

#help{
    position:fixed;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    background:rgba(0,0,0,.7);
    color:white;
    padding:10px 16px;
    border-radius:10px;
    font-size:14px;
    text-align:center;
}

#mission{
    position:fixed;
    top:15px;
    right:15px;
    z-index:10;
    color:white;
    background:rgba(20,20,20,.75);
    padding:15px;
    border-radius:12px;
    max-width:260px;
}

#start{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(#101827,#080b10);
    color:white;
    text-align:center;
}

.startBox{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    padding:35px;
    border-radius:20px;
    max-width:450px;
}

.startBox h1{
    font-size:38px;
    margin-bottom:10px;
}

.startBox p{
    margin:10px 0 20px;
    line-height:1.5;
    color:#ccc;
}

#startBtn{
    border:0;
    background:#22c55e;
    color:white;
    padding:14px 30px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

#startBtn:hover{
    background:#16a34a;
}
</style>
</head>

<body>

<div id="start">
    <div class="startBox">
        <h1>🏙️ Ludix City 3D</h1>
        <p>
            Explore uma cidade 3D original, caminhe pelas ruas,
            dirija veículos, encontre personagens e complete missões.
        </p>
        <button id="startBtn">ENTRAR NA CIDADE</button>
    </div>
</div>

<div id="hud">
    <h1>🏙️ Ludix City</h1>
    <p>💰 Dinheiro: $<span id="money">500</span></p>
    <p>⭐ Procurado: <span id="wanted">0</span></p>
    <p>🚗 Veículo: <span id="vehicle">A pé</span></p>

    <div id="healthBox">
        <div id="health"></div>
    </div>
</div>

<div id="mission">
    <b>📍 Missão</b>
    <p id="missionText">Vá até o marcador verde.</p>
</div>

<div id="help">
    WASD = andar/dirigir • E = entrar/sair do carro • Mouse = câmera
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================================================
   CENA
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87b9e8);

scene.fog = new THREE.Fog(
    0x87b9e8,
    180,
    650
);


const camera = new THREE.PerspectiveCamera(
    70,
    innerWidth / innerHeight,
    0.1,
    1000
);

camera.position.set(
    0,
    7,
    12
);


const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);


/* =========================================================
   LUZES
========================================================= */

const hemi = new THREE.HemisphereLight(
    0xbfe4ff,
    0x3b4937,
    2
);

scene.add(hemi);


const sun = new THREE.DirectionalLight(
    0xffffff,
    2.5
);

sun.position.set(
    120,
    180,
    80
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -250;
sun.shadow.camera.right = 250;
sun.shadow.camera.top = 250;
sun.shadow.camera.bottom = -250;

scene.add(sun);


/* =========================================================
   MATERIAIS
========================================================= */

function mat(color,roughness=.8){

    return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness:.05
    });

}

const grassMat = mat(0x4f914b);
const roadMat = mat(0x282c31);
const sidewalkMat = mat(0x969696);
const whiteMat = mat(0xffffff);
const yellowMat = mat(0xf3d14b);


/* =========================================================
   CHÃO
========================================================= */

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(800,800),
    grassMat
);

ground.rotation.x = -Math.PI/2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   OBJETOS DO MUNDO
========================================================= */

const obstacles = [];


/* =========================================================
   ESTRADA
========================================================= */

function criarEstradaHorizontal(z){

    const road = new THREE.Mesh(
        new THREE.BoxGeometry(
            800,
            .15,
            18
        ),
        roadMat
    );

    road.position.set(
        0,
        .08,
        z
    );

    road.receiveShadow = true;

    scene.add(road);


    const sidewalk1 = new THREE.Mesh(
        new THREE.BoxGeometry(
            800,
            .3,
            5
        ),
        sidewalkMat
    );

    sidewalk1.position.set(
        0,
        .15,
        z-11.5
    );

    scene.add(sidewalk1);


    const sidewalk2 = sidewalk1.clone();

    sidewalk2.position.z =
    z+11.5;

    scene.add(sidewalk2);


    for(let x=-380;x<400;x+=12){

        const line = new THREE.Mesh(
            new THREE.BoxGeometry(
                6,
                .04,
                .18
            ),
            yellowMat
        );

        line.position.set(
            x,
            .18,
            z
        );

        scene.add(line);

    }

}


function criarEstradaVertical(x){

    const road = new THREE.Mesh(
        new THREE.BoxGeometry(
            18,
            .15,
            800
        ),
        roadMat
    );

    road.position.set(
        x,
        .08,
        0
    );

    scene.add(road);


    const sidewalk1 = new THREE.Mesh(
        new THREE.BoxGeometry(
            5,
            .3,
            800
        ),
        sidewalkMat
    );

    sidewalk1.position.set(
        x-11.5,
        .15,
        0
    );

    scene.add(sidewalk1);


    const sidewalk2 = sidewalk1.clone();

    sidewalk2.position.x =
    x+11.5;

    scene.add(sidewalk2);


    for(let z=-380;z<400;z+=12){

        const line = new THREE.Mesh(
            new THREE.BoxGeometry(
                .18,
                .04,
                6
            ),
            yellowMat
        );

        line.position.set(
            x,
            .18,
            z
        );

        scene.add(line);

    }

}


[-80,0,80].forEach(criarEstradaHorizontal);
[-80,0,80].forEach(criarEstradaVertical);


/* =========================================================
   PRÉDIOS
========================================================= */

function criarPredio(x,z,w,d,h,color){

    const group =
    new THREE.Group();


    const body = new THREE.Mesh(
        new THREE.BoxGeometry(
            w,
            h,
            d
        ),
        mat(color)
    );

    body.position.y =
    h/2;

    body.castShadow = true;
    body.receiveShadow = true;

    group.add(body);


    /* telhado */

    const roof = new THREE.Mesh(
        new THREE.BoxGeometry(
            w+.7,
            .5,
            d+.7
        ),
        mat(0x30343b)
    );

    roof.position.y =
    h+.25;

    roof.castShadow = true;

    group.add(roof);


    /* janelas */

    const janelaMat =
    mat(0x8ed7ef,.25);

    for(
        let yy=3;
        yy<h-1;
        yy+=3
    ){

        for(
            let xx=-w/2+1.3;
            xx<w/2-1;
            xx+=2.5
        ){

            const janela =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    1.25,
                    1.3,
                    .08
                ),
                janelaMat
            );

            janela.position.set(
                xx,
                yy,
                d/2+.05
            );

            group.add(janela);


            const janela2 =
            janela.clone();

            janela2.position.z =
            -d/2-.05;

            group.add(janela2);

        }

    }


    /* porta */

    const porta =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.5,
            2.7,
            .12
        ),
        mat(0x422d20)
    );

    porta.position.set(
        0,
        1.35,
        d/2+.08
    );

    group.add(porta);


    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);

    obstacles.push({
        x,
        z,
        w:w+.8,
        d:d+.8
    });

}


const buildingColors = [
    0xc6c8cc,
    0xb5a48d,
    0x8896a8,
    0xd4b48c,
    0x9caaa0,
    0x777d88
];


for(let bx=-140;bx<=140;bx+=40){

    for(let bz=-140;bz<=140;bz+=40){

        const nearRoad =
        Math.abs(bx%80)<20 ||
        Math.abs(bz%80)<20;

        if(nearRoad) continue;

        const w =
        18+Math.random()*9;

        const d =
        18+Math.random()*9;

        const h =
        12+Math.random()*35;

        criarPredio(
            bx,
            bz,
            w,
            d,
            h,
            buildingColors[
                Math.floor(
                    Math.random()*buildingColors.length
                )
            ]
        );

    }

}


/* =========================================================
   CASAS
========================================================= */

function criarCasa(x,z,cor){

    const g =
    new THREE.Group();


    const base =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            14,
            6,
            11
        ),
        mat(cor)
    );

    base.position.y=3;

    base.castShadow=true;

    g.add(base);


    const roof =
    new THREE.Mesh(
        new THREE.ConeGeometry(
            10,
            5,
            4
        ),
        mat(0x6b3b2b)
    );

    roof.rotation.y =
    Math.PI/4;

    roof.position.y=8.5;

    roof.scale.z=.7;

    roof.castShadow=true;

    g.add(roof);


    const door =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.5,
            3,
            .15
        ),
        mat(0x533322)
    );

    door.position.set(
        0,
        1.5,
        5.6
    );

    g.add(door);


    for(const xw of [-4,4]){

        const window =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.2,
                1.7,
                .15
            ),
            mat(0x8dd9e8,.2)
        );

        window.position.set(
            xw,
            3.5,
            5.6
        );

        g.add(window);

    }


    /* chaminé */

    const chimney =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.5,
            3,
            1.5
        ),
        mat(0x8a4e3c)
    );

    chimney.position.set(
        3,
        9,
        -2
    );

    g.add(chimney);


    g.position.set(
        x,
        0,
        z
    );

    scene.add(g);

    obstacles.push({
        x,
        z,
        w:15,
        d:12
    });

}


const houseColors=[
    0xe0c39d,
    0xc7d7b7,
    0xd8a7a7,
    0xb7c8d9
];


for(let i=0;i<24;i++){

    const x =
    (Math.floor(Math.random()*18)-9)*20;

    const z =
    (Math.floor(Math.random()*18)-9)*20;

    if(
        Math.abs(x%80)<25 ||
        Math.abs(z%80)<25
    ) continue;

    criarCasa(
        x,
        z,
        houseColors[
            Math.floor(
                Math.random()*houseColors.length
            )
        ]
    );

}


/* =========================================================
   ÁRVORES
========================================================= */

function criarArvore(x,z,tipo=0){

    const g =
    new THREE.Group();


    const trunk =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .45,
            .65,
            4,
            8
        ),
        mat(0x6a4025)
    );

    trunk.position.y=2;

    trunk.castShadow=true;

    g.add(trunk);


    if(tipo===0){

        for(let i=0;i<5;i++){

            const folha =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    2.2+Math.random(),
                    10,
                    8
                ),
                mat(0x2f7d3d)
            );

            folha.position.set(
                (Math.random()-.5)*2,
                4.5+Math.random()*2,
                (Math.random()-.5)*2
            );

            folha.castShadow=true;

            g.add(folha);

        }

    }else{

        const crown =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                3,
                7,
                9
            ),
            mat(0x276b38)
        );

        crown.position.y=6;

        crown.castShadow=true;

        g.add(crown);

    }


    g.position.set(
        x,
        0,
        z
    );

    scene.add(g);

}


for(let i=0;i<100;i++){

    const x =
    (Math.random()-.5)*600;

    const z =
    (Math.random()-.5)*600;

    if(
        Math.abs(x)<125 ||
        Math.abs(z)<125
    ) continue;

    criarArvore(
        x,
        z,
        Math.random()<.5?0:1
    );

}


/* =========================================================
   POSTES DE RUA
========================================================= */

function criarPoste(x,z){

    const g =
    new THREE.Group();


    const pole =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .12,
            .18,
            7,
            8
        ),
        mat(0x25282c)
    );

    pole.position.y=3.5;

    pole.castShadow=true;

    g.add(pole);


    const arm =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            2,
            .12,
            .12
        ),
        mat(0x25282c)
    );

    arm.position.set(
        .9,
        6.5,
        0
    );

    g.add(arm);


    const lamp =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .35,
            10,
            10
        ),
        mat(0xffed9c)
    );

    lamp.position.set(
        1.7,
        6.3,
        0
    );

    g.add(lamp);


    const light =
    new THREE.PointLight(
        0xffdf8a,
        .6,
        18
    );

    light.position.set(
        1.7,
        6.2,
        0
    );

    g.add(light);


    g.position.set(
        x,
        0,
        z
    );

    scene.add(g);

}


for(let x=-240;x<=240;x+=40){

    criarPoste(x,-13);

    criarPoste(x,13);

}


for(let z=-240;z<=240;z+=40){

    criarPoste(-13,z);

    criarPoste(13,z);

}


/* =========================================================
   PERSONAGEM HUMANO
========================================================= */

const skinColors=[
    0xf1c7a5,
    0xd99b72,
    0xb87850,
    0x8e563d,
    0x633c2c
];

const hairColors=[
    0x17120f,
    0x352116,
    0x6b3c20,
    0x9b7650
];


function criarPessoa(){

    const g =
    new THREE.Group();

    const skin =
    mat(
        skinColors[
            Math.floor(
                Math.random()*skinColors.length
            )
        ]
    );

    const hair =
    mat(
        hairColors[
            Math.floor(
                Math.random()*hairColors.length
            )
        ]
    );

    const shirt =
    mat(
        [
            0x263c91,
            0x9d2d2d,
            0x27734b,
            0x9c7227,
            0x6e3f91
        ][
            Math.floor(Math.random()*5)
        ]
    );

    const pants =
    mat(
        [
            0x20252d,
            0x343d55,
            0x4b382c
        ][
            Math.floor(Math.random()*3)
        ]
    );


    /* corpo */

    const body =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .55,
            1.25,
            5,
            10
        ),
        shirt
    );

    body.position.y=2.2;

    body.castShadow=true;

    g.add(body);


    /* pescoço */

    const neck =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .18,
            .2,
            .35,
            8
        ),
        skin
    );

    neck.position.y=3.1;

    g.add(neck);


    /* cabeça */

    const head =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .52,
            16,
            12
        ),
        skin
    );

    head.position.y=3.65;

    head.scale.y=1.12;

    head.castShadow=true;

    g.add(head);


    /* cabelo */

    const hairMesh =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .54,
            16,
            8,
            0,
            Math.PI*2,
            0,
            Math.PI*.55
        ),
        hair
    );

    hairMesh.position.y=3.9;

    g.add(hairMesh);


    /* olhos */

    for(const ex of [-.18,.18]){

        const eye =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .055,
                8,
                8
            ),
            mat(0x111111)
        );

        eye.position.set(
            ex,
            3.68,
            -.48
        );

        g.add(eye);

    }


    /* braços */

    const arms=[];

    for(const side of [-1,1]){

        const arm =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .16,
                .75,
                5,
                8
            ),
            shirt
        );

        arm.position.set(
            side*.7,
            2.35,
            0
        );

        arm.rotation.z =
        side*.12;

        arm.castShadow=true;

        g.add(arm);

        arms.push(arm);

    }


    /* pernas */

    const legs=[];

    for(const side of [-1,1]){

        const leg =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .19,
                .8,
                5,
                8
            ),
            pants
        );

        leg.position.set(
            side*.28,
            .9,
            0
        );

        leg.castShadow=true;

        g.add(leg);

        legs.push(leg);


        const shoe =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .38,
                .2,
                .65
            ),
            mat(0x171717)
        );

        shoe.position.set(
            side*.28,
            .2,
            -.12
        );

        g.add(shoe);

    }


    g.userData.arms=arms;
    g.userData.legs=legs;
    g.userData.walkTime=Math.random()*10;

    return g;

}


/* =========================================================
   PLAYER
========================================================= */

const player =
criarPessoa();

player.position.set(
    15,
    0,
    15
);

scene.add(player);


/* =========================================================
   NPCs
========================================================= */

const npcs=[];

for(let i=0;i<32;i++){

    const npc =
    criarPessoa();

    npc.position.set(
        (Math.random()-.5)*250,
        0,
        (Math.random()-.5)*250
    );

    npc.userData.speed =
    .8+Math.random()*.8;

    npc.userData.angle =
    Math.random()*Math.PI*2;

    scene.add(npc);

    npcs.push(npc);

}


/* =========================================================
   VEÍCULOS
========================================================= */

function criarVeiculo(tipo,cor){

    const g =
    new THREE.Group();

    const bodyMat =
    mat(cor,.55);

    const glassMat =
    mat(0x8bd1df,.15);

    const tireMat =
    mat(0x111111);


    function box(
        w,h,d,
        x,y,z,
        material,
        bevel=false
    ){

        const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,h,d
            ),
            material
        );

        mesh.position.set(
            x,y,z
        );

        mesh.castShadow=true;
        mesh.receiveShadow=true;

        g.add(mesh);

        return mesh;

    }


    /* SEDAN */

    if(tipo==="sedan"){

        box(
            2.5,
            .7,
            4.6,
            0,
            .8,
            0,
            bodyMat
        );

        box(
            2.05,
            .75,
            2.2,
            0,
            1.45,
            .15,
            bodyMat
        );

        box(
            1.85,
            .55,
            1.8,
            0,
            1.48,
            -.05,
            glassMat
        );

    }


    /* ESPORTIVO */

    if(tipo==="esportivo"){

        box(
            2.6,
            .5,
            4.8,
            0,
            .65,
            0,
            bodyMat
        );

        box(
            1.85,
            .55,
            1.7,
            0,
            1.18,
            -.25,
            glassMat
        );

        box(
            2.3,
            .18,
            .25,
            0,
            1.05,
            -2.35,
            bodyMat
        );

    }


    /* SUV */

    if(tipo==="suv"){

        box(
            2.7,
            1,
            4.5,
            0,
            1,
            0,
            bodyMat
        );

        box(
            2.25,
            1.1,
            2.5,
            0,
            1.9,
            .15,
            bodyMat
        );

        box(
            2.05,
            .75,
            2,
            0,
            1.95,
            -.05,
            glassMat
        );

    }


    /* PICKUP */

    if(tipo==="pickup"){

        box(
            2.6,
            .75,
            2.2,
            0,
            .9,
            1.05,
            bodyMat
        );

        box(
            2.25,
            1.15,
            1.8,
            0,
            1.45,
            -.8,
            bodyMat
        );

        box(
            2.05,
            .7,
            1.5,
            0,
            1.7,
            -.75,
            glassMat
        );

        box(
            2.4,
            .35,
            2,
            0,
            .9,
            1.6,
            mat(0x333333)
        );

    }


    /* VAN */

    if(tipo==="van"){

        box(
            2.7,
            1.5,
            4.8,
            0,
            1.35,
            0,
            bodyMat
        );

        box(
            2.35,
            .8,
            2.8,
            0,
            1.85,
            -.4,
            glassMat
        );

    }


    /* CAMINHÃO */

    if(tipo==="truck"){

        box(
            2.8,
            1.8,
            2.1,
            0,
            1.45,
            -1.35,
            bodyMat
        );

        box(
            2.35,
            1,
            1.7,
            0,
            2.1,
            -1.35,
            glassMat
        );

        box(
            2.9,
            2.4,
            3.2,
            0,
            1.7,
            1.35,
            mat(0xc5c5c5)
        );

    }


    /* RODAS */

    const wheelPositions=[
        [-1.25,.55,-1.55],
        [1.25,.55,-1.55],
        [-1.25,.55,1.55],
        [1.25,.55,1.55]
    ];

    if(tipo==="truck"){

        wheelPositions.push(
            [-1.25,.55,2.25],
            [1.25,.55,2.25]
        );

    }


    const wheels=[];

    for(const p of wheelPositions){

        const wheel =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .42,
                .42,
                .28,
                16
            ),
            tireMat
        );

        wheel.rotation.z =
        Math.PI/2;

        wheel.position.set(
            p[0],
            p[1],
            p[2]
        );

        wheel.castShadow=true;

        g.add(wheel);

        wheels.push(wheel);

    }


    g.userData.wheels=wheels;
    g.userData.type=tipo;

    return g;

}


/* =========================================================
   CARRO DO JOGADOR
========================================================= */

const carro =
criarVeiculo(
    "esportivo",
    0xd62828
);

carro.position.set(
    20,
    0,
    10
);

scene.add(carro);

carro.userData.velocity =
new THREE.Vector3();

carro.userData.maxSpeed=28;
carro.userData.reverseSpeed=10;
carro.userData.acceleration=18;
carro.userData.brake=25;
carro.userData.friction=7;
carro.userData.steering=0;

let noCarro=false;


/* =========================================================
   TRÂNSITO
========================================================= */

const traffic=[];

const vehicleTypes=[
    "sedan",
    "esportivo",
    "suv",
    "pickup",
    "van",
    "truck"
];

const colors=[
    0x2463d4,
    0xf0c419,
    0xeeeeee,
    0x171717,
    0x28a745,
    0xd97706,
    0x8b5cf6
];


function criarTransito(){

    const tipo =
    vehicleTypes[
        Math.floor(
            Math.random()*vehicleTypes.length
        )
    ];

    const car =
    criarVeiculo(
        tipo,
        colors[
            Math.floor(
                Math.random()*colors.length
            )
        ]
    );


    const horizontal =
    Math.random()<.5;


    let direction;


    if(horizontal){

        const z =
        [-80,0,80][
            Math.floor(
                Math.random()*3
            )
        ];

        const positive =
        Math.random()<.5;

        car.position.set(
            positive?-320:320,
            0,
            z+(Math.random()<.5?3.5:-3.5)
        );

        direction =
        new THREE.Vector3(
            positive?1:-1,
            0,
            0
        );

    }else{

        const x =
        [-80,0,80][
            Math.floor(
                Math.random()*3
            )
        ];

        const positive =
        Math.random()<.5;

        car.position.set(
            x+(Math.random()<.5?3.5:-3.5),
            0,
            positive?-320:320
        );

        direction =
        new THREE.Vector3(
            0,
            0,
            positive?1:-1
        );

    }


    direction.normalize();

    car.userData.direction =
    direction;

    car.userData.speed =
    8+Math.random()*9;

    /*
       IMPORTANTE:
       A frente de TODOS os veículos é -Z.
       A direção real é usada para orientar o carro.
    */

    const target =
    car.position.clone().add(direction);

    car.lookAt(target);


    scene.add(car);

    traffic.push(car);

}


for(let i=0;i<24;i++){
    criarTransito();
}

});

   CÂMERA / MOUSE
========================================================= */

let yaw=0;
let pitch=-.18;

document.addEventListener(
"mousemove",
e=>{

    if(document.pointerLockElement){

        yaw -= e.movementX*.0025;

        pitch -= e.movementY*.0025;

        pitch =
        Math.max(
            -.8,
            Math.min(.45,pitch)
        );

    }

});


document.addEventListener(
"click",
()=>{

        !document.pointerLockElement &&
        document.getElementById("start").style.display==="none"

   ENTRAR / SAIR
========================================================= */

window.addEventListener(
"keydown",
e=>{

    ) return;

/* =========================================================
   MOVIMENTO DO JOGADOR
========================================================= */

function moverPessoa(dt){

    if(noCarro) return;


    const speed=8;

    const direction =
    new THREE.Vector3();


    if(keys["w"])
        direction.z-=1;

    if(keys["s"])
        direction.z+=1;

    if(keys["a"])
        direction.x-=1;

    if(keys["d"])
        direction.x+=1;


    if(direction.length()>0){

        direction.normalize();

        direction.applyAxisAngle(
            new THREE.Vector3(0,1,0),
            yaw
        );

        const next =
        player.position.clone();

        next.addScaledVector(
            direction,
            speed*dt
        );


        if(!colideObstaculo(next,.8)){

            player.position.copy(next);

        }


        player.rotation.y =
        Math.atan2(
            direction.x,
            direction.z
        );


        animarPessoa(
            player,
            dt,
            true
        );

    }else{

        animarPessoa(
            player,
            dt,
            false
        );

    }

}


/* =========================================================
   FÍSICA DO CARRO
========================================================= */

function moverCarro(dt){

    const data =
    carro.userData;


    const velocity =
    data.velocity;


    const forward =
    new THREE.Vector3(
        0,
        0,
        -1
    );

    forward.applyQuaternion(
        carro.quaternion
    );


    let throttle=0;

    if(keys["w"])
        throttle=1;

    if(keys["s"])
        throttle=-1;


    /* aceleração */

    if(throttle>0){

        velocity.addScaledVector(
            forward,
            data.acceleration*dt
        );

    }


    if(throttle<0){

        velocity.addScaledVector(
            forward,
            -data.acceleration*.65*dt
        );

    }


    /* limite */

    const forwardSpeed =
    velocity.dot(forward);


    if(
        forwardSpeed >
        data.maxSpeed
    ){

        velocity.addScaledVector(
            forward,
            data.maxSpeed-forwardSpeed
        );

    }


    if(
        forwardSpeed <
        -data.reverseSpeed
    ){

        velocity.addScaledVector(
            forward,
            -data.reverseSpeed-forwardSpeed
        );

    }


    /* atrito */

    if(
        throttle===0
    ){

        velocity.multiplyScalar(
            Math.max(
                0,
                1-data.friction*dt*.1
            )
        );

    }


    /* freio */

    if(keys[" "]){
        velocity.multiplyScalar(
            Math.max(
                0,
                1-data.brake*dt*.05
            )
        );
    }


    /* direção */

    const speed =
    velocity.length();


    if(speed>.5){

        let steer=0;

        if(keys["a"])
            steer=1;

        if(keys["d"])
            steer=-1;


        const steerStrength =
        Math.min(
            1,
            speed/data.maxSpeed
        )*.055;


        carro.rotation.y +=
        steer *
        steerStrength *
        (forwardSpeed>=0?1:-1);

    }


    /* movimento */

    const next =
    carro.position.clone();

    next.addScaledVector(
        velocity,
        dt
    );


    /* limites */

    next.x =
    Math.max(
        -370,
        Math.min(370,next.x)
    );

    next.z =
    Math.max(
        -370,
        Math.min(370,next.z)
    );


    if(
        !colideObstaculo(
            next,
            1.8
        )
    ){

        carro.position.copy(next);

    }else{

        velocity.multiplyScalar(-.25);

    }


    /* rodas */

    for(
        const wheel of
        data.wheels
    ){

        wheel.rotation.x -=
        speed*dt*1.8;

    }

}


/* =========================================================
   COLISÃO
========================================================= */

function colideObstaculo(pos,radius){

    for(
        const o of obstacles
    ){

        const closestX =
        Math.max(
            o.x-o.w/2,
            Math.min(
                pos.x,
                o.x+o.w/2
            )
        );

        const closestZ =
        Math.max(
            o.z-o.d/2,
            Math.min(
                pos.z,
                o.z+o.d/2
            )
        );

        const dx =
        pos.x-closestX;

        const dz =
        pos.z-closestZ;

        if(
            dx*dx+
            dz*dz <
            radius*radius
        ){

            return true;

        }

    }

    return false;

}


/* =========================================================
   COLISÃO ENTRE CARROS
========================================================= */

function colisaoCarros(){

    for(
        const other of traffic
    ){

        const distance =
        carro.position.distanceTo(
            other.position
        );

        if(distance<3.5){

            const push =
            carro.position.clone()
            .sub(other.position)
            .normalize();


            carro.position.addScaledVector(
                push,
                .4
            );

            carro.userData.velocity.multiplyScalar(
                .35
            );

        }

    }

}


/* =========================================================
   TRÂNSITO
========================================================= */

function atualizarTransito(dt){

    for(
        const car of traffic
    ){

        const direction =
        car.userData.direction;


        /*
           O carro anda exatamente na direção
           para a qual sua frente aponta.
        */

        car.position.addScaledVector(
            direction,
            car.userData.speed*dt
        );


        /*
           Garante novamente que a frente
           esteja alinhada com o movimento.
        */

        const target =
        car.position.clone()
        .add(direction);

        car.lookAt(target);


        for(
            const wheel of
            car.userData.wheels
        ){

            wheel.rotation.x -=
            car.userData.speed*dt*1.8;

        }


        if(
            Math.abs(car.position.x)>360 ||
            Math.abs(car.position.z)>360
        ){

            car.position.copy(
                direction.clone()
                .multiplyScalar(-350)
            );

            /*
               Ajusta para uma rua válida.
            */

            if(Math.abs(direction.x)>0){

                car.position.z =
                [-80,0,80][
                    Math.floor(
                        Math.random()*3
                    )
                ];

            }else{

                car.position.x =
                [-80,0,80][
                    Math.floor(
                        Math.random()*3
                    )
                ];

            }

        }

    }

}


/* =========================================================
   NPC
========================================================= */

function atualizarNPC(dt){

    for(
        const npc of npcs
    ){

        npc.userData.angle +=
        (Math.random()-.5)*dt*.4;


        const direction =
        new THREE.Vector3(
            Math.sin(
                npc.userData.angle
            ),
            0,
            Math.cos(
                npc.userData.angle
            )
        );


        const next =
        npc.position.clone();

        next.addScaledVector(
            direction,
            npc.userData.speed*dt
        );


        if(
            !colideObstaculo(
                next,
                .7
            ) &&
            Math.abs(next.x)<300 &&
            Math.abs(next.z)<300
        ){

            npc.position.copy(next);

        }else{

            npc.userData.angle +=
            Math.PI/2;

        }


        npc.rotation.y =
        Math.atan2(
            direction.x,
            direction.z
        );


        animarPessoa(
            npc,
            dt,
            true
        );

    }

}


function animarPessoa(
    person,
    dt,
    walking
){

    person.userData.walkTime +=
    dt*8;


    const t =
    person.userData.walkTime;


    const amount =
    walking?.45:0;


    if(person.userData.legs){

        person.userData.legs[0]
        .rotation.x =
        Math.sin(t)*amount;

        person.userData.legs[1]
        .rotation.x =
        -Math.sin(t)*amount;

    }


    if(person.userData.arms){

        person.userData.arms[0]
        .rotation.x =
        -Math.sin(t)*amount;

        person.userData.arms[1]
        .rotation.x =
        Math.sin(t)*amount;

    }

}


/* =========================================================
   CÂMERA
========================================================= */

function atualizarCamera(dt){

    const target =
    noCarro
    ? carro.position
    : player.position;


    const distance =
    noCarro?10:7;

    const height =
    noCarro?5:4.5;


    const offset =
    new THREE.Vector3(
        Math.sin(yaw)*distance,
        height,
        Math.cos(yaw)*distance
    );


    const desired =
    target.clone()
    .add(offset);


    camera.position.lerp(
        desired,
        Math.min(1,dt*6)
    );


    const look =
    target.clone();

    look.y +=
    noCarro?1.5:2;


    camera.lookAt(look);

}

========================================================= */

const missionPos =
new THREE.Vector3(
    -70,
    0,
    -70
);


const marker =
new THREE.Mesh(

    })

    const pos =

    if(

            missionPos

========================================================= */

function animarMarker(time){

    marker.rotation.y =
    time*.001;

    marker.position.y =
    .3+
    Math.sin(time*.003)*.2;

}

========================================================= */

window.addEventListener(
"resize",
()=>{

    camera.aspect =
    innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

});


/* =========================================================
   LOOP
========================================================= */

const clock =
new THREE.Clock();


function animate(time){

    requestAnimationFrame(
        animate
    );


    const dt =
    Math.min(
        clock.getDelta(),
        .05
    );


    if(noCarro){

        moverCarro(dt);

        /*
           Esconde o personagem dentro do carro.
        */

        player.visible=false;

    }else{

        player.visible=true;

        moverPessoa(dt);

    }


    atualizarTransito(dt);

    atualizarNPC(dt);

    colisaoCarros();

    atualizarCamera(dt);

    atualizarMissao();

    animarMarker(time);


    renderer.render(
        scene,
        camera
    );

}


animate(0);
