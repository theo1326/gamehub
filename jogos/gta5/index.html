<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ludix City 3D</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

/* HUD */

#hud{
    position:fixed;
    top:15px;
    left:15px;
    z-index:20;
    color:white;
}

.box{
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(8px);
    padding:12px 18px;
    border-radius:12px;
    margin-bottom:8px;
    border:1px solid rgba(255,255,255,.15);
}

#vida{
    width:210px;
    height:16px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
    margin-top:6px;
}

#barra{
    width:100%;
    height:100%;
    background:#16d95b;
}

/* missão */

#missao{
    position:fixed;
    top:15px;
    right:15px;
    z-index:20;
    color:white;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(8px);
    padding:16px;
    border-radius:12px;
    min-width:240px;
    border:1px solid rgba(255,255,255,.15);
}

/* controles */

#controles{
    position:fixed;
    bottom:15px;
    left:15px;
    z-index:20;
    color:white;
    background:rgba(0,0,0,.72);
    padding:12px 16px;
    border-radius:12px;
    line-height:1.6;
}

/* mensagem */

#mensagem{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    z-index:30;

    color:white;
    background:rgba(0,0,0,.85);

    padding:12px 24px;
    border-radius:25px;

    opacity:0;
    transition:.3s;
}

/* mira */

#mira{
    position:fixed;
    left:50%;
    top:50%;
    width:16px;
    height:16px;
    transform:translate(-50%,-50%);
    z-index:15;
    pointer-events:none;
}

#mira:before,
#mira:after{
    content:"";
    position:absolute;
    background:white;
}

#mira:before{
    width:16px;
    height:2px;
    top:7px;
}

#mira:after{
    width:2px;
    height:16px;
    left:7px;
}

</style>
</head>

<body>

    <div class="box">

        ❤️ VIDA

/* =====================================================
   FAIXAS DAS ESTRADAS
===================================================== */

function faixa(
    x,
    z,
    horizontal=true
){

    const geometry =
        new THREE.BoxGeometry(
            horizontal ? 7 : .35,
            .02,
            horizontal ? .35 : 7
        );

    const material =
        new THREE.MeshBasicMaterial({
            color:0xffffff
        });

    const objeto =
        new THREE.Mesh(
            geometry,
            material
        );

    objeto.position.set(
        x,
        .09,
        z
    );

    scene.add(objeto);
}

    let x=-230;
    x<230;
    x+=14
){

    faixa(
        x,
        0,
        true

    faixa(
        x,
        80,
        true
    );

    faixa(
        x,

}

){

/* =====================================================
   PRÉDIOS
===================================================== */

const coresPredios=[
    0x626878,
    0x765f55,
    0x496274,
    0x777777,
    0x5c596f,
    0x80634b
];


function criarPredio(
    x,
    z,
    largura,
    profundidade,
    altura,
    cor
){

    const grupo =
        new THREE.Group();


    const edificio =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                largura,
                altura,
                profundidade
            ),
            new THREE.MeshStandardMaterial({
                color:cor,
                roughness:.8
            })
        );

    edificio.position.y=
        altura/2;

    edificio.castShadow=true;
    edificio.receiveShadow=true;

    grupo.add(edificio);


    /* telhado */

    const teto =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                largura+.3,
                .4,
                profundidade+.3
            ),
            new THREE.MeshStandardMaterial({
                color:0x333333
            })
        );

    teto.position.y=
        altura+.2;

    teto.castShadow=true;

    grupo.add(teto);


    /* janelas */

    const janelaMaterial =
        new THREE.MeshBasicMaterial({
            color:0xffe48a
        });


    for(
        let y=4;
        y<altura-1;
        y+=4
    ){

        for(
            let wx=-largura/2+2;
            wx<largura/2-1;
            wx+=4
        ){

            const janela =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        1.4,
                        1.5,
                        .08
                    ),
                    janelaMaterial
                );

            janela.position.set(
                wx,
                y,
                profundidade/2+.05
            );

            grupo.add(janela);
        }
    }


    grupo.position.set(
        x,
        0,
        z
    );

    scene.add(grupo);
}


/* cidade */

    x<=220;

/* =====================================================
   PERSONAGEM
===================================================== */

function criarPersonagem(
    roupa=0x2255cc
){

    const personagem =
        new THREE.Group();


    /* corpo */

    const corpo =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .9,
                1.35,
                .55
            ),
            new THREE.MeshStandardMaterial({
                color:roupa
            })
        );

    corpo.position.y=1.55;

    corpo.castShadow=true;

    personagem.add(corpo);


    /* cabeça */

    const cabeca =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .38,
                18,
                18
            ),
            new THREE.MeshStandardMaterial({
                color:0xc68642
            })
        );

    cabeca.position.y=2.55;

    cabeca.castShadow=true;

    personagem.add(cabeca);


    /* cabelo */

    const cabelo =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .4,
                16,
                16
            ),
            new THREE.MeshStandardMaterial({
                color:0x24150d
            })
        );

    cabelo.scale.y=.5;

    cabelo.position.y=2.82;

    personagem.add(cabelo);


    /* braços */

    function criarBraco(
        lado
    ){

        const braco =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .28,
                    1.1,
                    .28
                ),
                new THREE.MeshStandardMaterial({
                    color:roupa
                })
            );

        braco.position.set(
            lado*.62,
            1.55,
            0
        );

        braco.castShadow=true;

        personagem.add(braco);

        return braco;
    }


    const bracoE=
        criarBraco(-1);

    const bracoD=
        criarBraco(1);


    /* pernas */

    function criarPerna(
        lado
    ){

        const perna =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .3,
                    1.1,
                    .3
                ),
                new THREE.MeshStandardMaterial({
                    color:0x222222
                })
            );

        perna.position.set(
            lado*.23,
            .55,
            0
        );

        perna.castShadow=true;

        personagem.add(perna);

        return perna;
    }


    const pernaE=
        criarPerna(-1);

    const pernaD=
        criarPerna(1);


    personagem.userData={
        bracoE,
        bracoD,
        pernaE,
        pernaD,
        andando:false,
        fase:Math.random()*10
    };


    return personagem;
}

/* =====================================================
   CARRO
===================================================== */

function criarCarro(
    cor
){

    const carro =
        new THREE.Group();


    /* carroceria */

    const carroceria =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.2,
                .75,
                2
            ),
            new THREE.MeshStandardMaterial({
                color:cor,
                metalness:.2,
                roughness:.35
            })
        );

    carroceria.position.y=.8;

    carroceria.castShadow=true;

    carro.add(carroceria);


    /* cabine */

    const cabine =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.2,
                .9,
                1.65
            ),
            new THREE.MeshStandardMaterial({
                color:0x101820,
                metalness:.1,
                roughness:.2
            })
        );

    cabine.position.y=1.45;

    cabine.castShadow=true;

    carro.add(cabine);


    /* rodas */

    const rodaGeo =
        new THREE.CylinderGeometry(
            .48,
            .48,
            .38,
            18
        );

    const rodaMat =
        new THREE.MeshStandardMaterial({
            color:0x111111,
            roughness:.9
        });


    const rodas=[
        [-1.45,.48,-1],
        [1.45,.48,-1],
        [-1.45,.48,1],
        [1.45,.48,1]
    ];


    rodas.forEach(
        pos=>{

            const roda=
                new THREE.Mesh(
                    rodaGeo,
                    rodaMat
                );

            roda.rotation.z=
                Math.PI/2;

            roda.position.set(
                pos[0],
                pos[1],
                pos[2]
            );

            roda.castShadow=true;

            carro.add(roda);
        }
    );


    /* faróis */

    const farolMat=
        new THREE.MeshBasicMaterial({
            color:0xffffcc
        });


    for(
        const lado of [-1,1]
    ){

        const farol=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .25,
                    .25,
                    .1
                ),
                farolMat
            );

        farol.position.set(
            -2.1,
            .9,
            lado*.65
        );

        carro.add(farol);
    }


    return carro;
}

/* =====================================================
   CONTROLES
===================================================== */

const teclas={};

window.addEventListener(

    e=>{

    }

/* =====================================================
   ESTADO
===================================================== */

let dentroDoCarro=false;

let velocidadeCarro=0;

let dinheiro=1000;

let vida=100;

let procurado=0;

let tempoAnimacao=0;


/* =====================================================
   ENTRAR NO CARRO
===================================================== */

function entrarCarro(){

    const distancia=
        jogador.position.distanceTo(
            carro.position
        );


    if(
        !dentroDoCarro &&
        distancia<5
    ){

        dentroDoCarro=true;

        jogador.visible=false;

        mensagem(
            "🚗 Você entrou no carro!"
        );

    }
    else if(
        dentroDoCarro
    ){

        dentroDoCarro=false;

        jogador.visible=true;

        jogador.position.copy(
            carro.position
        );

        jogador.position.x+=3;

        mensagem(
            "🚶 Você saiu do carro!"
        );
    }
}


/* =====================================================
   ANIMAÇÃO DE CAMINHADA
===================================================== */

function animarPersonagem(
    personagem,
    andando
){

    const dados=
        personagem.userData;


    if(
        !dados.pernaE
    ){

        return;
    }


    if(
        andando
    ){

        dados.fase+=.18;

        const movimento=
            Math.sin(
                dados.fase
            )*.65;


        dados.pernaE.rotation.x=
            movimento;

        dados.pernaD.rotation.x=
            -movimento;


        dados.bracoE.rotation.x=
            -movimento*.7;

        dados.bracoD.rotation.x=
            movimento*.7;


        personagem.position.y=
            Math.abs(
                Math.sin(
                    dados.fase*2
                )
            )*.035;

    }
    else{

        dados.pernaE.rotation.x=
            THREE.MathUtils.lerp(
                dados.pernaE.rotation.x,
                0,
                .2
            );

        dados.pernaD.rotation.x=
            THREE.MathUtils.lerp(
                dados.pernaD.rotation.x,
                0,
                .2
            );

        dados.bracoE.rotation.x=
            THREE.MathUtils.lerp(
                dados.bracoE.rotation.x,
                0,
                .2
            );

        dados.bracoD.rotation.x=
            THREE.MathUtils.lerp(
                dados.bracoD.rotation.x,
                0,
                .2
            );

        personagem.position.y=
            THREE.MathUtils.lerp(
                personagem.position.y,
                0,
                .2
            );
    }
}


/* =====================================================
   MOVIMENTO DO JOGADOR
===================================================== */

function atualizarJogador(){

    if(
        dentroDoCarro
    ){

        moverCarro();

        return;
    }


    const direcao=
        new THREE.Vector3();


    if(teclas["w"])
        direcao.z-=1;

    if(teclas["s"])
        direcao.z+=1;

    if(teclas["a"])
        direcao.x-=1;

    if(teclas["d"])
        direcao.x+=1;


    const andando=
        direcao.length()>0;


    animarPersonagem(
        jogador,
        andando
    );


    if(
        andando
    ){

        direcao.normalize();


        const velocidade=
            teclas["shift"]
            ? .23
            : .11;


        jogador.position.add(
            direcao.multiplyScalar(
                velocidade
            )
        );


        jogador.rotation.y=
            Math.atan2(
                direcao.x,
                direcao.z
            );
    }
}


/* =====================================================
   MOVIMENTO DOS NPCs
===================================================== */

function atualizarNPCs(){

    npcs.forEach(
        npc=>{

            const dados=
                npc.userData;


            dados.troca--;


            if(
                dados.troca<=0
            ){

                dados.direcao+=
                    (Math.random()-.5)
                    *.8;

                dados.troca=
                    100+
                    Math.random()*200;
            }


            const direcao=
                new THREE.Vector3(
                    Math.sin(
                        dados.direcao
                    ),
                    0,
                    Math.cos(
                        dados.direcao
                    )
                );


            npc.position.add(
                direcao.multiplyScalar(
                    dados.velocidade
                )
            );


            npc.rotation.y=
                dados.direcao;


            animarPersonagem(
                npc,
                true
            );


            if(
                Math.abs(
                    npc.position.x
                )>230
            ){

                dados.direcao=
                    Math.PI-
                    dados.direcao;
            }


            if(
                Math.abs(
                    npc.position.z
                )>230
            ){

                dados.direcao=
                    -dados.direcao;
            }
        }
    );
}


/* =====================================================
   CARRO
===================================================== */

function moverCarro(){

    if(teclas["w"])
        velocidadeCarro+=.012;

    if(teclas["s"])
        velocidadeCarro-=.012;


    velocidadeCarro*=.97;


    velocidadeCarro=
        THREE.MathUtils.clamp(
            velocidadeCarro,
            -.4,
            .8
        );


    if(teclas["a"]){

        carro.rotation.y+=
            .035*
            Math.abs(
                velocidadeCarro
            );
    }


    if(teclas["d"]){

        carro.rotation.y-=
            .035*
            Math.abs(
                velocidadeCarro
            );
    }


    const frente=
        new THREE.Vector3(
            0,
            0,
            -1
        );


    frente.applyQuaternion(
        carro.quaternion
    );


    carro.position.add(
        frente.multiplyScalar(
            velocidadeCarro
        )
    );
}


/* =====================================================
   CÂMERA
===================================================== */

function atualizarCamera(){

    const alvo=
        dentroDoCarro
        ? carro
        : jogador;


    const distancia=
        dentroDoCarro
        ? 11
        : 9;


    const altura=
        dentroDoCarro
        ? 6
        : 5.5;


    const atras=
        new THREE.Vector3(
            0,
            altura,
            distancia
        );


    atras.applyQuaternion(
        alvo.quaternion
    );


    const destino=
        alvo.position
        .clone()
        .add(atras);


    camera.position.lerp(
        destino,
        .09
    );


    camera.lookAt(
        alvo.position.x,
        alvo.position.y+1.2,
        alvo.position.z
    );
}


/* =====================================================
   MISSÃO
===================================================== */

const marcador=
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            5,
            5,
            .2,
            40
        ),
        new THREE.MeshBasicMaterial({
            color:0xffcc00
        })
    );


marcador.position.set(
    -70,
    .2,
    -70
);


scene.add(marcador);


let missaoConcluida=false;


function verificarMissao(){

    if(
        missaoConcluida
    ){

        return;
    }


    const objeto=
        dentroDoCarro
        ? carro
        : jogador;


    const distancia=
        objeto.position.distanceTo(
            marcador.position
        );


    if(
        distancia<8
    ){

        missaoConcluida=true;

        dinheiro+=500;


        document.getElementById(
            "dinheiro"
        ).textContent=
            "$"+dinheiro;


        marcador.material.color
            .set(0x00ff55);


        document.getElementById(
            "missao"
        ).innerHTML=
            "✅ <b>MISSÃO CONCLUÍDA!</b><br><br>Você ganhou $500.";


        mensagem(
            "💰 +$500"
        );
    }
}


/* =====================================================
   LIMITES
===================================================== */

function limitar(
    objeto
){

    objeto.position.x=
        THREE.MathUtils.clamp(
            objeto.position.x,
            -235,
            235
        );


    objeto.position.z=
        THREE.MathUtils.clamp(
            objeto.position.z,
            -235,
            235
        );
}


/* =====================================================
   MENSAGEM
===================================================== */

let timerMensagem;


function mensagem(
    texto
){

    const elemento=
        document.getElementById(
            "mensagem"
        );


    elemento.textContent=
        texto;


    elemento.style.opacity=1;


    clearTimeout(
        timerMensagem
    );


    timerMensagem=
        setTimeout(
            ()=>{

                elemento.style.opacity=0;

            },
            2000
        );
}


/* =====================================================
   ANIMAÇÃO DO MARCADOR
===================================================== */

function animarMarcador(){

    marcador.rotation.y+=.015;

    marcador.position.y=
        .2+
        Math.sin(
            Date.now()*.003
        )*.12;
}


/* =====================================================
   LOOP
===================================================== */

function animar(){

    requestAnimationFrame(
        animar
    );


    atualizarJogador();

    atualizarNPCs();

    atualizarCamera();

    verificarMissao();

    animarMarcador();


    limitar(
        dentroDoCarro
        ? carro
        : jogador
    );


    renderer.render(
        scene,
        camera
    );
}


/* =====================================================
   REDIMENSIONAMENTO
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            window.innerWidth/
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =====================================================
   INICIAR
===================================================== */

animar();

</script>

</html>
