<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludix City 3D</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    top:15px;
    left:15px;
    z-index:10;
    color:white;
}

.box{
    background:rgba(0,0,0,.7);
    padding:12px 18px;
    border-radius:12px;
    margin-bottom:8px;
}

#vida{
    width:200px;
    height:16px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
    margin-top:5px;
}

#barra{
    width:100%;
    height:100%;
    background:#19d85b;
}

#missao{
    position:fixed;
    top:15px;
    right:15px;
    z-index:10;
    color:white;
    background:rgba(0,0,0,.7);
    padding:15px;
    border-radius:12px;
}

#controles{
    position:fixed;
    bottom:15px;
    left:15px;
    z-index:10;
    color:white;
    background:rgba(0,0,0,.7);
    padding:12px;
    border-radius:12px;
    line-height:1.6;
}

#mensagem{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.8);
    color:white;
    padding:12px 20px;
    border-radius:20px;
    opacity:0;
    transition:.3s;
    z-index:20;
}
</style>
</head>

<body>

<div id="hud">

    <div class="box">
        ❤️ VIDA
        <div id="vida">
            <div id="barra"></div>
        </div>
    </div>

    <div class="box">
        💰 DINHEIRO:
        <b id="dinheiro">$1000</b>
    </div>

    <div class="box">
        ⭐ PROCURADO:
        <b id="procurado">0</b>
    </div>

</div>

<div id="missao">
    🎯 <b>MISSÃO</b>
    <br><br>
    Vá até o marcador amarelo.
</div>

<div id="controles">
    <b>🎮 CONTROLES</b><br>
    W A S D — andar<br>
    SHIFT — correr<br>
    E — entrar no carro<br>
    Mouse — olhar
</div>

<div id="mensagem"></div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================
   CENA
========================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);

scene.fog =
    new THREE.Fog(
        0x87ceeb,
        100,
        450
    );


/* =========================
   CÂMERA
========================= */

const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );

camera.position.set(
    12,
    8,
    18
);


/* =========================
   RENDERIZADOR
========================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

document.body.appendChild(
    renderer.domElement
);


/* =========================
   ILUMINAÇÃO
========================= */

const luz =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

luz.position.set(
    100,
    150,
    100
);

luz.castShadow = true;

scene.add(luz);


const ambiente =
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        1.2
    );

scene.add(ambiente);


/* =========================
   CHÃO
========================= */

const chao =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            500,
            500
        ),
        new THREE.MeshStandardMaterial({
            color:0x287a38
        })
    );

chao.rotation.x =
    -Math.PI / 2;

chao.receiveShadow = true;

scene.add(chao);


/* =========================
   ESTRADAS
========================= */

function estrada(
    x,
    z,
    largura,
    profundidade
){

    const rua =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                largura,
                .1,
                profundidade
            ),
            new THREE.MeshStandardMaterial({
                color:0x292929
            })
        );

    rua.position.set(
        x,
        .05,
        z
    );

    rua.receiveShadow = true;

    scene.add(rua);
}

estrada(0,0,500,25);
estrada(0,80,500,25);
estrada(0,-80,500,25);

estrada(0,0,25,500);
estrada(80,0,25,500);
estrada(-80,0,25,500);


/* =========================
   PRÉDIOS
========================= */

function predio(
    x,
    z,
    altura,
    largura,
    cor
){

    const edificio =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                largura,
                altura,
                largura
            ),
            new THREE.MeshStandardMaterial({
                color:cor
            })
        );

    edificio.position.set(
        x,
        altura/2,
        z
    );

    edificio.castShadow = true;
    edificio.receiveShadow = true;

    scene.add(edificio);
}


/* cidade */

const cores = [
    0x666666,
    0x555577,
    0x884444,
    0x426070,
    0x806040
];

for(
    let x=-200;
    x<=200;
    x+=40
){

    for(
        let z=-200;
        z<=200;
        z+=40
    ){

        if(
            Math.abs(x)<30 ||
            Math.abs(z)<30 ||
            Math.abs(x-80)<30 ||
            Math.abs(z-80)<30 ||
            Math.abs(x+80)<30 ||
            Math.abs(z+80)<30
        ){
            continue;
        }

        const altura =
            15 +
            Math.random()*45;

        const cor =
            cores[
                Math.floor(
                    Math.random()*
                    cores.length
                )
            ];

        predio(
            x,
            z,
            altura,
            25,
            cor
        );
    }
}


/* =========================
   PERSONAGEM
========================= */

const jogador =
    new THREE.Group();

scene.add(jogador);


/* corpo */

const corpo =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.2,
            2,
            .7
        ),
        new THREE.MeshStandardMaterial({
            color:0x2255cc
        })
    );

corpo.position.y=1;

corpo.castShadow=true;

jogador.add(corpo);


/* cabeça */

const cabeca =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .45,
            20,
            20
        ),
        new THREE.MeshStandardMaterial({
            color:0xc68642
        })
    );

cabeca.position.y=2.35;

cabeca.castShadow=true;

jogador.add(cabeca);


jogador.position.set(
    0,
    0,
    10
);


/* =========================
   CARRO
========================= */

function criarCarro(
    cor
){

    const carro =
        new THREE.Group();


    const base =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4,
                .8,
                2
            ),
            new THREE.MeshStandardMaterial({
                color:cor
            })
        );

    base.position.y=.8;

    base.castShadow=true;

    carro.add(base);


    const teto =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.2,
                .9,
                1.7
            ),
            new THREE.MeshStandardMaterial({
                color:0x111827
            })
        );

    teto.position.y=1.45;

    teto.castShadow=true;

    carro.add(teto);


    const rodaGeo =
        new THREE.CylinderGeometry(
            .45,
            .45,
            .35,
            16
        );

    const rodaMat =
        new THREE.MeshStandardMaterial({
            color:0x111111
        });


    const rodas = [
        [-1.35,.45,-1],
        [1.35,.45,-1],
        [-1.35,.45,1],
        [1.35,.45,1]
    ];


    rodas.forEach(
        pos=>{

            const roda =
                new THREE.Mesh(
                    rodaGeo,
                    rodaMat
                );

            roda.rotation.z =
                Math.PI/2;

            roda.position.set(
                pos[0],
                pos[1],
                pos[2]
            );

            carro.add(roda);
        }
    );

    return carro;
}


const carro =
    criarCarro(
        0xff2222
    );

carro.position.set(
    8,
    0,
    10
);

scene.add(carro);


/* =========================
   MISSÃO
========================= */

const marcador =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            5,
            5,
            .2,
            32
        ),
        new THREE.MeshBasicMaterial({
            color:0xffcc00
        })
    );

marcador.position.set(
    -70,
    .2,
    -70
);

scene.add(marcador);


/* =========================
   CONTROLES
========================= */

const teclas={};

window.addEventListener(
    "keydown",
    e=>{
        teclas[
            e.key.toLowerCase()
        ]=true;

        if(
            e.key.toLowerCase()==="e"
        ){
            entrarCarro();
        }
    }
);

window.addEventListener(
    "keyup",
    e=>{
        teclas[
            e.key.toLowerCase()
        ]=false;
    }
);


/* =========================
   ESTADO
========================= */

let dentroDoCarro=false;

let velocidadeCarro=0;

let dinheiro=1000;

let vida=100;

let procurado=0;


/* =========================
   ENTRAR NO CARRO
========================= */

function entrarCarro(){

    const distancia =
        jogador.position.distanceTo(
            carro.position
        );

    if(
        !dentroDoCarro &&
        distancia<5
    ){

        dentroDoCarro=true;

        jogador.visible=false;

        mensagem(
            "🚗 Você entrou no carro!"
        );

    }else if(
        dentroDoCarro
    ){

        dentroDoCarro=false;

        jogador.visible=true;

        jogador.position.copy(
            carro.position
        );

        jogador.position.x+=3;

        mensagem(
            "🚶 Você saiu do carro!"
        );
    }
}


/* =========================
   MOVIMENTO
========================= */

function atualizar(){

    if(dentroDoCarro){

        moverCarro();

        camera.position.lerp(
            new THREE.Vector3(
                carro.position.x,
                carro.position.y+7,
                carro.position.z+12
            ),
            .08
        );

        camera.lookAt(
            carro.position
        );

        return;
    }


    const direcao =
        new THREE.Vector3();


    if(teclas["w"])
        direcao.z-=1;

    if(teclas["s"])
        direcao.z+=1;

    if(teclas["a"])
        direcao.x-=1;

    if(teclas["d"])
        direcao.x+=1;


    if(
        direcao.length()>0
    ){

        direcao.normalize();

        const velocidade =
            teclas["shift"]
            ? .25
            : .12;

        jogador.position.add(
            direcao.multiplyScalar(
                velocidade
            )
        );

        jogador.rotation.y =
            Math.atan2(
                direcao.x,
                direcao.z
            );
    }


    camera.position.lerp(
        new THREE.Vector3(
            jogador.position.x,
            jogador.position.y+7,
            jogador.position.z+12
        ),
        .08
    );

    camera.lookAt(
        jogador.position
    );
}


/* =========================
   MOVIMENTO DO CARRO
========================= */

function moverCarro(){

    if(teclas["w"])
        velocidadeCarro+=.01;

    if(teclas["s"])
        velocidadeCarro-=.01;

    velocidadeCarro*=.97;

    velocidadeCarro=
        Math.max(
            -.4,
            Math.min(
                .8,
                velocidadeCarro
            )
        );


    if(teclas["a"])
        carro.rotation.y+=
            .035*
            Math.abs(
                velocidadeCarro
            );

    if(teclas["d"])
        carro.rotation.y-=
            .035*
            Math.abs(
                velocidadeCarro
            );


    const frente =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    frente.applyQuaternion(
        carro.quaternion
    );

    carro.position.add(
        frente.multiplyScalar(
            velocidadeCarro
        )
    );
}


/* =========================
   MISSÃO
========================= */

function verificarMissao(){

    const distancia =
        jogador.position.distanceTo(
            marcador.position
        );

    if(
        distancia<8
    ){

        marcador.material.color
            .set(0x00ff55);

        dinheiro+=500;

        document.getElementById(
            "dinheiro"
        ).textContent=
            "$"+dinheiro;

        document.getElementById(
            "missao"
        ).innerHTML=
            "✅ <b>MISSÃO CONCLUÍDA!</b><br><br>Você ganhou $500.";

        mensagem(
            "💰 +$500"
        );
    }
}


/* =========================
   MENSAGEM
========================= */

let timer;

function mensagem(texto){

    const elemento =
        document.getElementById(
            "mensagem"
        );

    elemento.textContent=
        texto;

    elemento.style.opacity=1;

    clearTimeout(timer);

    timer=setTimeout(
        ()=>{
            elemento.style.opacity=0;
        },
        2000
    );
}


/* =========================
   LIMITES
========================= */

function limites(objeto){

    objeto.position.x=
        Math.max(
            -235,
            Math.min(
                235,
                objeto.position.x
            )
        );

    objeto.position.z=
        Math.max(
            -235,
            Math.min(
                235,
                objeto.position.z
            )
        );
}


/* =========================
   LOOP
========================= */

function animar(){

    requestAnimationFrame(
        animar
    );

    atualizar();

    limites(
        dentroDoCarro
        ? carro
        : jogador
    );

    verificarMissao();

    marcador.rotation.y+=.01;

    renderer.render(
        scene,
        camera
    );
}


/* =========================
   TELA
========================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            window.innerWidth/
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================
   INICIAR
========================= */

animar();

</script>

</body>
</html>
