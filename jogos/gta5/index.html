<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludix City 3D</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;
    color: white;
    user-select: none;
}

.hud-box {
    background: rgba(0,0,0,.65);
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 8px;
    border: 1px solid rgba(255,255,255,.15);
}

#health {
    width: 220px;
    height: 18px;
    background: #333;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 5px;
}

#healthBar {
    width: 100%;
    height: 100%;
    background: #21d65a;
    transition: .2s;
}

#money {
    color: #55ff75;
    font-size: 20px;
    font-weight: bold;
}

#mission {
    position: fixed;
    top: 15px;
    right: 15px;
    color: white;
    background: rgba(0,0,0,.65);
    padding: 15px 20px;
    border-radius: 12px;
    z-index: 10;
    max-width: 280px;
}

#controls {
    position: fixed;
    bottom: 15px;
    left: 15px;
    color: white;
    background: rgba(0,0,0,.65);
    padding: 12px 16px;
    border-radius: 12px;
    z-index: 10;
    line-height: 1.6;
}

#message {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%);
    color: white;
    background: rgba(0,0,0,.8);
    padding: 12px 22px;
    border-radius: 20px;
    opacity: 0;
    transition: .3s;
    z-index: 20;
}

#crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 14px;
    height: 14px;
    transform: translate(-50%, -50%);
    z-index: 5;
    pointer-events: none;
}

#crosshair::before,
#crosshair::after {
    content: "";
    position: absolute;
    background: white;
}

#crosshair::before {
    width: 14px;
    height: 2px;
    top: 6px;
}

#crosshair::after {
    width: 2px;
    height: 14px;
    left: 6px;
}
</style>
</head>

<body>

<div id="hud">

    <div class="hud-box">
        ❤️ VIDA
        <div id="health">
            <div id="healthBar"></div>
        </div>
    </div>

    <div class="hud-box">
        💰 DINHEIRO
        <div id="money">$1000</div>
    </div>

    <div class="hud-box">
        ⭐ PROCURADO: <span id="wanted">0</span>
    </div>

</div>

<div id="mission">
    <b>🎯 MISSÃO</b>
    <p id="missionText">Vá até o marcador amarelo.</p>
</div>

<div id="controls">
    <b>🎮 CONTROLES</b><br>
    W A S D — Mover<br>
    SHIFT — Correr<br>
    E — Entrar/Sair do carro<br>
    Mouse — Câmera<br>
    Clique — Atirar
</div>

<div id="crosshair"></div>

<div id="message"></div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


/* =========================
   CENA
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(
    0x87ceeb,
    80,
    500
);


/* =========================
   CÂMERA
========================= */

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(
    10,
    8,
    15
);


/* =========================
   RENDER
========================= */

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* =========================
   LUZ
========================= */

const sun = new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(
    100,
    150,
    100
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

scene.add(sun);


const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x444444,
    1.2
);

scene.add(ambient);


/* =========================
   CHÃO
========================= */

const groundGeometry =
    new THREE.PlaneGeometry(
        500,
        500
    );

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x287a38
    });

const ground =
    new THREE.Mesh(
        groundGeometry,
        groundMaterial
    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================
   ESTRADAS
========================= */

function createRoad(
    x,
    z,
    width,
    depth
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            0.08,
            depth
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x252525
        });

    const road =
        new THREE.Mesh(
            geometry,
            material
        );

    road.position.set(
        x,
        0.04,
        z
    );

    road.receiveShadow = true;

    scene.add(road);

    return road;
}


/* ruas principais */

createRoad(0, 0, 500, 25);
createRoad(0, 80, 500, 25);
createRoad(0, -80, 500, 25);

createRoad(0, 0, 25, 500);
createRoad(80, 0, 25, 500);
createRoad(-80, 0, 25, 500);


/* =========================
   PRÉDIOS
========================= */

const buildings = [];

function createBuilding(
    x,
    z,
    width,
    height,
    depth,
    color
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: color
        });

    const building =
        new THREE.Mesh(
            geometry,
            material
        );

    building.position.set(
        x,
        height / 2,
        z
    );

    building.castShadow = true;
    building.receiveShadow = true;

    scene.add(building);

    buildings.push(building);

    /* janelas */

    const windowMaterial =
        new THREE.MeshBasicMaterial({
            color: 0xffff88
        });

    for (
        let y = 5;
        y < height - 1;
        y += 5
    ) {

        for (
            let wx = -width / 2 + 2;
            wx < width / 2 - 1;
            wx += 4
        ) {

            const window =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        1.3,
                        1.8,
                        0.15
                    ),
                    windowMaterial
                );

            window.position.set(
                x + wx,
                y,
                z - depth / 2 - 0.1
            );

            scene.add(window);
        }
    }

    return building;
}


/* cidade */

const colors = [
    0x777777,
    0x555577,
    0x884444,
    0x666666,
    0x3f596b,
    0x806040
];

for (
    let x = -200;
    x <= 200;
    x += 40
) {

    for (
        let z = -200;
        z <= 200;
        z += 40
    ) {

        if (
            Math.abs(x) < 30 ||
            Math.abs(z) < 30 ||
            Math.abs(x - 80) < 30 ||
            Math.abs(z - 80) < 30 ||
            Math.abs(x + 80) < 30 ||
            Math.abs(z + 80) < 30
        ) {
            continue;
        }

        const height =
            15 + Math.random() * 45;

        createBuilding(
            x + (Math.random() * 8 - 4),
            z + (Math.random() * 8 - 4),
            25,
            height,
            25,
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ]
        );
    }
}


/* =========================
   PERSONAGEM
========================= */

const player =
    new THREE.Group();

scene.add(player);

const body =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.2,
            2,
            0.7
        ),
        new THREE.MeshStandardMaterial({
            color: 0x2244aa
        })
    );

body.position.y = 1;

body.castShadow = true;

player.add(body);


const head =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            0.45,
            16,
            16
        ),
        new THREE.MeshStandardMaterial({
            color: 0xc68642
        })
    );

head.position.y = 2.35;

head.castShadow = true;

player.add(head);


player.position.set(
    0,
    0,
    10
);


/* =========================
   CARRO
========================= */

function createCar(
    color = 0xff2222
) {

    const car =
        new THREE.Group();

    const base =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4,
                0.8,
                2
            ),
            new THREE.MeshStandardMaterial({
                color: color
            })
        );

    base.position.y = 0.8;
    base.castShadow = true;

    car.add(base);


    const cabin =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.1,
                0.9,
                1.7
            ),
            new THREE.MeshStandardMaterial({
                color: 0x111827
            })
        );

    cabin.position.set(
        0,
        1.45,
        0
    );

    cabin.castShadow = true;

    car.add(cabin);


    const wheelGeometry =
        new THREE.CylinderGeometry(
            0.45,
            0.45,
            0.35,
            16
        );

    const wheelMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x111111
        });


    const wheelPositions = [
        [-1.35, 0.45, -1],
        [1.35, 0.45, -1],
        [-1.35, 0.45, 1],
        [1.35, 0.45, 1]
    ];


    wheelPositions.forEach(
        position => {

            const wheel =
                new THREE.Mesh(
                    wheelGeometry,
                    wheelMaterial
                );

            wheel.rotation.z =
                Math.PI / 2;

            wheel.position.set(
                ...position
            );

            wheel.castShadow = true;

            car.add(wheel);
        }
    );

    return car;
}


const car =
    createCar(0xff2222);

car.position.set(
    10,
    0,
    10
);

scene.add(car);


/* =========================
   CARROS DA CIDADE
========================= */

for (
    let i = 0;
    i < 12;
    i++
) {

    const npcCar =
        createCar(
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ]
        );

    npcCar.position.set(
        (Math.random() - .5) * 350,
        0,
        (Math.random() - .5) * 350
    );

    npcCar.rotation.y =
        Math.random() *
        Math.PI *
        2;

    scene.add(npcCar);
}


/* =========================
   NPCs
========================= */

const npcs = [];

function createNPC() {

    const npc =
        new THREE.Group();

    const npcBody =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .8,
                1.6,
                .5
            ),
            new THREE.MeshStandardMaterial({
                color:
                    Math.random() *
                    0xffffff
            })
        );

    npcBody.position.y = .8;

    npc.add(npcBody);


    const npcHead =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .3,
                12,
                12
            ),
            new THREE.MeshStandardMaterial({
                color: 0xc68642
            })
        );

    npcHead.position.y = 1.8;

    npc.add(npcHead);


    npc.position.set(
        (Math.random() - .5) * 350,
        0,
        (Math.random() - .5) * 350
    );

    scene.add(npc);

    npcs.push(npc);
}


for (
    let i = 0;
    i < 35;
    i++
) {
    createNPC();
}


/* =========================
   MISSÃO
========================= */

const mission =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            5,
            5,
            .2,
            32
        ),
        new THREE.MeshBasicMaterial({
            color: 0xffcc00
        })
    );

mission.position.set(
    -70,
    .2,
    -70
);

scene.add(mission);

let missionCompleted = false;


/* =========================
   CONTROLES
========================= */

const keys = {};

window.addEventListener(
    "keydown",
    event => {

        keys[event.key.toLowerCase()] = true;

        if (
            event.key.toLowerCase() === "e"
        ) {

            toggleCar();
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[event.key.toLowerCase()] =
            false;
    }
);


/* =========================
   ESTADO DO JOGADOR
========================= */

let health = 100;
let money = 1000;
let wanted = 0;

let inCar = false;

let speed = 0.12;

let carSpeed = 0;

let velocity =
    new THREE.Vector3();


/* =========================
   ENTRAR NO CARRO
========================= */

function toggleCar() {

    const distance =
        player.position.distanceTo(
            car.position
        );

    if (!inCar && distance < 5) {

        inCar = true;

        player.visible = false;

        showMessage(
            "🚗 Você entrou no carro!"
        );

    }
    else if (inCar) {

        inCar = false;

        player.visible = true;

        player.position.copy(
            car.position
        );

        player.position.x += 3;

        showMessage(
            "🚶 Você saiu do carro."
        );
    }
}


/* =========================
   ATUALIZAR JOGADOR
========================= */

function updatePlayer() {

    if (inCar) {

        updateCar();

        return;
    }

    const direction =
        new THREE.Vector3();

    if (keys["w"])
        direction.z -= 1;

    if (keys["s"])
        direction.z += 1;

    if (keys["a"])
        direction.x -= 1;

    if (keys["d"])
        direction.x += 1;

    if (
        direction.length() > 0
    ) {

        direction.normalize();

        const currentSpeed =
            keys["shift"]
            ? speed * 2
            : speed;

        player.position.add(
            direction.multiplyScalar(
                currentSpeed
            )
        );

        player.rotation.y =
            Math.atan2(
                direction.x,
                direction.z
            );
    }
}


/* =========================
   ATUALIZAR CARRO
========================= */

function updateCar() {

    if (keys["w"])
        carSpeed += .01;

    if (keys["s"])
        carSpeed -= .01;

    carSpeed *= .97;

    carSpeed =
        THREE.MathUtils.clamp(
            carSpeed,
            -.4,
            .8
        );

    if (keys["a"])
        car.rotation.y +=
            .035 *
            Math.abs(carSpeed);

    if (keys["d"])
        car.rotation.y -=
            .035 *
            Math.abs(carSpeed);


    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    forward.applyQuaternion(
        car.quaternion
    );

    car.position.add(
        forward.multiplyScalar(
            carSpeed
        )
    );
}


/* =========================
   CÂMERA
========================= */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.enablePan = false;

controls.minDistance = 6;
controls.maxDistance = 25;

controls.maxPolarAngle =
    Math.PI / 2.05;


/* =========================
   TIRO
========================= */

window.addEventListener(
    "click",
    event => {

        if (
            event.target !==
            renderer.domElement
        ) return;

        wanted++;

        if (wanted > 5)
            wanted = 5;

        updateHUD();

        showMessage(
            "🔫 Disparo!"
        );
    }
);


/* =========================
   MISSÃO
========================= */

function checkMission() {

    if (
        missionCompleted
    ) return;

    const distance =
        player.position.distanceTo(
            mission.position
        );

    if (distance < 8) {

        missionCompleted = true;

        money += 500;

        updateHUD();

        mission.material.color
            .set(0x00ff55);

        document.getElementById(
            "missionText"
        ).textContent =
            "✅ Missão concluída! +$500";

        showMessage(
            "💰 Você ganhou $500!"
        );
    }
}


/* =========================
   HUD
========================= */

function updateHUD() {

    document.getElementById(
        "healthBar"
    ).style.width =
        health + "%";

    document.getElementById(
        "money"
    ).textContent =
        "$" + money;

    document.getElementById(
        "wanted"
    ).textContent =
        wanted;
}


/* =========================
   MENSAGENS
========================= */

let messageTimer;

function showMessage(text) {

    const element =
        document.getElementById(
            "message"
        );

    element.textContent = text;

    element.style.opacity = 1;

    clearTimeout(messageTimer);

    messageTimer =
        setTimeout(() => {

            element.style.opacity = 0;

        }, 2000);
}


/* =========================
   DIA / NOITE
========================= */

let time = 0;

function updateDayNight() {

    time += 0.0003;

    const cycle =
        Math.sin(time);

    const brightness =
        Math.max(
            0.25,
            cycle * .5 + .5
        );

    sun.intensity =
        brightness * 2;

    ambient.intensity =
        .4 + brightness;

    const sky =
        new THREE.Color();

    sky.setHSL(
        .58,
        .5,
        .55 * brightness
    );

    scene.background =
        sky;

    scene.fog.color =
        sky;
}


/* =========================
   LIMITE DA CIDADE
========================= */

function limitPosition(object) {

    object.position.x =
        THREE.MathUtils.clamp(
            object.position.x,
            -235,
            235
        );

    object.position.z =
        THREE.MathUtils.clamp(
            object.position.z,
            -235,
            235
        );
}


/* =========================
   ANIMAÇÃO DOS NPCs
========================= */

function updateNPCs() {

    npcs.forEach(
        npc => {

            npc.position.x +=
                Math.sin(
                    Date.now() * .001 +
                    npc.id
                ) * .005;

            npc.position.z +=
                Math.cos(
                    Date.now() * .001 +
                    npc.id
                ) * .005;
        }
    );
}


/* =========================
   LOOP PRINCIPAL
========================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    updatePlayer();

    if (inCar) {

        limitPosition(car);

        controls.target.copy(
            car.position
        );

    } else {

        limitPosition(player);

        controls.target.copy(
            player.position
        );
    }

    checkMission();

    updateNPCs();

    updateDayNight();

    controls.update();

    renderer.render(
        scene,
        camera
    );
}


/* =========================
   RESPONSIVIDADE
========================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


updateHUD();

animate();

</script>

</body>
</html>
