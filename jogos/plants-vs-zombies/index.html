<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plants vs Zombies - Ludix</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:linear-gradient(#79c95b,#3d8f3b);
    font-family:Arial,sans-serif;
    color:white;
    text-align:center;
    overflow-x:hidden;
}

h1{
    margin:15px 0 5px;
    font-size:32px;
    text-shadow:3px 3px 5px #000;
}

#info{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin:10px;
}

.infoBox{
    background:#222;
    padding:10px 18px;
    border-radius:12px;
    box-shadow:0 4px 8px #0008;
}

#game{
    position:relative;
    width:min(950px,96vw);
    height:min(560px,70vh);
    min-height:450px;
    margin:15px auto;
    background:
        repeating-linear-gradient(
            0deg,
            #6fbd50 0px,
            #6fbd50 20px,
            #63ad48 20px,
            #63ad48 40px
        );
    border:8px solid #57351d;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 20px #0009;
}

.row{
    position:absolute;
    left:0;
    width:100%;
    height:20%;
    border-bottom:2px solid #ffffff22;
}

.cell{
    position:absolute;
    width:10%;
    height:100%;
    border-right:1px solid #ffffff18;
}

.plant{
    position:absolute;
    font-size:42px;
    transform:translate(-50%,-50%);
    cursor:pointer;
    user-select:none;
    z-index:5;
}

.zombie{
    position:absolute;
    font-size:43px;
    transform:translate(-50%,-50%);
    z-index:6;
    user-select:none;
    filter:drop-shadow(3px 4px 2px #0008);
}

.projectile{
    position:absolute;
    width:14px;
    height:14px;
    background:#aaff32;
    border-radius:50%;
    box-shadow:0 0 10px #bfff00;
    z-index:7;
}

.sun{
    position:absolute;
    font-size:32px;
    cursor:pointer;
    animation:sunAppear .3s;
    z-index:10;
}

@keyframes sunAppear{
    from{
        transform:scale(0);
    }
    to{
        transform:scale(1);
    }
}

.health{
    position:absolute;
    top:-12px;
    left:50%;
    transform:translateX(-50%);
    width:45px;
    height:7px;
    background:#400;
    border-radius:5px;
    overflow:hidden;
}

.healthBar{
    width:100%;
    height:100%;
    background:#32e632;
}

#menu{
    margin:10px auto;
    max-width:950px;
}

button{
    border:0;
    border-radius:10px;
    padding:10px 18px;
    margin:4px;
    background:#222;
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#444;
    transform:scale(1.05);
}

#plants{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
}

.plantButton{
    min-width:120px;
}

.plantButton small{
    display:block;
    margin-top:3px;
    color:#ffe96b;
}

#message{
    min-height:25px;
    margin:5px;
    font-weight:bold;
}

#startScreen{
    position:absolute;
    inset:0;
    background:#000b;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:50;
}

#startScreen h2{
    font-size:35px;
    margin-bottom:15px;
}

#startScreen button{
    background:#2ca52c;
    font-size:20px;
    padding:14px 30px;
}

#gameOver{
    position:absolute;
    inset:0;
    background:#000c;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:100;
}

#gameOver h2{
    font-size:42px;
    color:#ff4545;
    text-shadow:3px 3px #000;
}

@media(max-width:600px){

    h1{
        font-size:25px;
    }

    #game{
        min-height:400px;
    }

    .plant{
        font-size:31px;
    }

    .zombie{
        font-size:34px;
    }

    .plantButton{
        min-width:100px;
        padding:8px;
    }
}
</style>
</head>

<body>

<h1>🌻 Plants vs Zombies 🌻</h1>

<div id="info">
    <div class="infoBox">☀️ Sol: <span id="sunCount">150</span></div>
    <div class="infoBox">🏆 Pontos: <span id="score">0</span></div>
    <div class="infoBox">🌊 Onda: <span id="wave">1</span></div>
    <div class="infoBox">🏆 Recorde: <span id="record">0</span></div>
</div>

<div id="plants">

    <button class="plantButton" onclick="selectPlant('shooter')">
        🌱 Atirador
        <small>50 ☀️</small>
    </button>

    <button class="plantButton" onclick="selectPlant('sunflower')">
        🌻 Girassol
        <small>50 ☀️</small>
    </button>

    <button class="plantButton" onclick="selectPlant('wall')">
        🪨 Muralha
        <small>75 ☀️</small>
    </button>

    <button class="plantButton" onclick="selectPlant('fire')">
        🔥 Fogo
        <small>100 ☀️</small>
    </button>

</div>

<div id="message">
    Escolha uma planta e clique em uma casa do campo.
</div>

<div id="game">

    <div id="startScreen">
        <h2>🌻 Ludix Garden 🌻</h2>
        <p>Defenda sua casa dos zumbis!</p>
        <button onclick="startGame()">COMEÇAR</button>
    </div>

    <div id="gameOver">
        <h2>💀 FIM DE JOGO</h2>
        <p id="finalScore"></p>
        <button onclick="restartGame()">JOGAR NOVAMENTE</button>
    </div>

</div>

<div id="menu">
    <button onclick="pauseGame()">⏸️ Pausar</button>
    <button onclick="restartGame()">🔄 Reiniciar</button>
</div>

<script>

const game = document.getElementById("game");

const sunCountEl = document.getElementById("sunCount");
const scoreEl = document.getElementById("score");
const waveEl = document.getElementById("wave");
const recordEl = document.getElementById("record");
const messageEl = document.getElementById("message");

let sunCount = 150;
let score = 0;
let wave = 1;

let selectedPlant = null;

let plants = [];
let zombies = [];
let projectiles = [];
let suns = [];

let gameRunning = false;
let paused = false;

let lastTime = 0;
let spawnTimer = 0;
let sunTimer = 0;

let record = Number(localStorage.getItem("ludixPvZRecord")) || 0;

recordEl.textContent = record;


/* =========================
   CONFIGURAÇÃO DAS PLANTAS
========================= */

const plantData = {

    shooter:{
        emoji:"🌱",
        cost:50,
        health:180,
        damage:25,
        cooldown:1200
    },

    sunflower:{
        emoji:"🌻",
        cost:50,
        health:160,
        sunTime:5000
    },

    wall:{
        emoji:"🪨",
        cost:75,
        health:600
    },

    fire:{
        emoji:"🔥",
        cost:100,
        health:220,
        damage:55,
        cooldown:1500
    }

};


/* =========================
   CONFIGURAÇÃO DOS ZUMBIS
========================= */

const zombieData = {

    normal:{
        emoji:"🧟",
        health:120,
        speed:0.0013,
        damage:0.12,
        points:25
    },

    fast:{
        emoji:"🧟‍♂️",
        health:90,
        speed:0.0020,
        damage:0.10,
        points:40
    },

    tank:{
        emoji:"🪣",
        health:400,
        speed:0.0009,
        damage:0.22,
        points:80
    },

    boss:{
        emoji:"👹",
        health:900,
        speed:0.0006,
        damage:0.30,
        points:200
    }

};


/* =========================
   INICIAR
========================= */

function startGame(){

    document.getElementById("startScreen").style.display="none";

    gameRunning=true;
    paused=false;

    lastTime=performance.now();

    requestAnimationFrame(gameLoop);

    setTimeout(()=>{
        spawnSun();
    },1500);

}


/* =========================
   SELECIONAR PLANTA
========================= */

function selectPlant(type){

    if(!gameRunning || paused) return;

    selectedPlant=type;

    messageEl.textContent =
        "Clique em uma posição do campo para plantar.";

}


/* =========================
   CRIAR CAMPO
========================= */

for(let row=0;row<5;row++){

    const rowElement=document.createElement("div");

    rowElement.className="row";

    rowElement.style.top=(row*20)+"%";

    game.appendChild(rowElement);

    for(let col=0;col<9;col++){

        const cell=document.createElement("div");

        cell.className="cell";

        cell.style.left=(col*10)+"%";

        rowElement.appendChild(cell);

    }

}


/* =========================
   PLANTAR
========================= */

game.addEventListener("click",function(e){

    if(!selectedPlant || !gameRunning || paused) return;

    if(e.target.closest(".plant") ||
       e.target.closest(".zombie") ||
       e.target.closest(".sun") ||
       e.target.closest("button")) return;

    const rect=game.getBoundingClientRect();

    const x=e.clientX-rect.left;
    const y=e.clientY-rect.top;

    const col=Math.floor(x/(rect.width/9));
    const row=Math.floor(y/(rect.height/5));

    const cellX=(col+0.5)*10;
    const cellY=(row+0.5)*20;

    const exists=plants.some(p=>
        p.row===row && p.col===col
    );

    if(exists){

        messageEl.textContent=
            "Já existe uma planta nesse lugar.";

        return;
    }

    const data=plantData[selectedPlant];

    if(sunCount<data.cost){

        messageEl.textContent=
            "Você não tem sol suficiente!";

        return;
    }

    sunCount-=data.cost;

    updateUI();

    createPlant(
        selectedPlant,
        row,
        col,
        cellX,
        cellY
    );

    selectedPlant=null;

});


/* =========================
   CRIAR PLANTA
========================= */

function createPlant(type,row,col,x,y){

    const data=plantData[type];

    const element=document.createElement("div");

    element.className="plant";

    element.textContent=data.emoji;

    element.style.left=x+"%";
    element.style.top=y+"%";

    const health=document.createElement("div");

    health.className="health";

    health.innerHTML=
        `<div class="healthBar"></div>`;

    element.appendChild(health);

    game.appendChild(element);

    const plant={
        type,
        row,
        col,
        x,
        y,
        health:data.health,
        maxHealth:data.health,
        element,
        lastShot:0,
        lastSun:0
    };

    plants.push(plant);

}


/* =========================
   CRIAR ZUMBI
========================= */

function spawnZombie(type="normal"){

    const data=zombieData[type];

    const row=Math.floor(Math.random()*5);

    const element=document.createElement("div");

    element.className="zombie";

    element.textContent=data.emoji;

    element.style.left="100%";
    element.style.top=((row+0.5)*20)+"%";

    const health=document.createElement("div");

    health.className="health";

    health.innerHTML=
        `<div class="healthBar"></div>`;

    element.appendChild(health);

    game.appendChild(element);

    zombies.push({

        type,

        row,

        x:100,

        health:data.health,

        maxHealth:data.health,

        element,

        attackCooldown:0

    });

}


/* =========================
   TIPOS DE ZUMBI POR ONDA
========================= */

function getZombieType(){

    /*
        Onda 1:
        somente normal

        Onda 2:
        normal + rápido

        Onda 3:
        normal + rápido + tanque

        Onda 4+:
        normal + rápido + tanque + chefe
    */

    const random=Math.random();

    if(wave===1){

        return "normal";

    }

    if(wave===2){

        if(random<0.25)
            return "fast";

        return "normal";

    }

    if(wave===3){

        if(random<0.15)
            return "tank";

        if(random<0.35)
            return "fast";

        return "normal";

    }

    if(wave>=4){

        if(random<0.08)
            return "boss";

        if(random<0.18)
            return "tank";

        if(random<0.40)
            return "fast";

        return "normal";

    }

}


/* =========================
   ATIRAR
========================= */

function shoot(plant){

    const data=plantData[plant.type];

    const projectile=document.createElement("div");

    projectile.className="projectile";

    projectile.style.left=plant.x+"%";
    projectile.style.top=plant.y+"%";

    game.appendChild(projectile);

    projectiles.push({

        row:plant.row,

        x:plant.x,

        y:plant.y,

        damage:data.damage,

        element:projectile

    });

}


/* =========================
   SOL
========================= */

function spawnSun(){

    if(!gameRunning) return;

    const sun=document.createElement("div");

    sun.className="sun";

    sun.textContent="☀️";

    sun.style.left=
        (10+Math.random()*80)+"%";

    sun.style.top=
        (10+Math.random()*75)+"%";

    game.appendChild(sun);

    const obj={
        element:sun
    };

    suns.push(obj);

    sun.onclick=function(e){

        e.stopPropagation();

        sunCount+=25;

        score+=5;

        sun.remove();

        suns=suns.filter(s=>s!==obj);

        updateUI();

    };

}


/* =========================
   LOOP DO JOGO
========================= */

function gameLoop(time){

    if(!gameRunning) return;

    if(!paused){

        const delta=time-lastTime;

        lastTime=time;

        update(delta);

    }else{

        lastTime=time;

    }

    requestAnimationFrame(gameLoop);

}


/* =========================
   ATUALIZAÇÃO
========================= */

function update(delta){

    spawnTimer+=delta;
    sunTimer+=delta;

    /* Sol natural */

    if(sunTimer>6500){

        spawnSun();

        sunTimer=0;

    }


    /* Spawn dos zumbis */

    const spawnTime=
        Math.max(
            5500,
            9000-wave*150
        );

    if(spawnTimer>spawnTime){

        spawnZombie(getZombieType());

        spawnTimer=0;

    }


    /* Atualizar plantas */

    plants.forEach(plant=>{

        const data=plantData[plant.type];

        plant.lastShot+=delta;
        plant.lastSun+=delta;

        if(plant.type==="shooter"){

            const enemy=zombies.find(z=>
                z.row===plant.row &&
                z.x>plant.x
            );

            if(enemy && plant.lastShot>=data.cooldown){

                shoot(plant);

                plant.lastShot=0;

            }

        }


        if(plant.type==="fire"){

            const enemy=zombies.find(z=>
                z.row===plant.row &&
                z.x>plant.x
            );

            if(enemy && plant.lastShot>=data.cooldown){

                shoot(plant);

                plant.lastShot=0;

            }

        }


        if(plant.type==="sunflower"){

            if(plant.lastSun>=data.sunTime){

                sunCount+=25;

                spawnMiniSun(plant);

                plant.lastSun=0;

                updateUI();

            }

        }

    });


    /* Atualizar projéteis */

    projectiles.forEach((p,index)=>{

        p.x+=0.055*delta;

        p.element.style.left=p.x+"%";

        let hit=false;

        zombies.forEach(z=>{

            if(hit) return;

            if(z.row!==p.row) return;

            if(Math.abs(z.x-p.x)<3){

                z.health-=p.damage;

                hit=true;

                p.element.remove();

                projectiles.splice(index,1);

                updateZombieHealth(z);

                if(z.health<=0){

                    killZombie(z);

                }

            }

        });

        if(p.x>105){

            p.element.remove();

            projectiles.splice(index,1);

        }

    });


    /* Atualizar zumbis */

    zombies.forEach(zombie=>{

        const data=zombieData[zombie.type];

        let blockingPlant=null;

        plants.forEach(plant=>{

            if(
                plant.row===zombie.row &&
                Math.abs(zombie.x-plant.x)<5
            ){

                blockingPlant=plant;

            }

        });


        if(blockingPlant){

            zombie.attackCooldown+=delta;

            if(zombie.attackCooldown>1000){

                blockingPlant.health-=data.damage*10;

                zombie.attackCooldown=0;

                updatePlantHealth(blockingPlant);

                if(blockingPlant.health<=0){

                    blockingPlant.element.remove();

                    plants=plants.filter(
                        p=>p!==blockingPlant
                    );

                }

            }

        }else{

            zombie.x-=data.speed*delta;

            zombie.element.style.left=
                zombie.x+"%";

        }


        if(zombie.x<2){

            gameOver();

        }

    });

}


/* =========================
   VIDA DO ZUMBI
========================= */

function updateZombieHealth(zombie){

    const bar=
        zombie.element.querySelector(".healthBar");

    if(bar){

        bar.style.width=
            Math.max(
                0,
                zombie.health/zombie.maxHealth*100
            )+"%";

    }

}


/* =========================
   VIDA DA PLANTA
========================= */

function updatePlantHealth(plant){

    const bar=
        plant.element.querySelector(".healthBar");

    if(bar){

        bar.style.width=
            Math.max(
                0,
                plant.health/plant.maxHealth*100
            )+"%";

    }

}


/* =========================
   MATAR ZUMBI
========================= */

function killZombie(zombie){

    const data=zombieData[zombie.type];

    score+=data.points;

    zombie.element.remove();

    zombies=zombies.filter(
        z=>z!==zombie
    );

    updateUI();

    checkWave();

}


/* =========================
   ONDAS
========================= */

function checkWave(){

    const newWave=
        Math.floor(score/300)+1;

    if(newWave>wave){

        wave=newWave;

        waveEl.textContent=wave;

        messageEl.textContent=
            "🌊 Onda "+wave+" começou!";

    }

}


/* =========================
   MINI SOL DO GIRASSOL
========================= */

function spawnMiniSun(plant){

    const sun=document.createElement("div");

    sun.className="sun";

    sun.textContent="☀️";

    sun.style.left=plant.x+"%";
    sun.style.top=plant.y+"%";

    game.appendChild(sun);

    const obj={element:sun};

    suns.push(obj);

    sun.onclick=function(e){

        e.stopPropagation();

        sunCount+=25;

        sun.remove();

        suns=suns.filter(
            s=>s!==obj
        );

        updateUI();

    };

}


/* =========================
   UI
========================= */

function updateUI(){

    sunCountEl.textContent=sunCount;

    scoreEl.textContent=score;

    waveEl.textContent=wave;

    if(score>record){

        record=score;

        localStorage.setItem(
            "ludixPvZRecord",
            record
        );

        recordEl.textContent=record;

    }

}


/* =========================
   PAUSAR
========================= */

function pauseGame(){

    if(!gameRunning) return;

    paused=!paused;

    messageEl.textContent=
        paused ?
        "⏸️ Jogo pausado" :
        "▶️ Jogo continuando";

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    gameRunning=false;

    document.getElementById("gameOver")
        .style.display="flex";

    document.getElementById("finalScore")
        .textContent=
        "Pontuação: "+score;

}


/* =========================
   REINICIAR
========================= */

function restartGame(){

    location.reload();

}


/* =========================
   SPAWN EXTRA
========================= */

setInterval(()=>{

    if(
        gameRunning &&
        !paused &&
        zombies.length<
        2+Math.floor(wave/2)
    ){

        spawnZombie(getZombieType());

    }

},8000);


/* =========================
   SOL AUTOMÁTICO
========================= */

setInterval(()=>{

    if(gameRunning && !paused){

        spawnSun();

    }

},9000);

</script>

</body>
</html>
