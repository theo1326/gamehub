<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Defense - Ludix</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#315d38 0%,#18351f 45%,#08140b 100%);
    color:white;
    overflow-x:hidden;
}

.game-wrapper{
    width:min(1250px,96%);
    margin:15px auto;
}

/* TOPO */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:14px 18px;
    border-radius:18px 18px 10px 10px;
    background:linear-gradient(135deg,#1b3922,#0d2112);
    border:2px solid #4f8b4f;
    box-shadow:0 10px 35px #0008;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:25px;
    font-weight:900;
    text-shadow:0 3px 5px #000;
}

.logo span{
    font-size:34px;
}

.stats{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.stat{
    min-width:105px;
    padding:9px 13px;
    border-radius:12px;
    background:#071108cc;
    border:1px solid #639763;
    text-align:center;
    box-shadow:inset 0 0 12px #0008;
}

.stat small{
    display:block;
    color:#b8d8b8;
    font-size:11px;
}

.stat strong{
    font-size:20px;
}

/* PAINEL DE PLANTAS */

.plant-menu{
    margin-top:12px;
    padding:12px;
    display:flex;
    gap:10px;
    align-items:center;
    overflow-x:auto;
    background:linear-gradient(#263d22,#172716);
    border:2px solid #557c4e;
    border-radius:14px;
    box-shadow:0 8px 25px #0008;
}

.card{
    min-width:125px;
    height:80px;
    padding:8px;
    border-radius:13px;
    border:2px solid #789d65;
    background:linear-gradient(145deg,#456c36,#233b20);
    color:white;
    cursor:pointer;
    position:relative;
    transition:.15s;
    box-shadow:0 5px 10px #0007;
}

.card:hover{
    transform:translateY(-3px);
    border-color:#d5ef83;
}

.card.selected{
    transform:translateY(-3px) scale(1.03);
    border-color:#fff38a;
    box-shadow:0 0 18px #ffe95a88;
}

.card.disabled{
    filter:grayscale(.8) brightness(.55);
}

.card-icon{
    font-size:35px;
    line-height:35px;
}

.card-name{
    font-size:12px;
    font-weight:bold;
}

.cost{
    position:absolute;
    right:6px;
    bottom:5px;
    color:#ffe95b;
    font-weight:bold;
}

/* CAMPO */

.field-container{
    margin-top:13px;
    padding:12px;
    background:
        linear-gradient(145deg,#6b4324,#3d2414);
    border:3px solid #a9703d;
    border-radius:18px;
    box-shadow:
        inset 0 0 25px #0009,
        0 12px 35px #0009;
}

.field{
    position:relative;
    display:grid;
    grid-template-columns:repeat(9,1fr);
    grid-template-rows:repeat(6,1fr);
    aspect-ratio:9/6;
    overflow:hidden;
    border-radius:12px;
    background:#438b38;
}

/* textura do gramado */

.field::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.25;
    background-image:
        radial-gradient(circle,#b7dc5c 1px,transparent 2px),
        radial-gradient(circle,#183d19 1px,transparent 2px);
    background-size:27px 27px,41px 41px;
}

.cell{
    position:relative;
    border:1px solid #24632788;
    background:
        linear-gradient(135deg,#65a944,#4a8d37);
    cursor:pointer;
    transition:.1s;
}

.cell:nth-child(even){
    background:linear-gradient(135deg,#5c9e3e,#438234);
}

.cell:hover{
    filter:brightness(1.18);
    box-shadow:inset 0 0 15px #d7ff7b44;
}

/* PLANTAS */

.plant{
    position:absolute;
    inset:7%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(30px,4vw,56px);
    z-index:4;
    filter:drop-shadow(0 6px 3px #193414);
    animation:plantAppear .2s ease-out;
}

@keyframes plantAppear{
    from{
        transform:scale(.2);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.plant.shooter{
    animation:plantFloat 1.5s ease-in-out infinite;
}

@keyframes plantFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-3px)}
}

.plant-bar,
.zombie-bar{
    position:absolute;
    left:10%;
    right:10%;
    height:6px;
    top:-2px;
    border-radius:10px;
    background:#270909;
    overflow:hidden;
    z-index:10;
}

.plant-bar span,
.zombie-bar span{
    display:block;
    height:100%;
    background:linear-gradient(90deg,#41ff4d,#b5ff48);
    width:100%;
}

/* ZUMBIS */

.zombie{
    position:absolute;
    z-index:6;
    display:flex;
    align-items:center;
    justify-content:center;
    width:82%;
    height:82%;
    font-size:clamp(28px,4vw,53px);
    filter:drop-shadow(0 7px 3px #182018);
    transition:left .06s linear;
    animation:zombieWalk .45s infinite alternate;
}

@keyframes zombieWalk{
    from{transform:translateY(0) rotate(-1deg)}
    to{transform:translateY(2px) rotate(1deg)}
}

.zombie.fast{
    filter:drop-shadow(0 0 7px #ff6b3d);
}

.zombie.tank{
    filter:drop-shadow(0 0 8px #aeb4c0);
}

/* PROJÉTEIS */

.projectile{
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#eaffad,#8cff32 45%,#278d1f);
    box-shadow:0 0 12px #a5ff45;
    z-index:9;
}

/* SOL */

.sun{
    position:absolute;
    z-index:20;
    width:47px;
    height:47px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    cursor:pointer;
    animation:sunPulse .8s infinite alternate;
    filter:drop-shadow(0 0 8px #ffe44e);
}

@keyframes sunPulse{
    from{transform:scale(.9)}
    to{transform:scale(1.1)}
}

/* PARTÍCULAS */

.particle{
    position:absolute;
    pointer-events:none;
    z-index:30;
    animation:particleFly .6s forwards;
}

@keyframes particleFly{
    to{
        transform:translate(var(--x),var(--y)) scale(0);
        opacity:0;
    }
}

/* CONTROLES */

.controls{
    margin-top:12px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

button{
    border:0;
    border-radius:12px;
    padding:11px 18px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    background:linear-gradient(#5c9d45,#35672b);
    box-shadow:0 5px 0 #1d3d18,0 7px 15px #0007;
}

button:hover{
    filter:brightness(1.15);
}

button:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #1d3d18;
}

/* MENSAGEM */

.message{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(.9);
    min-width:min(500px,90%);
    padding:35px;
    border-radius:22px;
    text-align:center;
    background:linear-gradient(145deg,#18361d,#08150a);
    border:3px solid #77a95e;
    box-shadow:0 20px 70px #000;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.message.show{
    opacity:1;
    pointer-events:auto;
    transform:translate(-50%,-50%) scale(1);
}

.message h1{
    font-size:35px;
    margin-bottom:10px;
}

.message p{
    color:#c9dfc5;
    margin-bottom:20px;
}

/* AVISO */

.tip{
    text-align:center;
    color:#cde2c8;
    padding:10px;
    font-size:13px;
}

/* RESPONSIVO */

@media(max-width:700px){
    .top{
        flex-direction:column;
    }

    .logo{
        font-size:21px;
    }

    .stats{
        justify-content:center;
    }

    .stat{
        min-width:90px;
    }

    .card{
        min-width:105px;
        height:72px;
    }

    .card-icon{
        font-size:30px;
    }

    .field-container{
        padding:6px;
    }
}
</style>
</head>

<body>

<div class="game-wrapper">

    <div class="top">

        <div class="logo">
            <span>🌿</span>
            Plant Defense
        </div>

        <div class="stats">

            <div class="stat">
                <small>☀️ SOL</small>
                <strong id="sun">150</strong>
            </div>

            <div class="stat">
                <small>🌊 ONDA</small>
                <strong id="wave">1</strong>
            </div>

            <div class="stat">
                <small>🏆 PONTOS</small>
                <strong id="score">0</strong>
            </div>

            <div class="stat">
                <small>👑 RECORDE</small>
                <strong id="record">0</strong>
            </div>

        </div>

    </div>


    <div class="plant-menu">

        <button class="card selected" id="card-shooter"
                onclick="selectPlant('shooter')">
            <div class="card-icon">🌱</div>
            <div class="card-name">Atirador</div>
            <div class="cost">☀️ 50</div>
        </button>

        <button class="card" id="card-sunflower"
                onclick="selectPlant('sunflower')">
            <div class="card-icon">🌻</div>
            <div class="card-name">Girassol</div>
            <div class="cost">☀️ 50</div>
        </button>

        <button class="card" id="card-wall"
                onclick="selectPlant('wall')">
            <div class="card-icon">🪨</div>
            <div class="card-name">Muralha</div>
            <div class="cost">☀️ 75</div>
        </button>

    </div>


    <div class="field-container">

        <div id="field" class="field"></div>

    </div>


    <div class="tip">
        🌱 Escolha uma planta e clique no gramado para colocá-la.
        Colete ☀️ para conseguir mais energia.
    </div>


    <div class="controls">
        <button onclick="startGame()">▶ Começar</button>
        <button onclick="restartGame()">🔄 Reiniciar</button>
        <button onclick="togglePause()" id="pauseBtn">⏸ Pausar</button>
    </div>

</div>


<div id="message" class="message">

    <h1 id="messageTitle">Plant Defense</h1>

    <p id="messageText">
        Prepare suas plantas para a batalha!
    </p>

    <button onclick="closeMessage()">
        🌱 Jogar
    </button>

</div>


<script>

/* =========================================================
   CONFIGURAÇÕES
========================================================= */

const ROWS = 6;
const COLS = 9;

const plantData = {

    shooter:{
        cost:50,
        health:100,
        emoji:"🌱",
        damage:20,
        interval:1200
    },

    sunflower:{
        cost:50,
        health:80,
        emoji:"🌻",
        sunInterval:6000
    },

    wall:{
        cost:75,
        health:420,
        emoji:"🪨"
    }

};


/* =========================================================
   ESTADO DO JOGO
========================================================= */

let sun = 150;
let wave = 1;
let score = 0;
let record = Number(localStorage.getItem("plantDefenseRecord")) || 0;

let selectedPlant = "shooter";

let plants = [];
let zombies = [];
let projectiles = [];
let suns = [];

let gameStarted = false;
let paused = false;
let gameOverState = false;

let lastTime = 0;
let zombieTimer = 0;
let waveTimer = 0;

let zombieId = 0;


/* =========================================================
   ELEMENTOS
========================================================= */

const field = document.getElementById("field");
const sunElement = document.getElementById("sun");
const waveElement = document.getElementById("wave");
const scoreElement = document.getElementById("score");
const recordElement = document.getElementById("record");

recordElement.textContent = record;


/* =========================================================
   CRIA CAMPO
========================================================= */

function createField(){

    field.innerHTML = "";

    for(let row=0; row<ROWS; row++){

        for(let col=0; col<COLS; col++){

            const cell = document.createElement("div");

            cell.className = "cell";

            cell.dataset.row = row;
            cell.dataset.col = col;

            cell.onclick = () => plantAt(row,col);

            field.appendChild(cell);

        }

    }

}


/* =========================================================
   SELECIONAR PLANTA
========================================================= */

function selectPlant(type){

    if(gameOverState) return;

    selectedPlant = type;

    document.querySelectorAll(".card")
        .forEach(card => card.classList.remove("selected"));

    document
        .getElementById("card-"+type)
        .classList.add("selected");

}


/* =========================================================
   PLANTAR
========================================================= */

function plantAt(row,col){

    if(!gameStarted || paused || gameOverState)
        return;

    if(plants.some(p => p.row === row && p.col === col))
        return;

    const data = plantData[selectedPlant];

    if(sun < data.cost){

        showFloatingText(
            "☀️ Sol insuficiente!",
            col,
            row
        );

        return;
    }

    sun -= data.cost;

    updateUI();

    const plant = {

        id:Date.now()+Math.random(),

        row,
        col,

        type:selectedPlant,

        health:data.health,

        maxHealth:data.health,

        shootTimer:0,
        sunTimer:0

    };

    plants.push(plant);

    renderPlant(plant);

    createParticles(row,col,"🌿");

}


/* =========================================================
   DESENHAR PLANTA
========================================================= */

function renderPlant(plant){

    const cell = getCell(plant.row,plant.col);

    if(!cell) return;

    const old = cell.querySelector(".plant");

    if(old) old.remove();

    const element = document.createElement("div");

    element.className = "plant "+plant.type;

    element.id = "plant-"+plant.id;

    element.textContent = plantData[plant.type].emoji;

    const bar = document.createElement("div");

    bar.className = "plant-bar";

    const health = document.createElement("span");

    health.style.width =
        `${Math.max(0,plant.health/plant.maxHealth*100)}%`;

    bar.appendChild(health);

    element.appendChild(bar);

    cell.appendChild(element);

}


/* =========================================================
   CÉLULA
========================================================= */

function getCell(row,col){

    return field.querySelector(
        `.cell[data-row="${row}"][data-col="${col}"]`
    );

}


/* =========================================================
   CRIAR ZUMBI
========================================================= */

function spawnZombie(){

    if(!gameStarted || paused || gameOverState)
        return;

    const row = Math.floor(Math.random()*ROWS);

    const chance = Math.random();

    let type = "normal";

    if(chance < .15 && wave >= 3)
        type = "tank";

    else if(chance < .35 && wave >= 2)
        type = "fast";


    const data = {

        normal:{
            emoji:"🧟",
            health:130,
            speed:.012,
            damage:.22,
            points:25
        },

        fast:{
            emoji:"🧟‍♂️",
            health:85,
            speed:.022,
            damage:.17,
            points:40
        },

        tank:{
            emoji:"🪣",
            health:360,
            speed:.006,
            damage:.4,
            points:80
        }

    }[type];


    const zombie = {

        id:++zombieId,

        row,

        x:COLS+0.15,

        type,

        health:data.health,

        maxHealth:data.health,

        speed:data.speed*(1+wave*.025),

        damage:data.damage,

        points:data.points,

        attackTimer:0

    };


    zombies.push(zombie);

    renderZombie(zombie);

}


/* =========================================================
   DESENHAR ZUMBI
========================================================= */

function renderZombie(zombie){

    const cellWidth = field.clientWidth / COLS;

    const element =
        document.getElementById("zombie-"+zombie.id);

    let z = element;

    if(!z){

        z = document.createElement("div");

        z.id = "zombie-"+zombie.id;

        z.className = "zombie "+zombie.type;

        z.textContent =
            zombie.type === "tank"
            ? "🪣"
            : zombie.type === "fast"
            ? "🧟‍♂️"
            : "🧟";

        field.appendChild(z);

    }

    z.style.top =
        `calc(${zombie.row} * ${100/ROWS}% + 1%)`;

    z.style.left =
        `${zombie.x*cellWidth}px`;

    z.style.width =
        `${cellWidth*.82}px`;

    z.style.height =
        `${field.clientHeight/ROWS*.82}px`;


    let bar = z.querySelector(".zombie-bar");

    if(!bar){

        bar = document.createElement("div");

        bar.className = "zombie-bar";

        const span = document.createElement("span");

        bar.appendChild(span);

        z.appendChild(bar);

    }

    bar.querySelector("span").style.width =
        `${Math.max(0,zombie.health/zombie.maxHealth*100)}%`;

}


/* =========================================================
   PROJÉTEIS
========================================================= */

function shoot(plant){

    const target =
        zombies.find(z =>
            z.row === plant.row &&
            z.x > plant.col &&
            z.x < COLS+1
        );

    if(!target)
        return;

    const projectile = {

        id:Date.now()+Math.random(),

        row:plant.row,

        x:plant.col+.65,

        speed:.045,

        damage:plantData.shooter.damage

    };

    projectiles.push(projectile);

    renderProjectile(projectile);

}


/* =========================================================
   DESENHAR PROJÉTIL
========================================================= */

function renderProjectile(p){

    let element =
        document.getElementById("projectile-"+p.id);

    if(!element){

        element = document.createElement("div");

        element.className = "projectile";

        element.id =
            "projectile-"+p.id;

        field.appendChild(element);

    }

    const cellWidth =
        field.clientWidth/COLS;

    element.style.left =
        `${p.x*cellWidth}px`;

    element.style.top =
        `calc(${p.row} * ${100/ROWS}% + ${field.clientHeight/ROWS/2}px)`;

}


/* =========================================================
   ATUALIZAR JOGO
========================================================= */

function gameLoop(time){

    if(!gameStarted){

        requestAnimationFrame(gameLoop);

        return;

    }

    const delta =
        Math.min(50,time-lastTime || 16);

    lastTime=time;

    if(!paused && !gameOverState){

        updatePlants(delta);
        updateProjectiles(delta);
        updateZombies(delta);

        zombieTimer += delta;
        waveTimer += delta;

        const spawnTime =
            Math.max(650,3000-wave*120);

        if(zombieTimer >= spawnTime){

            zombieTimer=0;

            spawnZombie();

        }

        if(waveTimer >= 30000){

            waveTimer=0;

            wave++;

            waveElement.textContent=wave;

            showFloatingText(
                "🌊 NOVA ONDA!",
                4,
                2
            );

        }

    }

    requestAnimationFrame(gameLoop);

}


/* =========================================================
   PLANTAS
========================================================= */

function updatePlants(delta){

    plants.forEach(plant => {

        if(plant.type==="shooter"){

            plant.shootTimer += delta;

            if(plant.shootTimer >= plantData.shooter.interval){

                plant.shootTimer=0;

                shoot(plant);

            }

        }


        if(plant.type==="sunflower"){

            plant.sunTimer += delta;

            if(plant.sunTimer >= plantData.sunflower.sunInterval){

                plant.sunTimer=0;

                createSun(
                    plant.row,
                    plant.col
                );

            }

        }

    });

}


/* =========================================================
   PROJÉTEIS
========================================================= */

function updateProjectiles(delta){

    for(let i=projectiles.length-1;i>=0;i--){

        const p=projectiles[i];

        p.x += p.speed*delta;

        let hit = null;

        for(const z of zombies){

            if(
                z.row===p.row &&
                Math.abs(z.x-p.x)<.35
            ){

                hit=z;

                break;

            }

        }

        if(hit){

            hit.health -= p.damage;

            createHitEffect(hit);

            removeProjectile(i);

            if(hit.health<=0){

                killZombie(hit);

            }

            continue;

        }

        if(p.x > COLS+1){

            removeProjectile(i);

            continue;

        }

        renderProjectile(p);

    }

}


/* =========================================================
   ZUMBIS
========================================================= */

function updateZombies(delta){

    zombies.forEach(zombie => {

        const blockingPlant =
            plants.find(p =>
                p.row===zombie.row &&
                Math.abs(zombie.x-(p.col+0.45))<.5
            );


        if(blockingPlant){

            zombie.attackTimer += delta;

            if(zombie.attackTimer >= 700){

                zombie.attackTimer=0;

                blockingPlant.health -= zombie.damage*10;

                renderPlant(blockingPlant);

                if(blockingPlant.health<=0){

                    removePlant(blockingPlant);

                }

            }

        }else{

            zombie.x -= zombie.speed*delta;

        }


        if(zombie.x < -.25){

            endGame();

        }

        renderZombie(zombie);

    });

}


/* =========================================================
   MATAR ZUMBI
========================================================= */

function killZombie(zombie){

    score += zombie.points;

    updateUI();

    createZombieExplosion(zombie);

    const index=zombies.indexOf(zombie);

    if(index!==-1)
        zombies.splice(index,1);

    const element=
        document.getElementById("zombie-"+zombie.id);

    if(element)
        element.remove();

}


/* =========================================================
   REMOVER PROJÉTIL
========================================================= */

function removeProjectile(index){

    const p=projectiles[index];

    const element=
        document.getElementById("projectile-"+p.id);

    if(element)
        element.remove();

    projectiles.splice(index,1);

}


/* =========================================================
   REMOVER PLANTA
========================================================= */

function removePlant(plant){

    const index=plants.indexOf(plant);

    if(index!==-1)
        plants.splice(index,1);

    const cell=getCell(
        plant.row,
        plant.col
    );

    if(cell){

        const element=
            cell.querySelector(".plant");

        if(element)
            element.remove();

    }

}


/* =========================================================
   CRIAR SOL
========================================================= */

function createSun(row,col){

    const sunObject={

        id:Date.now()+Math.random(),

        row,

        col,

        collected:false

    };

    suns.push(sunObject);


    const sunElement=document.createElement("div");

    sunElement.className="sun";

    sunElement.id=
        "sun-"+sunObject.id;

    sunElement.textContent="☀️";

    const cell=getCell(row,col);

    if(cell){

        cell.appendChild(sunElement);

    }


    sunElement.onclick=()=>{

        collectSun(sunObject);

    };

}


/* =========================================================
   COLETAR SOL
========================================================= */

function collectSun(sunObject){

    if(sunObject.collected)
        return;

    sunObject.collected=true;

    sun += 25;

    updateUI();

    const element=
        document.getElementById(
            "sun-"+sunObject.id
        );

    if(element){

        element.remove();

    }

    const index=suns.indexOf(sunObject);

    if(index!==-1)
        suns.splice(index,1);

}


/* =========================================================
   EFEITOS
========================================================= */

function createParticles(row,col,emoji){

    const cell=getCell(row,col);

    if(!cell) return;

    for(let i=0;i<5;i++){

        const particle=document.createElement("div");

        particle.className="particle";

        particle.textContent=emoji;

        particle.style.left="50%";
        particle.style.top="50%";

        particle.style.setProperty(
            "--x",
            `${(Math.random()-.5)*80}px`
        );

        particle.style.setProperty(
            "--y",
            `${(Math.random()-.5)*80}px`
        );

        cell.appendChild(particle);

        setTimeout(
            ()=>particle.remove(),
            650
        );

    }

}


function createHitEffect(zombie){

    const element=
        document.getElementById(
            "zombie-"+zombie.id
        );

    if(!element) return;

    element.style.filter=
        "brightness(2)";

    setTimeout(()=>{

        if(zombie.type==="tank")
            element.style.filter=
                "drop-shadow(0 0 8px #aeb4c0)";
        else if(zombie.type==="fast")
            element.style.filter=
                "drop-shadow(0 0 7px #ff6b3d)";
        else
            element.style.filter=
                "drop-shadow(0 7px 3px #182018)";

    },100);

}


function createZombieExplosion(zombie){

    for(let i=0;i<8;i++){

        const element=
            document.createElement("div");

        element.className="particle";

        element.textContent=
            ["💥","💨","🟢","✨"][Math.floor(Math.random()*4)];

        element.style.position="absolute";

        const cellWidth=
            field.clientWidth/COLS;

        element.style.left=
            `${zombie.x*cellWidth}px`;

        element.style.top=
            `calc(${zombie.row} * ${100/ROWS}% + 40px)`;

        element.style.setProperty(
            "--x",
            `${(Math.random()-.5)*120}px`
        );

        element.style.setProperty(
            "--y",
            `${(Math.random()-.5)*100}px`
        );

        field.appendChild(element);

        setTimeout(
            ()=>element.remove(),
            650
        );

    }

}


/* =========================================================
   TEXTO FLUTUANTE
========================================================= */

function showFloatingText(text,col,row){

    const element=
        document.createElement("div");

    element.textContent=text;

    element.style.position="absolute";
    element.style.zIndex="50";
    element.style.fontWeight="bold";
    element.style.color="#fff";
    element.style.textShadow="0 2px 4px #000";
    element.style.left=
        `${(col/COLS)*100}%`;
    element.style.top=
        `${(row/ROWS)*100}%`;

    element.style.animation=
        "particleFly 1s forwards";

    field.appendChild(element);

    setTimeout(
        ()=>element.remove(),
        1000
    );

}


/* =========================================================
   UI
========================================================= */

function updateUI(){

    sunElement.textContent=sun;
    scoreElement.textContent=score;
    waveElement.textContent=wave;

    document.querySelectorAll(".card")
        .forEach(card=>{

            const type=
                card.id.replace("card-","");

            if(sun < plantData[type].cost)
                card.classList.add("disabled");
            else
                card.classList.remove("disabled");

        });

}


/* =========================================================
   INICIAR
========================================================= */

function startGame(){

    if(gameStarted)
        return;

    gameStarted=true;

    paused=false;

    closeMessage();

    lastTime=performance.now();

    createSun(2,4);
    createSun(4,7);

}


/* =========================================================
   PAUSAR
========================================================= */

function togglePause(){

    if(!gameStarted || gameOverState)
        return;

    paused=!paused;

    document.getElementById("pauseBtn").textContent=
        paused ? "▶ Continuar" : "⏸ Pausar";

}


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

    if(gameOverState)
        return;

    gameOverState=true;

    if(score>record){

        record=score;

        localStorage.setItem(
            "plantDefenseRecord",
            record
        );

        recordElement.textContent=record;

    }

    showMessage(
        "💀 FIM DE JOGO",
        `Os zumbis chegaram à sua casa!<br><br>
         Pontuação: <strong>${score}</strong><br>
         Recorde: <strong>${record}</strong>`,
        "🔄 Jogar novamente"
    );

}


/* =========================================================
   MENSAGEM
========================================================= */

function showMessage(title,text,button="🌱 Jogar"){

    document.getElementById("messageTitle")
        .textContent=title;

    document.getElementById("messageText")
        .innerHTML=text;

    document.querySelector("#message button")
        .textContent=button;

    document.getElementById("message")
        .classList.add("show");

}


function closeMessage(){

    document.getElementById("message")
        .classList.remove("show");

}


/* =========================================================
   REINICIAR
========================================================= */

function restartGame(){

    plants=[];
    zombies=[];
    projectiles=[];
    suns=[];

    sun=150;
    wave=1;
    score=0;

    gameStarted=false;
    paused=false;
    gameOverState=false;

    zombieTimer=0;
    waveTimer=0;

    document.getElementById("pauseBtn")
        .textContent="⏸ Pausar";

    createField();

    updateUI();

    document.querySelectorAll(".zombie")
        .forEach(e=>e.remove());

    document.querySelectorAll(".projectile")
        .forEach(e=>e.remove());

    document.querySelectorAll(".sun")
        .forEach(e=>e.remove());

    showMessage(
        "🌿 PLANT DEFENSE",
        "Monte sua defesa e sobreviva às ondas de zumbis!"
    );

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

createField();

updateUI();

restartGame();

requestAnimationFrame(gameLoop);


/* =========================================================
   SPAWN AUTOMÁTICO
========================================================= */

setInterval(()=>{

    if(gameStarted && !paused && !gameOverState){

        spawnZombie();

    }

},2500);

</script>

</body>
</html>
