<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ludix - Plants vs Zombies</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:linear-gradient(#78c850,#397d32);
    font-family:Arial,sans-serif;
    color:white;
    text-align:center;
    overflow-x:hidden;
}

h1{
    margin:15px 0 5px;
    font-size:32px;
    text-shadow:3px 3px 5px #000;
}

#info{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:10px;
}

.infoBox{
    background:#222;
    padding:10px 16px;
    border-radius:12px;
    box-shadow:0 4px 8px #0008;
}

#plants{
    display:flex;
    justify-content:center;
    gap:7px;
    flex-wrap:wrap;
    margin:10px auto;
    max-width:1000px;
}

button{
    border:0;
    border-radius:10px;
    padding:9px 13px;
    background:#222;
    color:white;
    cursor:pointer;
    font-size:13px;
    transition:.2s;
}

button:hover{
    background:#444;
    transform:scale(1.05);
}

.plantButton{
    min-width:105px;
}

.plantButton small{
    display:block;
    color:#ffe45c;
    margin-top:3px;
}

#message{
    min-height:25px;
    margin:5px;
    font-weight:bold;
}

#game{

    position:relative;

    width:min(950px,96vw);

    height:min(560px,70vh);

    min-height:450px;

    margin:15px auto;

    background:
    repeating-linear-gradient(
        0deg,
        #70bd4f 0px,
        #70bd4f 20px,
        #62aa45 20px,
        #62aa45 40px
    );

    border:8px solid #55351e;

    border-radius:15px;

    overflow:hidden;

    box-shadow:0 8px 20px #0009;
}

.row{
    position:absolute;
    left:0;
    width:100%;
    height:20%;
    border-bottom:2px solid #ffffff20;
}

.cell{
    position:absolute;
    width:10%;
    height:100%;
    border-right:1px solid #ffffff15;
}

.plant{
    position:absolute;
    font-size:40px;
    transform:translate(-50%,-50%);
    z-index:5;
    user-select:none;
}

.zombie{
    position:absolute;
    font-size:43px;
    transform:translate(-50%,-50%);
    z-index:6;
    user-select:none;
    filter:drop-shadow(3px 4px 2px #0008);
}

.projectile{
    position:absolute;
    width:14px;
    height:14px;
    background:#aaff25;
    border-radius:50%;
    box-shadow:0 0 10px #bfff00;
    z-index:7;
}

.projectile.fire{
    background:#ff5b20;
    box-shadow:0 0 12px #ff3100;
}

.projectile.ice{
    background:#7de8ff;
    box-shadow:0 0 12px #00d9ff;
}

.projectile.electric{
    background:#fff600;
    box-shadow:0 0 15px #fff000;
}

.projectile.corn{
    background:#ffd52e;
    box-shadow:0 0 10px #ffb300;
}

.sun{
    position:absolute;
    font-size:32px;
    cursor:pointer;
    z-index:10;
    animation:sunAppear .3s;
}

@keyframes sunAppear{

    from{
        transform:scale(0);
    }

    to{
        transform:scale(1);
    }

}

.health{
    position:absolute;
    top:-12px;
    left:50%;
    transform:translateX(-50%);
    width:45px;
    height:7px;
    background:#400;
    border-radius:5px;
    overflow:hidden;
}

.healthBar{
    width:100%;
    height:100%;
    background:#32e632;
}

#startScreen,
#gameOver{

    position:absolute;

    inset:0;

    background:#000c;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    z-index:50;
}

#gameOver{
    display:none;
}

#startScreen h2,
#gameOver h2{
    font-size:38px;
    margin-bottom:15px;
    text-shadow:3px 3px #000;
}

#startScreen button{
    background:#2da52d;
    font-size:20px;
    padding:14px 30px;
}

#gameOver h2{
    color:#ff4444;
}

@media(max-width:600px){

    h1{
        font-size:25px;
    }

    #game{
        min-height:400px;
    }

    .plant{
        font-size:30px;
    }

    .zombie{
        font-size:34px;
    }

    .plantButton{
        min-width:90px;
        padding:7px;
    }

}

</style>
</head>

<body>

<h1>🌻 Ludix Garden 🌻</h1>

<div id="info">

    <div class="infoBox">
        ☀️ Sol:
        <span id="sunCount">300</span>
    </div>

    <div class="infoBox">
        🏆 Pontos:
        <span id="score">0</span>
    </div>

    <div class="infoBox">
        🌊 Onda:
        <span id="wave">1</span>
    </div>

    <div class="infoBox">
        🏆 Recorde:
        <span id="record">0</span>
    </div>

</div>


<div id="plants">

    <button class="plantButton"
    onclick="selectPlant('shooter')">

        🌱 Atirador
        <small>50 ☀️</small>

    </button>

    <button class="plantButton"
    onclick="selectPlant('sunflower')">

        🌻 Girassol
        <small>50 ☀️</small>

    </button>

    <button class="plantButton"
    onclick="selectPlant('wall')">

        🪨 Muralha
        <small>75 ☀️</small>

    </button>

    <button class="plantButton"
    onclick="selectPlant('fire')">

        🔥 Fogo
        <small>100 ☀️</small>

    </button>

    <button class="plantButton"
    onclick="selectPlant('cactus')">

        🌵 Cacto
        <small>75 ☀️</small>

    </button>

    <button class="plantButton"
    onclick="selectPlant('ice')">

        ❄️ Gelo
        <small>100 ☀️</small>

    </button>

    <button class="plantButton"
    onclick="selectPlant('bomb')">

        💣 Bomba
        <small>125 ☀️</small>

    </button>

    <button class="plantButton"
    onclick="selectPlant('mushroom')">

        🍄 Cogumelo
        <small>100 ☀️</small>

    </button>

    <button class="plantButton"
    onclick="selectPlant('electric')">

        ⚡ Elétrica
        <small>150 ☀️</small>

    </button>

    <button class="plantButton"
    onclick="selectPlant('corn')">

        🌽 Milho
        <small>125 ☀️</small>

    </button>

</div>


<div id="message">

Escolha uma planta e clique no campo.

</div>


<div id="game">

    <div id="startScreen">

        <h2>🌻 Ludix Garden</h2>

        <p>Monte seu exército de plantas!</p>

        <button onclick="startGame()">
            COMEÇAR
        </button>

    </div>


    <div id="gameOver">

        <h2>💀 FIM DE JOGO</h2>

        <p id="finalScore"></p>

        <button onclick="restartGame()">
            🔄 JOGAR NOVAMENTE
        </button>

    </div>

</div>


<div>

    <button onclick="pauseGame()">
        ⏸️ Pausar
    </button>

    <button onclick="restartGame()">
        🔄 Reiniciar
    </button>

</div>


<script>


/* =========================
   VARIÁVEIS
========================= */

const game=document.getElementById("game");

const sunCountEl=document.getElementById("sunCount");
const scoreEl=document.getElementById("score");
const waveEl=document.getElementById("wave");
const recordEl=document.getElementById("record");
const messageEl=document.getElementById("message");

let sunCount=300;
let score=0;
let wave=1;

let selectedPlant=null;

let plants=[];
let zombies=[];
let projectiles=[];
let suns=[];

let gameRunning=false;
let paused=false;

let lastTime=0;
let spawnTimer=0;
let sunTimer=0;

let record=
Number(localStorage.getItem("ludixPvZRecord"))||0;

recordEl.textContent=record;


/* =========================
   PLANTAS
========================= */

const plantData={

    shooter:{
        emoji:"🌱",
        cost:50,
        health:180,
        damage:28,
        cooldown:1000,
        projectile:"normal"
    },

    sunflower:{
        emoji:"🌻",
        cost:50,
        health:160,
        sunTime:4500
    },

    wall:{
        emoji:"🪨",
        cost:75,
        health:650
    },

    fire:{
        emoji:"🔥",
        cost:100,
        health:220,
        damage:60,
        cooldown:1300,
        projectile:"fire"
    },

    cactus:{
        emoji:"🌵",
        cost:75,
        health:200,
        damage:18,
        cooldown:500,
        projectile:"normal"
    },

    ice:{
        emoji:"❄️",
        cost:100,
        health:190,
        damage:20,
        cooldown:1200,
        projectile:"ice"
    },

    bomb:{
        emoji:"💣",
        cost:125,
        health:160,
        damage:180,
        cooldown:3000,
        projectile:"fire"
    },

    mushroom:{
        emoji:"🍄",
        cost:100,
        health:170,
        damage:45,
        cooldown:850,
        projectile:"normal"
    },

    electric:{
        emoji:"⚡",
        cost:150,
        health:180,
        damage:35,
        cooldown:1500,
        projectile:"electric"
    },

    corn:{
        emoji:"🌽",
        cost:125,
        health:200,
        damage:50,
        cooldown:1100,
        projectile:"corn"
    }

};


/* =========================
   ZUMBIS
========================= */

const zombieData={

    normal:{
        emoji:"🧟",
        health:120,
        speed:0.0028,
        damage:0.15,
        points:25
    },

    fast:{
        emoji:"🧟‍♂️",
        health:90,
        speed:0.0045,
        damage:0.12,
        points:40
    },

    tank:{
        emoji:"🪣",
        health:450,
        speed:0.0020,
        damage:0.25,
        points:80
    },

    runner:{
        emoji:"🦇",
        health:100,
        speed:0.0065,
        damage:0.15,
        points:60
    },

    armored:{
        emoji:"🛡️",
        health:650,
        speed:0.0022,
        damage:0.35,
        points:120
    },

    boss:{
        emoji:"👹",
        health:1200,
        speed:0.0017,
        damage:0.45,
        points:250
    }

};


/* =========================
   INICIAR
========================= */

function startGame(){

    document.getElementById("startScreen")
    .style.display="none";

    gameRunning=true;
    paused=false;

    lastTime=performance.now();

    requestAnimationFrame(gameLoop);

}


/* =========================
   SELECIONAR PLANTA
========================= */

function selectPlant(type){

    if(!gameRunning || paused)
        return;

    selectedPlant=type;

    messageEl.textContent=
    "Clique em uma casa do campo.";

}


/* =========================
   CAMPO
========================= */

for(let row=0;row<5;row++){

    const rowElement=
    document.createElement("div");

    rowElement.className="row";

    rowElement.style.top=
    (row*20)+"%";

    game.appendChild(rowElement);

    for(let col=0;col<9;col++){

        const cell=
        document.createElement("div");

        cell.className="cell";

        cell.style.left=
        (col*10)+"%";

        rowElement.appendChild(cell);

    }

}


/* =========================
   PLANTAR
========================= */

game.addEventListener("click",function(e){

    if(
        !selectedPlant ||
        !gameRunning ||
        paused
    )
        return;

    if(
        e.target.closest(".plant") ||
        e.target.closest(".zombie") ||
        e.target.closest(".sun") ||
        e.target.closest("button")
    )
        return;

    const rect=
    game.getBoundingClientRect();

    const x=
    e.clientX-rect.left;

    const y=
    e.clientY-rect.top;

    const col=
    Math.floor(x/(rect.width/9));

    const row=
    Math.floor(y/(rect.height/5));

    const cellX=
    (col+0.5)*10;

    const cellY=
    (row+0.5)*20;

    const exists=
    plants.some(p=>
        p.row===row &&
        p.col===col
    );

    if(exists){

        messageEl.textContent=
        "Já existe uma planta aqui.";

        return;

    }

    const data=
    plantData[selectedPlant];

    if(sunCount<data.cost){

        messageEl.textContent=
        "☀️ Sol insuficiente!";

        return;

    }

    sunCount-=data.cost;

    updateUI();

    createPlant(
        selectedPlant,
        row,
        col,
        cellX,
        cellY
    );

    selectedPlant=null;

});


/* =========================
   CRIAR PLANTA
========================= */

function createPlant(type,row,col,x,y){

    const data=plantData[type];

    const element=
    document.createElement("div");

    element.className="plant";

    element.textContent=data.emoji;

    element.style.left=x+"%";
    element.style.top=y+"%";

    const health=
    document.createElement("div");

    health.className="health";

    health.innerHTML=
    `<div class="healthBar"></div>`;

    element.appendChild(health);

    game.appendChild(element);

    plants.push({

        type,
        row,
        col,
        x,
        y,

        health:data.health,

        maxHealth:data.health,

        element,

        lastShot:0,

        lastSun:0

    });

}


/* =========================
   CRIAR ZUMBI
========================= */

function spawnZombie(type){

    const data=zombieData[type];

    const row=
    Math.floor(Math.random()*5);

    const element=
    document.createElement("div");

    element.className="zombie";

    element.textContent=data.emoji;

    element.style.left="100%";

    element.style.top=
    ((row+0.5)*20)+"%";

    const health=
    document.createElement("div");

    health.className="health";

    health.innerHTML=
    `<div class="healthBar"></div>`;

    element.appendChild(health);

    game.appendChild(element);

    zombies.push({

        type,
        row,
        x:100,

        health:data.health,

        maxHealth:data.health,

        element,

        attackCooldown:0,

        slowTimer:0

    });

}


/* =========================
   ZUMBI POR ONDA
========================= */

function getZombieType(){

    const r=Math.random();

    if(wave===1)
        return "normal";

    if(wave===2){

        if(r<0.30)
            return "fast";

        return "normal";

    }

    if(wave===3){

        if(r<0.20)
            return "tank";

        if(r<0.45)
            return "fast";

        return "normal";

    }

    if(wave===4){

        if(r<0.15)
            return "runner";

        if(r<0.25)
            return "tank";

        if(r<0.50)
            return "fast";

        return "normal";

    }

    if(wave===5){

        if(r<0.15)
            return "armored";

        if(r<0.25)
            return "runner";

        if(r<0.40)
            return "tank";

        if(r<0.60)
            return "fast";

        return "normal";

    }

    if(r<0.08)
        return "boss";

    if(r<0.18)
        return "armored";

    if(r<0.30)
        return "runner";

    if(r<0.45)
        return "tank";

    if(r<0.65)
        return "fast";

    return "normal";

}


/* =========================
   ATIRAR
========================= */

function shoot(plant){

    const data=
    plantData[plant.type];

    const projectile=
    document.createElement("div");

    projectile.className=
    "projectile "+
    (data.projectile||"normal");

    projectile.style.left=
    plant.x+"%";

    projectile.style.top=
    plant.y+"%";

    game.appendChild(projectile);

    projectiles.push({

        row:plant.row,

        x:plant.x,

        y:plant.y,

        damage:data.damage,

        type:plant.type,

        element:projectile

    });

}


/* =========================
   SOL
========================= */

function spawnSun(){

    if(!gameRunning)
        return;

    const sun=
    document.createElement("div");

    sun.className="sun";

    sun.textContent="☀️";

    sun.style.left=
    (10+Math.random()*80)+"%";

    sun.style.top=
    (10+Math.random()*75)+"%";

    game.appendChild(sun);

    const obj={
        element:sun
    };

    suns.push(obj);

    sun.onclick=function(e){

        e.stopPropagation();

        sunCount+=25;

        score+=5;

        sun.remove();

        suns=suns.filter(
            s=>s!==obj
        );

        updateUI();

    };

}


/* =========================
   LOOP
========================= */

function gameLoop(time){

    if(!gameRunning)
        return;

    if(!paused){

        const delta=
        time-lastTime;

        lastTime=time;

        update(delta);

    }else{

        lastTime=time;

    }

    requestAnimationFrame(gameLoop);

}


/* =========================
   UPDATE
========================= */

function update(delta){

    spawnTimer+=delta;

    sunTimer+=delta;


    if(sunTimer>5500){

        spawnSun();

        sunTimer=0;

    }


    const spawnTime=
    Math.max(
        3500,
        6500-wave*180
    );

    if(spawnTimer>spawnTime){

        spawnZombie(
            getZombieType()
        );

        spawnTimer=0;

    }


    /* PLANTAS */

    plants.forEach(plant=>{

        const data=
        plantData[plant.type];

        plant.lastShot+=delta;

        plant.lastSun+=delta;


        if(
            plant.type!=="sunflower" &&
            plant.type!=="wall"
        ){

            const enemy=
            zombies.find(z=>
                z.row===plant.row &&
                z.x>plant.x
            );

            if(
                enemy &&
                plant.lastShot>=data.cooldown
            ){

                shoot(plant);

                plant.lastShot=0;

            }

        }


        if(plant.type==="sunflower"){

            if(
                plant.lastSun>=data.sunTime
            ){

                sunCount+=25;

                spawnMiniSun(plant);

                plant.lastSun=0;

                updateUI();

            }

        }

    });


    /* PROJÉTEIS */

    projectiles.forEach(
    (p,index)=>{

        p.x+=0.065*delta;

        p.element.style.left=
        p.x+"%";

        let hit=false;

        zombies.forEach(z=>{

            if(hit)
                return;

            if(z.row!==p.row)
                return;

            if(
                Math.abs(z.x-p.x)<3
            ){

                z.health-=p.damage;

                hit=true;

                if(p.type==="ice"){

                    z.slowTimer=3000;

                }

                if(p.type==="electric"){

                    zombies.forEach(other=>{

                        if(
                            other!==z &&
                            other.row===z.row &&
                            Math.abs(
                                other.x-z.x
                            )<12
                        ){

                            other.health-=20;

                            updateZombieHealth(
                                other
                            );

                        }

                    });

                }

                if(p.type==="bomb"){

                    zombies.forEach(other=>{

                        if(
                            Math.abs(
                                other.x-z.x
                            )<15 &&
                            other.row===z.row
                        ){

                            other.health-=90;

                            updateZombieHealth(
                                other
                            );

                        }

                    });

                }

                p.element.remove();

                projectiles.splice(
                    index,
                    1
                );

                updateZombieHealth(z);

                if(z.health<=0){

                    killZombie(z);

                }

            }

        });


        if(p.x>105){

            p.element.remove();

            projectiles.splice(
                index,
                1
            );

        }

    });


    /* ZUMBIS */

    zombies.forEach(zombie=>{

        const data=
        zombieData[zombie.type];

        let blockingPlant=null;


        plants.forEach(plant=>{

            if(
                plant.row===zombie.row &&
                Math.abs(
                    zombie.x-plant.x
                )<5
            ){

                blockingPlant=plant;

            }

        });


        if(zombie.slowTimer>0){

            zombie.slowTimer-=delta;

        }


        let speed=data.speed;

        if(zombie.slowTimer>0){

            speed*=0.45;

        }


        if(blockingPlant){

            zombie.attackCooldown+=delta;

            if(
                zombie.attackCooldown>1000
            ){

                blockingPlant.health-=
                data.damage*10;

                zombie.attackCooldown=0;

                updatePlantHealth(
                    blockingPlant
                );

                if(
                    blockingPlant.health<=0
                ){

                    blockingPlant.element.remove();

                    plants=
                    plants.filter(
                        p=>p!==blockingPlant
                    );

                }

            }

        }else{

            zombie.x-=
            speed*delta;

            zombie.element.style.left=
            zombie.x+"%";

        }


        if(zombie.x<2){

            gameOver();

        }

    });

}


/* =========================
   VIDA ZUMBI
========================= */

function updateZombieHealth(zombie){

    const bar=
    zombie.element
    .querySelector(".healthBar");

    if(bar){

        bar.style.width=
        Math.max(
            0,
            zombie.health/
            zombie.maxHealth*100
        )+"%";

    }

}


/* =========================
   VIDA PLANTA
========================= */

function updatePlantHealth(plant){

    const bar=
    plant.element
    .querySelector(".healthBar");

    if(bar){

        bar.style.width=
        Math.max(
            0,
            plant.health/
            plant.maxHealth*100
        )+"%";

    }

}


/* =========================
   MATAR ZUMBI
========================= */

function killZombie(zombie){

    const data=
    zombieData[zombie.type];

    score+=data.points;

    zombie.element.remove();

    zombies=
    zombies.filter(
        z=>z!==zombie
    );

    updateUI();

    checkWave();

}


/* =========================
   ONDAS
========================= */

function checkWave(){

    const newWave=
    Math.floor(score/300)+1;

    if(newWave>wave){

        wave=newWave;

        waveEl.textContent=wave;

        messageEl.textContent=
        "🌊 NOVA ONDA: "+wave+"!";

    }

}


/* =========================
   GIRASSOL
========================= */

function spawnMiniSun(plant){

    const sun=
    document.createElement("div");

    sun.className="sun";

    sun.textContent="☀️";

    sun.style.left=
    plant.x+"%";

    sun.style.top=
    plant.y+"%";

    game.appendChild(sun);

    const obj={
        element:sun
    };

    suns.push(obj);

    sun.onclick=function(e){

        e.stopPropagation();

        sunCount+=25;

        sun.remove();

        suns=
        suns.filter(
            s=>s!==obj
        );

        updateUI();

    };

}


/* =========================
   UI
========================= */

function updateUI(){

    sunCountEl.textContent=
    sunCount;

    scoreEl.textContent=
    score;

    waveEl.textContent=
    wave;


    if(score>record){

        record=score;

        localStorage.setItem(
            "ludixPvZRecord",
            record
        );

        recordEl.textContent=
        record;

    }

}


/* =========================
   PAUSAR
========================= */

function pauseGame(){

    if(!gameRunning)
        return;

    paused=!paused;

    messageEl.textContent=
    paused
    ? "⏸️ Jogo pausado"
    : "▶️ Jogo continuando";

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    gameRunning=false;

    document.getElementById(
        "gameOver"
    ).style.display="flex";

    document.getElementById(
        "finalScore"
    ).textContent=
    "Pontuação: "+score;

}


/* =========================
   REINICIAR
========================= */

function restartGame(){

    location.reload();

}


/* =========================
   ZUMBIS EXTRAS
========================= */

setInterval(()=>{

    if(
        gameRunning &&
        !paused &&
        zombies.length<
        2+Math.floor(wave/2)
    ){

        spawnZombie(
            getZombieType()
        );

    }

},6000);


/* =========================
   SOL EXTRA
========================= */

setInterval(()=>{

    if(gameRunning && !paused){

        spawnSun();

    }

},7500);

</script>

</body>
</html>
