<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plant Defense - Ludix</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:white;

    background:
        radial-gradient(circle at top,#467c45,#172d19 55%,#071008);

    overflow-x:hidden;
}

.game{
    width:min(1200px,96%);
    margin:15px auto;
}

/* =========================
   TOPO
========================= */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;

    padding:14px;

    background:
        linear-gradient(145deg,#244d29,#102313);

    border:2px solid #65915c;
    border-radius:18px;

    box-shadow:0 10px 30px #0009;
}

.logo{
    font-size:25px;
    font-weight:bold;

    text-shadow:0 3px 5px #000;
}

.logo span{
    font-size:34px;
}

.stats{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
}

.stat{
    min-width:90px;

    padding:7px 10px;

    text-align:center;

    background:#071108dd;

    border:1px solid #608b58;

    border-radius:10px;
}

.stat small{
    display:block;
    font-size:10px;
    color:#b9d5b4;
}

.stat strong{
    font-size:19px;
}


/* =========================
   CARTAS
========================= */

.menu{
    display:flex;
    gap:10px;

    margin-top:12px;
    padding:10px;

    overflow-x:auto;

    background:#172b18;

    border:2px solid #577e50;
    border-radius:14px;
}

.card{
    position:relative;

    min-width:115px;
    height:82px;

    border:2px solid #688e5d;
    border-radius:12px;

    color:white;

    background:
        linear-gradient(145deg,#4c763e,#243c20);

    cursor:pointer;

    box-shadow:0 5px 10px #0008;

    transition:.15s;
}

.card:hover{
    transform:translateY(-3px);
}

.card.selected{
    border-color:#fff071;

    box-shadow:
        0 0 18px #ffe85a99;
}

.card.disabled{
    filter:brightness(.5);
}

.icon{
    font-size:34px;
}

.name{
    font-size:12px;
    font-weight:bold;
}

.cost{
    position:absolute;

    right:6px;
    bottom:5px;

    color:#ffe85b;

    font-weight:bold;
}


/* =========================
   CAMPO
========================= */

.field-box{

    margin-top:12px;

    padding:10px;

    background:
        linear-gradient(145deg,#704825,#3b2112);

    border:3px solid #a56c39;

    border-radius:18px;

    box-shadow:
        inset 0 0 25px #0009,
        0 12px 35px #0009;
}

.field{

    position:relative;

    display:grid;

    grid-template-columns:repeat(9,1fr);

    grid-template-rows:repeat(5,1fr);

    aspect-ratio:9/5;

    overflow:hidden;

    border-radius:12px;

    background:#4e963d;
}


/* linhas do campo */

.cell{

    position:relative;

    background:
        linear-gradient(135deg,#67a94a,#4b913b);

    border:1px solid #28682999;

    cursor:pointer;

    transition:.1s;
}

.cell:nth-child(even){

    background:
        linear-gradient(135deg,#5c9e43,#438237);
}

.cell:hover{

    filter:brightness(1.18);

    box-shadow:
        inset 0 0 15px #d9ff7a44;
}


/* =========================
   PLANTAS
========================= */

.plant{

    position:absolute;

    inset:4%;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:clamp(32px,4vw,58px);

    z-index:5;

    filter:
        drop-shadow(0 7px 3px #173312);

    animation:appear .2s ease-out;
}

@keyframes appear{

    from{
        transform:scale(.2);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

.plant.shooter{
    animation:float 1.5s infinite alternate;
}

@keyframes float{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-3px);
    }
}

.health-bar{

    position:absolute;

    left:10%;
    right:10%;

    top:1px;

    height:6px;

    background:#270808;

    border-radius:10px;

    overflow:hidden;
}

.health-bar span{

    display:block;

    width:100%;
    height:100%;

    background:
        linear-gradient(90deg,#35e83f,#c7ff45);
}


/* =========================
   ZUMBIS
========================= */

.zombie{

    position:absolute;

    z-index:7;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:clamp(30px,4vw,55px);

    filter:
        drop-shadow(0 7px 4px #152012);

    animation:
        walk .7s infinite alternate;
}

@keyframes walk{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(2px);
    }
}

.zombie.fast{

    filter:
        drop-shadow(0 0 7px #ff713e);
}

.zombie.tank{

    filter:
        drop-shadow(0 0 8px #bbc2ce);
}

.zombie.boss{

    filter:
        drop-shadow(0 0 12px #e00000);
}


/* =========================
   PROJÉTEIS
========================= */

.projectile{

    position:absolute;

    width:15px;
    height:15px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 30% 30%,
            #f5ffba,
            #83ff32 45%,
            #228f1d
        );

    box-shadow:
        0 0 13px #9cff43;

    z-index:10;
}


/* =========================
   SOL
========================= */

.sun{

    position:absolute;

    width:48px;
    height:48px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:31px;

    z-index:20;

    cursor:pointer;

    filter:
        drop-shadow(0 0 9px #ffe54d);

    animation:
        sunPulse .8s infinite alternate;
}

@keyframes sunPulse{

    from{
        transform:scale(.9);
    }

    to{
        transform:scale(1.1);
    }
}


/* =========================
   EFEITOS
========================= */

.particle{

    position:absolute;

    z-index:30;

    pointer-events:none;

    animation:
        particle .7s forwards;
}

@keyframes particle{

    to{

        transform:
            translate(var(--x),var(--y))
            scale(0);

        opacity:0;
    }
}


/* =========================
   CONTROLES
========================= */

.controls{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:10px;

    margin-top:12px;
}

button{

    border:0;

    border-radius:11px;

    padding:11px 18px;

    color:white;

    font-weight:bold;

    background:
        linear-gradient(#5d9d46,#35672c);

    box-shadow:
        0 5px 0 #1c3c18,
        0 7px 15px #0007;

    cursor:pointer;
}

button:hover{
    filter:brightness(1.15);
}

button:active{

    transform:translateY(3px);

    box-shadow:
        0 2px 0 #1c3c18;
}


/* =========================
   MENSAGEM
========================= */

.message{

    position:fixed;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%)
        scale(.8);

    width:min(500px,90%);

    padding:35px;

    text-align:center;

    background:
        linear-gradient(145deg,#193b1f,#071108);

    border:3px solid #73a862;

    border-radius:22px;

    box-shadow:
        0 20px 70px #000;

    z-index:100;

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

.message.show{

    opacity:1;

    pointer-events:auto;

    transform:
        translate(-50%,-50%)
        scale(1);
}

.message h1{

    font-size:34px;

    margin-bottom:12px;
}

.message p{

    color:#c8ddc3;

    margin-bottom:20px;

    line-height:1.5;
}

.tip{

    padding:9px;

    text-align:center;

    color:#cbe1c7;

    font-size:13px;
}


/* =========================
   CELULAR
========================= */

@media(max-width:700px){

    .top{

        flex-direction:column;
    }

    .logo{

        font-size:21px;
    }

    .stat{

        min-width:75px;
    }

    .card{

        min-width:100px;
        height:75px;
    }

    .field-box{

        padding:5px;
    }
}

</style>
</head>


<body>


<div class="game">


    <!-- TOPO -->

    <div class="top">

        <div class="logo">
            <span>🌿</span>
            Plant Defense
        </div>


        <div class="stats">

            <div class="stat">
                <small>☀️ SOL</small>
                <strong id="sun">150</strong>
            </div>

            <div class="stat">
                <small>🌊 ONDA</small>
                <strong id="wave">1</strong>
            </div>

            <div class="stat">
                <small>🏆 PONTOS</small>
                <strong id="score">0</strong>
            </div>

            <div class="stat">
                <small>👑 RECORDE</small>
                <strong id="record">0</strong>
            </div>

        </div>

    </div>


    <!-- PLANTAS -->

    <div class="menu">


        <button
            class="card selected"
            id="card-shooter"
            onclick="selectPlant('shooter')">

            <div class="icon">🌱</div>

            <div class="name">
                Atirador
            </div>

            <div class="cost">
                ☀️ 50
            </div>

        </button>


        <button
            class="card"
            id="card-sunflower"
            onclick="selectPlant('sunflower')">

            <div class="icon">🌻</div>

            <div class="name">
                Girassol
            </div>

            <div class="cost">
                ☀️ 50
            </div>

        </button>


        <button
            class="card"
            id="card-wall"
            onclick="selectPlant('wall')">

            <div class="icon">🪨</div>

            <div class="name">
                Muralha
            </div>

            <div class="cost">
                ☀️ 75
            </div>

        </button>


        <button
            class="card"
            id="card-fire"
            onclick="selectPlant('fire')">

            <div class="icon">🔥</div>

            <div class="name">
                Planta de Fogo
            </div>

            <div class="cost">
                ☀️ 100
            </div>

        </button>


    </div>


    <!-- CAMPO -->

    <div class="field-box">

        <div
            id="field"
            class="field">
        </div>

    </div>


    <div class="tip">

        🌱 Escolha uma planta e clique em uma das
        <strong>5 linhas</strong> para defendê-las.

        ☀️ Colete os sóis para conseguir energia.

    </div>


    <!-- BOTÕES -->

    <div class="controls">

        <button onclick="startGame()">
            ▶ Começar
        </button>

        <button onclick="restartGame()">
            🔄 Reiniciar
        </button>

        <button
            onclick="togglePause()"
            id="pauseBtn">

            ⏸ Pausar

        </button>

    </div>

</div>


<!-- TELA -->

<div
    id="message"
    class="message">

    <h1 id="messageTitle">
        🌿 PLANT DEFENSE
    </h1>

    <p id="messageText">
        Prepare suas plantas para a batalha!
    </p>

    <button onclick="startFromMessage()">
        🌱 Jogar
    </button>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const ROWS = 5;
const COLS = 9;


/* =====================================================
   PLANTAS
===================================================== */

const plantData = {

    shooter:{
        cost:50,
        health:100,
        emoji:"🌱",
        damage:25,
        interval:1300
    },

    sunflower:{
        cost:50,
        health:90,
        emoji:"🌻",
        sunInterval:5500
    },

    wall:{
        cost:75,
        health:500,
        emoji:"🪨"
    },

    fire:{
        cost:100,
        health:120,
        emoji:"🔥",
        damage:55,
        interval:1800
    }

};


/* =====================================================
   ZUMBIS
===================================================== */

const zombieData = {

    normal:{
        emoji:"🧟",
        health:120,
        speed:0.0045,
        damage:0.18,
        points:25
    },

    fast:{
        emoji:"🧟‍♂️",
        health:85,
        speed:0.007,
        damage:0.15,
        points:40
    },

    tank:{
        emoji:"🪣",
        health:400,
        speed:0.0028,
        damage:0.30,
        points:80
    },

    boss:{
        emoji:"👹",
        health:900,
        speed:0.0018,
        damage:0.45,
        points:200
    }

};


/* =====================================================
   ESTADO
===================================================== */

let sun = 150;

let wave = 1;

let score = 0;

let record =
    Number(
        localStorage.getItem(
            "plantDefenseRecord"
        )
    ) || 0;

let selectedPlant = "shooter";

let plants = [];

let zombies = [];

let projectiles = [];

let suns = [];

let gameStarted = false;

let paused = false;

let gameOverState = false;

let lastTime = 0;

let zombieTimer = 0;

let waveTimer = 0;

let zombieId = 0;


/* =====================================================
   ELEMENTOS
===================================================== */

const field =
    document.getElementById("field");

const sunElement =
    document.getElementById("sun");

const waveElement =
    document.getElementById("wave");

const scoreElement =
    document.getElementById("score");

const recordElement =
    document.getElementById("record");


recordElement.textContent =
    record;


/* =====================================================
   CAMPO
===================================================== */

function createField(){

    field.innerHTML = "";

    for(let row=0;row<ROWS;row++){

        for(let col=0;col<COLS;col++){

            const cell =
                document.createElement("div");

            cell.className="cell";

            cell.dataset.row=row;
            cell.dataset.col=col;

            cell.onclick=()=>{
                plantAt(row,col);
            };

            field.appendChild(cell);

        }

    }

}


/* =====================================================
   SELECIONAR PLANTA
===================================================== */

function selectPlant(type){

    if(gameOverState)
        return;

    selectedPlant=type;

    document
        .querySelectorAll(".card")
        .forEach(card=>{
            card.classList.remove("selected");
        });

    document
        .getElementById("card-"+type)
        .classList.add("selected");

}


/* =====================================================
   PLANTAR
===================================================== */

function plantAt(row,col){

    if(
        !gameStarted ||
        paused ||
        gameOverState
    )
        return;


    if(
        plants.some(
            p=>p.row===row && p.col===col
        )
    )
        return;


    const data =
        plantData[selectedPlant];


    if(sun < data.cost){

        showFloatingText(
            "☀️ Sol insuficiente!",
            col,
            row
        );

        return;

    }


    sun -= data.cost;

    updateUI();


    const plant={

        id:
            Date.now()+Math.random(),

        row,
        col,

        type:selectedPlant,

        health:data.health,

        maxHealth:data.health,

        shootTimer:0,

        sunTimer:0

    };


    plants.push(plant);

    renderPlant(plant);

    createParticles(
        row,
        col,
        "🌿"
    );

}


/* =====================================================
   DESENHAR PLANTA
===================================================== */

function renderPlant(plant){

    const cell =
        getCell(
            plant.row,
            plant.col
        );

    if(!cell)
        return;


    let element =
        cell.querySelector(".plant");


    if(!element){

        element =
            document.createElement("div");

        element.className =
            "plant "+plant.type;

        element.id =
            "plant-"+plant.id;

        cell.appendChild(element);

    }


    element.textContent =
        plantData[
            plant.type
        ].emoji;


    const bar =
        document.createElement("div");

    bar.className="health-bar";


    const health =
        document.createElement("span");


    health.style.width =
        Math.max(
            0,
            plant.health/
            plant.maxHealth*100
        )+"%";


    bar.appendChild(health);


    element.innerHTML =
        plantData[
            plant.type
        ].emoji;


    element.appendChild(bar);

}


/* =====================================================
   PEGAR CÉLULA
===================================================== */

function getCell(row,col){

    return field.querySelector(
        `.cell[data-row="${row}"][data-col="${col}"]`
    );

}


/* =====================================================
   CRIAR ZUMBI
===================================================== */

function spawnZombie(){

    if(
        !gameStarted ||
        paused ||
        gameOverState
    )
        return;


    const row =
        Math.floor(
            Math.random()*ROWS
        );


    let type="normal";


    const chance =
        Math.random();


    if(
        wave>=5 &&
        chance<0.08
    ){

        type="boss";

    }
    else if(
        wave>=3 &&
        chance<0.22
    ){

        type="tank";

    }
    else if(
        wave>=2 &&
        chance<0.40
    ){

        type="fast";

    }


    const data =
        zombieData[type];


    const zombie={

        id:++zombieId,

        row,

        x:COLS+0.2,

        type,

        health:data.health,

        maxHealth:data.health,

        /*
          VELOCIDADE REDUZIDA
          Os zumbis agora demoram
          bastante para chegar.
        */

        speed:
            data.speed*
            (1+wave*0.012),

        damage:data.damage,

        points:data.points,

        attackTimer:0

    };


    zombies.push(zombie);

    renderZombie(zombie);

}


/* =====================================================
   DESENHAR ZUMBI
===================================================== */

function renderZombie(zombie){

    const cellWidth =
        field.clientWidth/COLS;


    let element =
        document.getElementById(
            "zombie-"+zombie.id
        );


    if(!element){

        element =
            document.createElement("div");

        element.id =
            "zombie-"+zombie.id;

        element.className =
            "zombie "+zombie.type;

        element.textContent =
            zombieData[
                zombie.type
            ].emoji;

        field.appendChild(element);

    }


    element.style.top =
        `calc(
            ${zombie.row} * ${100/ROWS}%
            + 1%
        )`;


    element.style.left =
        zombie.x*
        cellWidth+
        "px";


    element.style.width =
        cellWidth*.82+
        "px";


    element.style.height =
        field.clientHeight/
        ROWS*.82+
        "px";


    let bar =
        element.querySelector(
            ".health-bar"
        );


    if(!bar){

        bar =
            document.createElement("div");

        bar.className=
            "health-bar";

        const span =
            document.createElement("span");

        bar.appendChild(span);

        element.appendChild(bar);

    }


    bar.querySelector("span")
        .style.width =
        Math.max(
            0,
            zombie.health/
            zombie.maxHealth*100
        )+"%";

}


/* =====================================================
   ATIRAR
===================================================== */

function shoot(plant){

    const target =
        zombies.find(
            z =>
                z.row===plant.row &&
                z.x>plant.col &&
                z.x<COLS+1
        );


    if(!target)
        return;


    const projectile={

        id:
            Date.now()+Math.random(),

        row:plant.row,

        x:plant.col+.65,

        speed:
            plant.type==="fire"
            ?0.032
            :0.038,

        damage:
            plantData[
                plant.type
            ].damage

    };


    projectiles.push(projectile);

    renderProjectile(projectile);

}


/* =====================================================
   PROJÉTIL
===================================================== */

function renderProjectile(p){

    let element =
        document.getElementById(
            "projectile-"+p.id
        );


    if(!element){

        element =
            document.createElement("div");

        element.className=
            "projectile";

        element.id=
            "projectile-"+p.id;

        field.appendChild(element);

    }


    const cellWidth =
        field.clientWidth/COLS;


    element.style.left =
        p.x*
        cellWidth+
        "px";


    element.style.top =
        `calc(
            ${p.row} * ${100/ROWS}%
            + ${field.clientHeight/
               ROWS/2}px
        )`;


    if(p.damage>30){

        element.style.background =
            "radial-gradient(circle,#fff,#ffae00,#e83200)";

        element.style.boxShadow =
            "0 0 16px #ff6a00";

    }

}


/* =====================================================
   LOOP
===================================================== */

function gameLoop(time){

    if(!gameStarted){

        requestAnimationFrame(gameLoop);

        return;

    }


    const delta =
        Math.min(
            50,
            time-lastTime || 16
        );


    lastTime=time;


    if(
        !paused &&
        !gameOverState
    ){

        updatePlants(delta);

        updateProjectiles(delta);

        updateZombies(delta);


        zombieTimer+=delta;

        waveTimer+=delta;


        /*
          Zumbis aparecem mais devagar.
        */

        const spawnTime =
            Math.max(
                3500,
                6500-wave*100
            );


        if(
            zombieTimer>=spawnTime
        ){

            zombieTimer=0;

            spawnZombie();

        }


        /*
          Nova onda a cada 40 segundos.
        */

        if(
            waveTimer>=40000
        ){

            waveTimer=0;

            wave++;

            waveElement.textContent=
                wave;

            showFloatingText(
                "🌊 NOVA ONDA!",
                4,
                2
            );

        }

    }


    requestAnimationFrame(gameLoop);

}


/* =====================================================
   ATUALIZAR PLANTAS
===================================================== */

function updatePlants(delta){

    plants.forEach(plant=>{

        if(
            plant.type==="shooter" ||
            plant.type==="fire"
        ){

            plant.shootTimer+=delta;


            const interval =
                plantData[
                    plant.type
                ].interval;


            if(
                plant.shootTimer>=interval
            ){

                plant.shootTimer=0;

                shoot(plant);

            }

        }


        if(
            plant.type==="sunflower"
        ){

            plant.sunTimer+=delta;


            if(
                plant.sunTimer>=
                plantData.sunflower.sunInterval
            ){

                plant.sunTimer=0;

                createSun(
                    plant.row,
                    plant.col
                );

            }

        }

    });

}


/* =====================================================
   PROJÉTEIS
===================================================== */

function updateProjectiles(delta){

    for(
        let i=projectiles.length-1;
        i>=0;
        i--
    ){

        const p=
            projectiles[i];


        p.x+=
            p.speed*delta;


        let hit=null;


        for(
            const z of zombies
        ){

            if(
                z.row===p.row &&
                Math.abs(
                    z.x-p.x
                )<.35
            ){

                hit=z;

                break;

            }

        }


        if(hit){

            hit.health-=p.damage;

            createHitEffect(hit);

            removeProjectile(i);


            if(
                hit.health<=0
            ){

                killZombie(hit);

            }

            continue;

        }


        if(
            p.x>COLS+1
        ){

            removeProjectile(i);

            continue;

        }


        renderProjectile(p);

    }

}


/* =====================================================
   ZUMBIS
===================================================== */

function updateZombies(delta){

    zombies.forEach(zombie=>{

        const plant =
            plants.find(
                p =>
                    p.row===
                    zombie.row &&
                    Math.abs(
                        zombie.x-
                        (p.col+.45)
                    )<.55
            );


        if(plant){

            zombie.attackTimer+=delta;


            if(
                zombie.attackTimer>=1000
            ){

                zombie.attackTimer=0;


                plant.health -=
                    zombie.damage*10;


                renderPlant(plant);


                if(
                    plant.health<=0
                ){

                    removePlant(plant);

                }

            }

        }
        else{

            /*
              Movimento MUITO mais lento.
            */

            zombie.x -=
                zombie.speed*delta;

        }


        /*
          Agora eles só chegam
          depois de bastante tempo.
        */

        if(
            zombie.x<-.35
        ){

            endGame();

        }


        renderZombie(zombie);

    });

}


/* =====================================================
   MATAR ZUMBI
===================================================== */

function killZombie(zombie){

    score+=zombie.points;

    updateUI();

    createZombieExplosion(zombie);


    const index=
        zombies.indexOf(zombie);


    if(index!==-1){

        zombies.splice(
            index,
            1
        );

    }


    const element =
        document.getElementById(
            "zombie-"+zombie.id
        );


    if(element)
        element.remove();

}


/* =====================================================
   PROJÉTIL
===================================================== */

function removeProjectile(index){

    const p=
        projectiles[index];


    const element =
        document.getElementById(
            "projectile-"+p.id
        );


    if(element)
        element.remove();


    projectiles.splice(
        index,
        1
    );

}


/* =====================================================
   REMOVER PLANTA
===================================================== */

function removePlant(plant){

    const index=
        plants.indexOf(plant);


    if(index!==-1){

        plants.splice(
            index,
            1
        );

    }


    const cell =
        getCell(
            plant.row,
            plant.col
        );


    if(cell){

        const element =
            cell.querySelector(
                ".plant"
            );


        if(element)
            element.remove();

    }

}


/* =====================================================
   SOL
===================================================== */

function createSun(row,col){

    const object={

        id:
            Date.now()+Math.random(),

        row,
        col,

        collected:false

    };


    suns.push(object);


    const element =
        document.createElement("div");


    element.className="sun";

    element.id=
        "sun-"+object.id;

    element.textContent="☀️";


    const cell=
        getCell(row,col);


    if(cell){

        cell.appendChild(
            element
        );

    }


    element.onclick=()=>{

        collectSun(object);

    };

}


/* =====================================================
   COLETAR SOL
===================================================== */

function collectSun(object){

    if(object.collected)
        return;


    object.collected=true;


    sun+=25;


    updateUI();


    const element =
        document.getElementById(
            "sun-"+object.id
        );


    if(element)
        element.remove();


    const index=
        suns.indexOf(object);


    if(index!==-1)
        suns.splice(
            index,
            1
        );

}


/* =====================================================
   EFEITOS
===================================================== */

function createParticles(
    row,
    col,
    emoji
){

    const cell=
        getCell(row,col);


    if(!cell)
        return;


    for(
        let i=0;
        i<5;
        i++
    ){

        const p=
            document.createElement("div");


        p.className="particle";

        p.textContent=emoji;

        p.style.left="50%";
        p.style.top="50%";


        p.style.setProperty(
            "--x",
            `${(Math.random()-.5)*80}px`
        );


        p.style.setProperty(
            "--y",
            `${(Math.random()-.5)*80}px`
        );


        cell.appendChild(p);


        setTimeout(
            ()=>p.remove(),
            700
        );

    }

}


function createHitEffect(zombie){

    const element=
        document.getElementById(
            "zombie-"+zombie.id
        );


    if(!element)
        return;


    element.style.filter=
        "brightness(2)";


    setTimeout(
        ()=>{
            if(
                document.body.contains(
                    element
                )
            ){

                element.style.filter=
                    "";

            }
        },
        120
    );

}


function createZombieExplosion(zombie){

    for(
        let i=0;
        i<7;
        i++
    ){

        const p=
            document.createElement("div");


        p.className="particle";

        p.textContent=
            ["💥","💨","✨","🟢"]
            [
                Math.floor(
                    Math.random()*4
                )
            ];


        const cellWidth=
            field.clientWidth/COLS;


        p.style.left=
            zombie.x*
            cellWidth+
            "px";


        p.style.top=
            `calc(
                ${zombie.row} *
                ${100/ROWS}%
                + 40px
            )`;


        p.style.setProperty(
            "--x",
            `${(Math.random()-.5)*120}px`
        );


        p.style.setProperty(
            "--y",
            `${(Math.random()-.5)*100}px`
        );


        field.appendChild(p);


        setTimeout(
            ()=>p.remove(),
            700
        );

    }

}


/* =====================================================
   TEXTO
===================================================== */

function showFloatingText(
    text,
    col,
    row
){

    const element=
        document.createElement("div");


    element.textContent=text;


    element.style.position="absolute";

    element.style.zIndex="50";

    element.style.fontWeight="bold";

    element.style.color="white";

    element.style.textShadow=
        "0 2px 4px #000";


    element.style.left=
        col/COLS*100+"%";


    element.style.top=
        row/ROWS*100+"%";


    element.style.animation=
        "particle 1s forwards";


    field.appendChild(element);


    setTimeout(
        ()=>element.remove(),
        1000
    );

}


/* =====================================================
   UI
===================================================== */

function updateUI(){

    sunElement.textContent=
        sun;

    scoreElement.textContent=
        score;

    waveElement.textContent=
        wave;


    document
        .querySelectorAll(".card")
        .forEach(card=>{

            const type=
                card.id.replace(
                    "card-",
                    ""
                );


            if(
                sun<
                plantData[type].cost
            ){

                card.classList.add(
                    "disabled"
                );

            }
            else{

                card.classList.remove(
                    "disabled"
                );

            }

        });

}


/* =====================================================
   INICIAR
===================================================== */

function startGame(){

    if(gameStarted)
        return;


    gameStarted=true;

    paused=false;

    closeMessage();

    lastTime=
        performance.now();


    /*
      Sóis iniciais
    */

    createSun(1,3);

    createSun(3,6);

}


/* =====================================================
   BOTÃO DA TELA
===================================================== */

function startFromMessage(){

    if(gameOverState){

        restartGame();

        return;

    }


    startGame();

}


/* =====================================================
   PAUSAR
===================================================== */

function togglePause(){

    if(
        !gameStarted ||
        gameOverState
    )
        return;


    paused=!paused;


    document
        .getElementById(
            "pauseBtn"
        )
        .textContent=
        paused
        ? "▶ Continuar"
        : "⏸ Pausar";

}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

    if(gameOverState)
        return;


    gameOverState=true;


    if(score>record){

        record=score;


        localStorage.setItem(
            "plantDefenseRecord",
            record
        );

    }


    recordElement.textContent=
        record;


    showMessage(

        "💀 FIM DE JOGO",

        `
        Os zumbis chegaram à sua casa!

        <br><br>

        🏆 Pontuação:
        <strong>${score}</strong>

        <br>

        👑 Recorde:
        <strong>${record}</strong>
        `,

        "🔄 Jogar novamente"

    );

}


/* =====================================================
   MENSAGEM
===================================================== */

function showMessage(
    title,
    text,
    button="🌱 Jogar"
){

    document
        .getElementById(
            "messageTitle"
        )
        .textContent=title;


    document
        .getElementById(
            "messageText"
        )
        .innerHTML=text;


    document
        .querySelector(
            "#message button"
        )
        .textContent=button;


    document
        .getElementById(
            "message"
        )
        .classList.add("show");

}


function closeMessage(){

    document
        .getElementById(
            "message"
        )
        .classList.remove("show");

}


/* =====================================================
   REINICIAR
===================================================== */

function restartGame(){

    plants=[];
    zombies=[];
    projectiles=[];
    suns=[];


    sun=150;

    wave=1;

    score=0;


    gameStarted=false;

    paused=false;

    gameOverState=false;


    zombieTimer=0;

    waveTimer=0;


    document
        .getElementById(
            "pauseBtn"
        )
        .textContent=
        "⏸ Pausar";


    createField();


    document
        .querySelectorAll(
            ".zombie"
        )
        .forEach(
            e=>e.remove()
        );


    document
        .querySelectorAll(
            ".projectile"
        )
        .forEach(
            e=>e.remove()
        );


    document
        .querySelectorAll(
            ".sun"
        )
        .forEach(
            e=>e.remove()
        );


    updateUI();


    showMessage(

        "🌿 PLANT DEFENSE",

        `
        Defenda sua casa!

        <br><br>

        Você terá <strong>5 linhas</strong>,
        4 plantas e 4 tipos de zumbi.

        <br><br>

        Os zumbis estão mais lentos,
        então você terá bastante tempo
        para preparar sua defesa.
        `,

        "🌱 Começar"

    );

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

createField();

updateUI();

restartGame();

requestAnimationFrame(
    gameLoop
);


/* =====================================================
   SPAWN EXTRA
===================================================== */

setInterval(()=>{

    if(
        gameStarted &&
        !paused &&
        !gameOverState
    ){

        /*
          Spawn bem mais espaçado.
        */

        if(
            zombies.length<
            2+Math.floor(wave/2)
        ){

            spawnZombie();

        }

    }

},5000);

</script>
