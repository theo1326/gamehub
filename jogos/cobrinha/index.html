<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Cobrinha</title>

    <!-- Biblioteca oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        #nomeJogador {
            padding: 12px;
            font-size: 17px;
            border-radius: 8px;
            border: none;
            width: 250px;
            text-align: center;
            margin-bottom: 10px;
        }

        #pontuacao {
            font-size: 20px;
            margin-bottom: 15px;
        }

        canvas {
            background: #222;
            border: 3px solid white;
            max-width: 90vw;
            max-height: 70vh;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 17px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            color: #111;
        }

        button:hover {
            transform: scale(1.05);
        }

        #ranking {
            margin-top: 25px;
            width: 350px;
            max-width: 90vw;
            background: #222;
            padding: 15px;
            border-radius: 10px;
        }

        #ranking h2 {
            text-align: center;
            margin-top: 0;
        }

        .jogador {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid #444;
        }

        .jogador:last-child {
            border-bottom: none;
        }

        #mensagem {
            margin-top: 10px;
            color: #ccc;
        }
    </style>
</head>

<body>

    <h1>🐍 Cobrinha</h1>

    <input
        id="nomeJogador"
        type="text"
        maxlength="20"
        placeholder="Digite seu apelido"
    >

    <div id="pontuacao">Pontuação: 0</div>

    <canvas id="jogo" width="400" height="400"></canvas>

    <button onclick="reiniciar()">🔄 Reiniciar</button>

    <div id="mensagem"></div>

    <div id="ranking">
        <h2>🏆 Ranking Global</h2>
        <div id="listaRanking">Carregando...</div>
    </div>

    <script>
        /* =========================================
           SUPABASE
           ========================================= */

        const SUPABASE_URL = "https://vkswxahmirkhcynwlzys.supabase.co/rest/v1/";
        const SUPABASE_KEY = "sb_publishable_pGNNupmDtxbXRgs01aZdeg_6dJqw4Kc";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        /* =========================================
           JOGO
           ========================================= */

        const canvas = document.getElementById("jogo");
        const ctx = canvas.getContext("2d");

        const tamanho = 20;

        let cobra;
        let comida;
        let direcao;
        let pontuacao;
        let jogoAtivo;


        function iniciar() {

            cobra = [
                { x: 200, y: 200 },
                { x: 180, y: 200 },
                { x: 160, y: 200 }
            ];

            comida = criarComida();

            direcao = {
                x: tamanho,
                y: 0
            };

            pontuacao = 0;
            jogoAtivo = true;

            atualizarPontuacao();
            desenhar();

            document.getElementById("mensagem").textContent = "";
        }


        function criarComida() {

            return {
                x: Math.floor(
                    Math.random() *
                    (canvas.width / tamanho)
                ) * tamanho,

                y: Math.floor(
                    Math.random() *
                    (canvas.height / tamanho)
                ) * tamanho
            };
        }


        function desenhar() {

            ctx.fillStyle = "#222";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /* Comida */

            ctx.fillStyle = "red";

            ctx.fillRect(
                comida.x,
                comida.y,
                tamanho,
                tamanho
            );


            /* Cobra */

            ctx.fillStyle = "lime";

            cobra.forEach(parte => {

                ctx.fillRect(
                    parte.x,
                    parte.y,
                    tamanho - 2,
                    tamanho - 2
                );

            });
        }


        function atualizar() {

            if (!jogoAtivo) return;


            const cabeca = {

                x: cobra[0].x + direcao.x,

                y: cobra[0].y + direcao.y
            };


            /* Parede */

            if (
                cabeca.x < 0 ||
                cabeca.x >= canvas.width ||
                cabeca.y < 0 ||
                cabeca.y >= canvas.height
            ) {

                fimDeJogo();

                return;
            }


            /* Próprio corpo */

            for (
                let i = 0;
                i < cobra.length;
                i++
            ) {

                if (
                    cabeca.x === cobra[i].x &&
                    cabeca.y === cobra[i].y
                ) {

                    fimDeJogo();

                    return;
                }
            }


            cobra.unshift(cabeca);


            /* Comida */

            if (
                cabeca.x === comida.x &&
                cabeca.y === comida.y
            ) {

                pontuacao++;

                comida = criarComida();

                atualizarPontuacao();

            } else {

                cobra.pop();

            }


            desenhar();
        }


        function atualizarPontuacao() {

            document.getElementById(
                "pontuacao"
            ).textContent =
                "Pontuação: " + pontuacao;
        }


        /* =========================================
           SALVAR PONTUAÇÃO
           ========================================= */

        async function salvarPontuacao() {

            const nome =
                document
                    .getElementById("nomeJogador")
                    .value
                    .trim();


            if (!nome) {

                alert(
                    "Digite seu apelido antes de jogar!"
                );

                return;
            }


            if (pontuacao <= 0) {

                return;
            }


            const { error } =
                await supabaseClient
                    .from("snake_scores")
                    .insert({

                        player_name: nome,

                        score: pontuacao
                    });


         if (error) {

    console.error(
        "Erro Supabase:",
        error
    );

    alert(
        "ERRO: " +
        error.message +
        "\nCÓDIGO: " +
        error.code
    );

    document.getElementById(
        "mensagem"
    ).textContent =
        "⚠️ Não foi possível salvar a pontuação.";
                return;
            }


            document.getElementById(
                "mensagem"
            ).textContent =
                "✅ Pontuação enviada para o ranking!";


            carregarRanking();
        }


        /* =========================================
           FIM DE JOGO
           ========================================= */

        function fimDeJogo() {

            jogoAtivo = false;

            salvarPontuacao();

            setTimeout(() => {

                alert(
                    "Game Over!\n\n" +
                    "Pontuação: " +
                    pontuacao
                );

            }, 100);
        }


        /* =========================================
           REINICIAR
           ========================================= */

        function reiniciar() {

            const nome =
                document
                    .getElementById("nomeJogador")
                    .value
                    .trim();


            if (!nome) {

                alert(
                    "Digite seu apelido antes de jogar!"
                );

                return;
            }


            iniciar();
        }


        /* =========================================
           TECLADO
           ========================================= */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "ArrowUp" &&
                    direcao.y === 0
                ) {

                    direcao = {
                        x: 0,
                        y: -tamanho
                    };
                }


                if (
                    event.key === "ArrowDown" &&
                    direcao.y === 0
                ) {

                    direcao = {
                        x: 0,
                        y: tamanho
                    };
                }


                if (
                    event.key === "ArrowLeft" &&
                    direcao.x === 0
                ) {

                    direcao = {
                        x: -tamanho,
                        y: 0
                    };
                }


                if (
                    event.key === "ArrowRight" &&
                    direcao.x === 0
                ) {

                    direcao = {
                        x: tamanho,
                        y: 0
                    };
                }

            }
        );


        /* =========================================
           RANKING GLOBAL
           ========================================= */

        async function carregarRanking() {

            const lista =
                document.getElementById(
                    "listaRanking"
                );


            lista.textContent =
                "Carregando...";


            const { data, error } =
                await supabaseClient
                    .from("snake_scores")
                    .select("player_name, score")
                    .order("score", {
                        ascending: false
                    })
                    .limit(10);


            if (error) {

                console.error(
                    "Erro ranking:",
                    error
                );

                lista.textContent =
                    "Não foi possível carregar o ranking.";

                return;
            }


            if (!data || data.length === 0) {

                lista.textContent =
                    "Ainda não existem pontuações.";

                return;
            }


            lista.innerHTML =
                data
                    .map(
                        (jogador, indice) => `

                        <div class="jogador">

                            <span>
                                ${indice + 1}º
                                ${escaparHTML(
                                    jogador.player_name
                                )}
                            </span>

                            <strong>
                                ${jogador.score}
                            </strong>

                        </div>
                    `
                    )
                    .join("");
        }


        function escaparHTML(texto) {

            const div =
                document.createElement("div");

            div.textContent = texto;

            return div.innerHTML;
        }


        /* =========================================
           INICIAR
           ========================================= */

        iniciar();

        carregarRanking();

        setInterval(
            atualizar,
            120
        );

    </script>

</body>
</html>
