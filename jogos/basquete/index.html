<!DOCTYPE html>

<body>

<div id="menu">

                <div class="keys">

                    ↑ — pular<br>
                    ↓ — agachar<br>
                    L — arremessar
                </div>
            </div>

        </div>

        <button id="startBtn">COMEÇAR PARTIDA</button>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

function resize(){
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;
}

window.addEventListener("resize", resize);
resize();


/* =========================================================
   MUNDO
========================================================= */

const WORLD_WIDTH = 1600;
const WORLD_HEIGHT = 900;

const groundY = 765;

const gravity = 2100;


/* =========================================================
   CESTAS
========================================================= */

const basket1 = {
    x:125,
    rimY:405,
    rimWidth:86
};

const basket2 = {
    x:1475,
    rimY:405,
    rimWidth:86
};


/* =========================================================
   JOGADORES
========================================================= */

const player1 = {
    x:400,
    y:groundY-105,
    vx:0,
    vy:0,

    width:62,
    height:105,

    color:"#287cff",
    dark:"#104aaf",

    facing:1,
    onGround:true,
    crouching:false,

    shootCooldown:0
};

const player2 = {
    x:1138,
    y:groundY-105,
    vx:0,
    vy:0,

    width:62,
    height:105,

    color:"#e63c3c",
    dark:"#9d1717",

    facing:-1,
    onGround:true,
    crouching:false,

    shootCooldown:0
};


/* =========================================================
   BOLA
========================================================= */

const ball = {
    x:400,
    y:groundY-105,

    z:0,

    vx:0,
    vy:0,
    vz:0,

    radius:19,

    heldBy:player1,

    scored:false
};


/* =========================================================
   PARTIDA
========================================================= */

let playing = false;

let score1 = 0;
let score2 = 0;

let matchTime = 120;

let resetTimer = 0;

let lastTime = performance.now();


/* =========================================================
   TECLAS
========================================================= */

const keys = Object.create(null);

document.addEventListener(
    "keydown",
    function(e){

        keys[e.code] = true;

        /*
         * Impede o navegador de usar as setas para
         * rolar a página.
         */
        if(
            e.code === "ArrowLeft" ||
            e.code === "ArrowRight" ||
            e.code === "ArrowUp" ||
            e.code === "ArrowDown" ||
            e.code === "Space"
        ){
            e.preventDefault();
        }

        /*
         * ARREMESSO DO JOGADOR 1
         */
        if(
            e.code === "KeyF" &&
            !e.repeat
        ){
            e.preventDefault();

            if(
                playing &&
                ball.heldBy === player1
            ){
                shootBall(player1);
            }
        }

        /*
         * ARREMESSO DO JOGADOR 2
         */
        if(
            e.code === "KeyL" &&
            !e.repeat
        ){
            e.preventDefault();

            if(
                playing &&
                ball.heldBy === player2
            ){
                shootBall(player2);
            }
        }

    },
    true
);


document.addEventListener(
    "keyup",
    function(e){

        keys[e.code] = false;

    },
    true
);


/* =========================================================
   BOTÕES
========================================================= */

document.getElementById("startBtn").addEventListener(
    "click",
    startGame
);

document.getElementById("restartBtn").addEventListener(
    "click",
    startGame
);


/* =========================================================
   INICIAR
========================================================= */

function startGame(){

    document.getElementById("menu").style.display = "none";
    document.getElementById("gameOver").style.display = "none";

    score1 = 0;
    score2 = 0;

    matchTime = 120;

    resetTimer = 0;

    playing = true;

    player1.x = 400;
    player1.y = groundY-player1.height;

    player2.x = 1138;
    player2.y = groundY-player2.height;

    player1.vx = 0;
    player1.vy = 0;

    player2.vx = 0;
    player2.vy = 0;

    player1.onGround = true;
    player2.onGround = true;

    player1.crouching = false;
    player2.crouching = false;

    player1.facing = 1;
    player2.facing = -1;

    player1.shootCooldown = 0;
    player2.shootCooldown = 0;

    /*
     * A bola começa com o jogador 1.
     */
    ball.heldBy = player1;

    ball.x = player1.x;
    ball.y = player1.y;

    ball.z = 0;

    ball.vx = 0;
    ball.vy = 0;
    ball.vz = 0;

    ball.scored = false;

    lastTime = performance.now();
}


/* =========================================================
   POSIÇÃO DA MÃO
========================================================= */

function getHandPosition(player){

    return {
        x:
            player.x +
            player.width/2 +
            player.facing*42,

        y:
            player.y +
            (player.crouching ? 66 : 48)
    };

}


/* =========================================================
   ARREMESSO
========================================================= */

function shootBall(player){

    if(!playing) return;

    if(ball.heldBy !== player) return;

    if(player.shootCooldown > 0) return;


    player.shootCooldown = 0.55;


    const target =
        player === player1
        ? basket2
        : basket1;


    const hand = getHandPosition(player);


    /*
     * Libera a bola.
     */
    ball.heldBy = null;


    ball.x = hand.x;
    ball.y = hand.y;

    /*
     * Altura inicial da bola.
     */
    ball.z = 48;


    /*
     * Direção horizontal.
     */
    const dx =
        target.x -
        ball.x;


    /*
     * Tempo de voo.
     */
    const distance =
        Math.abs(dx);

    const flightTime =
        Math.max(
            1.0,
            Math.min(
                1.65,
                0.95 +
                distance/1700
            )
        );


    /*
     * Velocidade horizontal.
     */
    ball.vx =
        dx /
        flightTime;


    /*
     * A bola precisa subir e depois
     * descer até a altura do aro.
     *
     * Aqui usamos Z como altura real.
     */
    const desiredHeight =
        360;


    /*
     * Fórmula da parábola:
     *
     * z = z0 + vz*t - gravity*t²/2
     */
    ball.vz =
        (
            desiredHeight -
            ball.z +
            0.5 *
            gravity *
            flightTime *
            flightTime
        ) /
        flightTime;


    /*
     * Movimento vertical da quadra.
     */
    ball.vy = 0;

    ball.scored = false;
}


/* =========================================================
   ATUALIZAR JOGADOR
========================================================= */

function updatePlayer(player,dt,control){

    let move = 0;


    if(keys[control.left]){
        move -= 1;
    }

    if(keys[control.right]){
        move += 1;
    }


    const speed = 430;


    player.vx =
        move *
        speed;


    if(move !== 0){

        player.facing =
            move > 0
            ? 1
            : -1;

    }


    /*
     * PULO
     */
    if(
        keys[control.jump] &&
        player.onGround
    ){

        player.vy = -850;

        player.onGround = false;

    }


    /*
     * AGACHAR
     */
    player.crouching =
        !!keys[control.down];


    /*
     * FÍSICA
     */
    player.vy += gravity * dt;

    player.x += player.vx * dt;

    player.y += player.vy * dt;


    /*
     * Limites da quadra.
     */
    if(player.x < 25){
        player.x = 25;
    }

    if(
        player.x >
        WORLD_WIDTH -
        player.width -
        25
    ){

        player.x =
            WORLD_WIDTH -
            player.width -
            25;

    }


    /*
     * Chão.
     */
    const floor =
        groundY -
        player.height;

    if(player.y >= floor){

        player.y = floor;

        player.vy = 0;

        player.onGround = true;

    }else{

        player.onGround = false;

    }


    if(player.shootCooldown > 0){

        player.shootCooldown -= dt;

        if(player.shootCooldown < 0){
            player.shootCooldown = 0;
        }

    }
}


/* =========================================================
   PEGAR BOLA
========================================================= */

function tryPickupBall(player){

    if(ball.heldBy) return;

    if(ball.z > 105) return;


    const centerX =
        player.x +
        player.width/2;

    const centerY =
        player.y +
        player.height/2;


    const dx =
        ball.x -
        centerX;

    const dy =
        ball.y -
        centerY;


    const distance =
        Math.sqrt(
            dx*dx +
            dy*dy
        );


    if(distance < 125){

        ball.heldBy = player;

        ball.vx = 0;
        ball.vy = 0;
        ball.vz = 0;

        ball.scored = false;

    }

}


/* =========================================================
   BOLA
========================================================= */

function updateBall(dt){

    /*
     * Bola segurada.
     */
    if(ball.heldBy){

        const hand =
            getHandPosition(ball.heldBy);

        ball.x = hand.x;
        ball.y = hand.y;

        ball.z = 0;

        ball.vx = 0;
        ball.vy = 0;
        ball.vz = 0;

        return;
    }


    /*
     * Movimento horizontal.
     */
    ball.x += ball.vx * dt;


    /*
     * Movimento vertical da quadra.
     */
    ball.y += ball.vy * dt;


    /*
     * Gravidade da altura.
     */
    ball.vz -= gravity * dt;

    ball.z += ball.vz * dt;


    /*
     * Chão.
     */
    if(ball.z < 0){

        ball.z = 0;


        if(Math.abs(ball.vz) > 180){

            ball.vz *= -0.48;

        }else{

            ball.vz = 0;

        }


        ball.vx *= 0.88;

    }


    /*
     * Paredes.
     */
    if(ball.x < 25){

        ball.x = 25;

        ball.vx *= -0.55;

    }


    if(
        ball.x >
        WORLD_WIDTH -
        25
    ){

        ball.x =
            WORLD_WIDTH -
            25;

        ball.vx *= -0.55;

    }

}


/* =========================================================
   COLISÃO COM A CESTA
========================================================= */

function checkBasketCollision(){

    if(ball.heldBy) return;

    if(ball.scored) return;


    const baskets = [

        {
            basket:basket1,
            player:2
        },

        {
            basket:basket2,
            player:1
        }

    ];


    for(const item of baskets){

        const b = item.basket;


        /*
         * Altura da bola no mundo.
         *
         * O aro fica em uma posição vertical
         * de tela. Como o chão está em groundY,
         * convertemos a altura do aro para Z.
         */
        const rimHeight =
            groundY -
            b.rimY;


        const horizontal =
            Math.abs(
                ball.x -
                b.x
            );


        const vertical =
            Math.abs(
                ball.z -
                rimHeight
            );


        /*
         * A bola precisa estar descendo.
         */
        if(
            horizontal <
            b.rimWidth/2
            &&
            vertical < 28
            &&
            ball.vz < 0
        ){

            ball.scored = true;


            if(item.player === 1){

                score1++;

            }else{

                score2++;

            }


            /*
             * O jogador que sofreu a cesta
             * recebe a bola.
             */
            const nextPlayer =
                item.player === 1
                ? player2
                : player1;


            ball.heldBy =
                nextPlayer;


            ball.x =
                nextPlayer.x;

            ball.y =
                nextPlayer.y;

            ball.z = 0;

            ball.vx = 0;
            ball.vy = 0;
            ball.vz = 0;


            /*
             * Vitória por 5.
             */
            if(
                score1 >= 5 ||
                score2 >= 5
            ){

                setTimeout(
                    function(){

                        if(playing){
                            finishGame();
                        }

                    },
                    450
                );

                return;

            }


            /*
             * Pequeno intervalo após a cesta.
             */
            resetTimer = 1.1;

            return;

        }

    }

}


/* =========================================================
   FIM DA PARTIDA
========================================================= */

function finishGame(){

    if(!playing) return;

    playing = false;


    const result =
        document.getElementById("result");

    const finalScore =
        document.getElementById("finalScore");


    if(score1 > score2){

        result.textContent =
            "🔵 JOGADOR 1 VENCEU!";

    }else if(score2 > score1){

        result.textContent =
            "🔴 JOGADOR 2 VENCEU!";

    }else{

        result.textContent =
            "🤝 EMPATE!";

    }


    finalScore.textContent =
        `Placar final: ${score1} × ${score2}`;


    document.getElementById("gameOver").style.display =
        "flex";

}


/* =========================================================
   CÂMERA
========================================================= */

function getCamera(){

    const middle =
        (
            player1.x +
            player2.x
        ) / 2;


    let cameraX =
        middle -
        W / 2;


    const scale =
        Math.min(
            W / WORLD_WIDTH,
            H / WORLD_HEIGHT
        );


    const worldScreenWidth =
        WORLD_WIDTH *
        scale;


    if(worldScreenWidth <= W){

        cameraX = 0;

    }else{

        const maxCamera =
            WORLD_WIDTH -
            W / scale;

        cameraX =
            Math.max(
                0,
                Math.min(
                    cameraX,
                    maxCamera
                )
            );

    }


    return {
        x:cameraX,
        scale
    };

}


/* =========================================================
   DESENHAR QUADRA
========================================================= */

function drawCourt(camera){

    const s = camera.scale;

    ctx.save();

    ctx.translate(
        -camera.x * s,
        0
    );

    /*
     * Fundo.
     */
    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            groundY
        );

    sky.addColorStop(
        0,
        "#090d14"
    );

    sky.addColorStop(
        1,
        "#151b24"
    );

    ctx.fillStyle = sky;

    ctx.fillRect(
        0,
        0,
        WORLD_WIDTH * s,
        groundY * s
    );


    /*
     * Arquibancadas.
     */
    ctx.fillStyle = "#10151d";

    ctx.fillRect(
        0,
        250,
        WORLD_WIDTH * s,
        230
    );


    /*
     * Público.
     */
    for(let row=0;row<4;row++){

        for(let i=0;i<45;i++){

            const x =
                15 +
                i*36 +
                (row%2)*15;

            const y =
                285 +
                row*43;

            ctx.fillStyle =
                i%3===0
                ? "#d5dbe4"
                : i%3===1
                ? "#596575"
                : "#303b49";

            ctx.beginPath();

            ctx.arc(
                x*s,
                y*s,
                8*s,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }


    /*
     * Parede.
     */
    ctx.fillStyle = "#070a0e";

    ctx.fillRect(
        0,
        0,
        WORLD_WIDTH*s,
        75
    );


    /*
     * Piso.
     */
    const floor =
        ctx.createLinearGradient(
            0,
            groundY*s,
            0,
            WORLD_HEIGHT*s
        );

    floor.addColorStop(
        0,
        "#a36a37"
    );

    floor.addColorStop(
        1,
        "#5b371d"
    );

    ctx.fillStyle = floor;

    ctx.fillRect(
        0,
        groundY*s,
        WORLD_WIDTH*s,
        135*s
    );


    /*
     * Linhas da quadra.
     */
    ctx.strokeStyle =
        "rgba(255,255,255,.75)";

    ctx.lineWidth =
        5*s;


    ctx.beginPath();

    ctx.moveTo(
        0,
        groundY*s
    );

    ctx.lineTo(
        WORLD_WIDTH*s,
        groundY*s
    );

    ctx.stroke();


    /*
     * Linha central.
     */
    ctx.beginPath();

    ctx.moveTo(
        WORLD_WIDTH/2*s,
        groundY*s
    );

    ctx.lineTo(
        WORLD_WIDTH/2*s,
        560*s
    );

    ctx.stroke();


    /*
     * Círculo central.
     */
    ctx.beginPath();

    ctx.arc(
        WORLD_WIDTH/2*s,
        groundY*s,
        110*s,
        Math.PI,
        Math.PI*2
    );

    ctx.stroke();


    /*
     * Áreas próximas às cestas.
     */
    ctx.strokeRect(
        0,
        540*s,
        250*s,
        225*s
    );

    ctx.strokeRect(
        (WORLD_WIDTH-250)*s,
        540*s,
        250*s,
        225*s
    );


    /*
     * Três pontos.
     */
    ctx.beginPath();

    ctx.arc(
        125*s,
        groundY*s,
        260*s,
        Math.PI*1.15,
        Math.PI*1.85
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.arc(
        1475*s,
        groundY*s,
        260*s,
        Math.PI*1.15,
        Math.PI*1.85
    );

    ctx.stroke();


    drawBasket(basket1,camera);
    drawBasket(basket2,camera);

    ctx.restore();

}


/* =========================================================
   CESTA
========================================================= */

function drawBasket(b,camera){

    const s = camera.scale;


    /*
     * Suporte.
     */
    ctx.strokeStyle = "#222a34";
    ctx.lineWidth = 15*s;

    ctx.beginPath();

    ctx.moveTo(
        b.x*s,
        765*s
    );

    ctx.lineTo(
        b.x*s,
        410*s
    );

    ctx.stroke();


    /*
     * Tabela.
     */
    ctx.fillStyle = "#e7ebef";

    ctx.fillRect(
        (b.x-70)*s,
        (b.rimY-75)*s,
        140*s,
        80*s
    );


    ctx.strokeStyle = "#30363d";
    ctx.lineWidth = 5*s;

    ctx.strokeRect(
        (b.x-70)*s,
        (b.rimY-75)*s,
        140*s,
        80*s
    );


    /*
     * Aro.
     */
    ctx.strokeStyle = "#e34b24";
    ctx.lineWidth = 8*s;

    ctx.beginPath();

    ctx.ellipse(
        b.x*s,
        b.rimY*s,
        b.rimWidth/2*s,
        12*s,
        0,
        0,
        Math.PI*2
    );

    ctx.stroke();


    /*
     * Rede.
     */
    ctx.strokeStyle =
        "rgba(255,255,255,.65)";

    ctx.lineWidth =
        2*s;

    for(let i=-4;i<=4;i++){

        ctx.beginPath();

        ctx.moveTo(
            (b.x+i*9)*s,
            (b.rimY+8)*s
        );

        ctx.lineTo(
            (b.x+i*6)*s,
            (b.rimY+75)*s
        );

        ctx.stroke();

    }

}


/* =========================================================
   DESENHAR JOGADOR
========================================================= */

function drawPlayer(player,camera){

    const s = camera.scale;

    const x =
        player.x*s;

    const y =
        player.y*s;

    const w =
        player.width*s;

    const h =
        player.height*s;


    ctx.save();


    /*
     * Sombra.
     */
    ctx.fillStyle =
        "rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.ellipse(
        (player.x+w/2/s)*s,
        groundY*s,
        38*s,
        10*s,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
     * Corpo.
     */
    ctx.fillStyle =
        player.dark;

    ctx.fillRect(
        x+9*s,
        y+40*s,
        w-18*s,
        h-45*s
    );


    /*
     * Camisa.
     */
    ctx.fillStyle =
        player.color;

    ctx.fillRect(
        x+12*s,
        y+39*s,
        w-24*s,
        h-48*s
    );


    /*
     * Cabeça.
     */
    ctx.fillStyle =
        "#d99a70";

    ctx.beginPath();

    ctx.arc(
        x+w/2,
        y+24*s,
        20*s,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
     * Cabelo.
     */
    ctx.fillStyle =
        "#1b1b1b";

    ctx.beginPath();

    ctx.arc(
        x+w/2,
        y+17*s,
        20*s,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /*
     * Braço.
     */
    const hand =
        getHandPosition(player);

    ctx.strokeStyle =
        player.color;

    ctx.lineWidth =
        13*s;

    ctx.lineCap =
        "round";

    ctx.beginPath();

    ctx.moveTo(
        x+w/2,
        y+48*s
    );

    ctx.lineTo(
        hand.x*s,
        hand.y*s
    );

    ctx.stroke();


    /*
     * Pernas.
     */
    ctx.strokeStyle =
        "#161a20";

    ctx.lineWidth =
        16*s;

    ctx.beginPath();

    ctx.moveTo(
        x+23*s,
        y+h-8*s
    );

    ctx.lineTo(
        x+16*s,
        groundY*s
    );

    ctx.moveTo(
        x+39*s,
        y+h-8*s
    );

    ctx.lineTo(
        x+48*s,
        groundY*s
    );

    ctx.stroke();


    ctx.restore();

}


/* =========================================================
   DESENHAR BOLA
========================================================= */

function drawBall(camera){

    const s =
        camera.scale;


    /*
     * Posição da bola na tela.
     *
     * Z representa altura.
     */
    const screenX =
        ball.x*s -
        camera.x*s;

    const screenY =
        (ball.y-ball.z)*s;


    /*
     * Sombra.
     */
    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        (ball.x-camera.x)*s,
        ball.y*s,
        Math.max(
            7*s,
            18*s -
            ball.z*0.025*s
        ),
        6*s,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
     * Bola.
     */
    const gradient =
        ctx.createRadialGradient(
            screenX-5*s,
            screenY-6*s,
            2*s,
            screenX,
            screenY,
            ball.radius*s
        );

    gradient.addColorStop(
        0,
        "#ffb45a"
    );

    gradient.addColorStop(
        1,
        "#b84b0e"
    );

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.arc(
        screenX,
        screenY,
        ball.radius*s,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
     * Linhas da bola.
     */
    ctx.strokeStyle =
        "#301506";

    ctx.lineWidth =
        2*s;

    ctx.beginPath();

    ctx.arc(
        screenX,
        screenY,
        ball.radius*s*0.62,
        -Math.PI/2,
        Math.PI/2
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.arc(
        screenX,
        screenY,
        ball.radius*s*0.62,
        Math.PI/2,
        Math.PI*1.5
    );

    ctx.stroke();

}


/* =========================================================
   HUD
========================================================= */

function drawHUD(){

    ctx.save();


    /*
     * Placar.
     */
    ctx.fillStyle =
        "rgba(5,8,12,.82)";

    ctx.fillRect(
        W/2-190,
        15,
        380,
        82
    );


    ctx.textAlign =
        "center";

    ctx.font =
        "bold 32px Arial";

    ctx.fillStyle =
        "#287cff";

    ctx.fillText(
        score1,
        W/2-110,
        53
    );


    ctx.fillStyle =
        "#e63c3c";

    ctx.fillText(
        score2,
        W/2+110,
        53
    );


    ctx.font =
        "bold 18px Arial";

    ctx.fillStyle =
        "white";

    const minutes =
        Math.floor(matchTime/60);

    const seconds =
        Math.floor(matchTime%60)
        .toString()
        .padStart(2,"0");


    ctx.fillText(
        `${minutes}:${seconds}`,
        W/2,
        52
    );


    ctx.font =
        "13px Arial";

    ctx.fillStyle =
        "#9ba7b6";


    if(ball.heldBy === player1){

        ctx.fillText(
            "F • ARREMESSAR",
            W/2-105,
            82
        );

    }else if(ball.heldBy === player2){

        ctx.fillText(
            "L • ARREMESSAR",
            W/2+105,
            82
        );

    }


    ctx.restore();

}


/* =========================================================
   LOOP
========================================================= */

function gameLoop(now){

    let dt =
        (now-lastTime)/1000;

    lastTime =
        now;


    /*
     * Evita problemas quando a aba
     * fica parada.
     */
    dt =
        Math.min(
            dt,
            0.033
        );


    if(playing){

        /*
         * Temporizador.
         */
        matchTime -= dt;


        if(matchTime <= 0){

            matchTime = 0;

            finishGame();

        }


        /*
         * Jogadores.
         */
        updatePlayer(
            player1,
            dt,
            {
                left:"KeyA",
                right:"KeyD",
                jump:"KeyW",
                down:"KeyS"
            }
        );


        updatePlayer(
            player2,
            dt,
            {
                left:"ArrowLeft",
                right:"ArrowRight",
                jump:"ArrowUp",
                down:"ArrowDown"
            }
        );


        /*
         * Bola.
         */
        if(resetTimer > 0){

            resetTimer -= dt;

        }else{

            updateBall(dt);

            tryPickupBall(player1);
            tryPickupBall(player2);

            checkBasketCollision();

        }

    }


    /*
     * Renderização.
     */
    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const camera =
        getCamera();


    ctx.save();

    /*
     * Escala para encaixar
     * o mundo na tela.
     */
    const scale =
        camera.scale;


    ctx.scale(
        scale,
        scale
    );


    /*
     * O desenho da quadra usa
     * escala própria, então voltamos
     * ao sistema normal.
     */
    ctx.restore();


    drawCourt(camera);


    /*
     * Jogadores.
     */
    ctx.save();

    ctx.translate(
        -camera.x*camera.scale,
        0
    );

    drawPlayer(
        player1,
        {
            scale:camera.scale,
            x:camera.x
        }
    );

    drawPlayer(
        player2,
        {
            scale:camera.scale,
            x:camera.x
        }
    );

    ctx.restore();


    /*
     * Bola.
     */
    drawBall(camera);


    /*
     * HUD.
     */
    drawHUD();


    requestAnimationFrame(gameLoop);

}


/* =========================================================
   COMEÇAR LOOP
========================================================= */

requestAnimationFrame(gameLoop);

</script>
