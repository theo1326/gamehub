<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const menu = document.getElementById("menu");
const gameOver = document.getElementById("gameOver");
const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");

const winnerText = document.getElementById("winnerText");
const resultText = document.getElementById("resultText");
const finalScore = document.getElementById("finalScore");

const WORLD_WIDTH = 1600;
const WORLD_HEIGHT = 900;

let scale = 1;
let offsetX = 0;
let offsetY = 0;

function resize(){

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    scale = Math.min(
        canvas.width / WORLD_WIDTH,
        canvas.height / WORLD_HEIGHT
    );

    offsetX = (canvas.width - WORLD_WIDTH * scale) / 2;
    offsetY = (canvas.height - WORLD_HEIGHT * scale) / 2;
}

window.addEventListener("resize", resize);
resize();


// ===============================
// CONTROLES
// ===============================

const keys = {};

window.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

    if([
        "arrowleft",
        "arrowright",
        "arrowup",
        "arrowdown",
        " "
    ].includes(e.key.toLowerCase())){
        e.preventDefault();
    }

});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});


// ===============================
// JOGO
// ===============================

let playing = false;
let matchTime = 120;

let score1 = 0;
let score2 = 0;

let lastTime = 0;

const groundY = 765;


// ===============================
// JOGADORES
// ===============================

const player1 = {
    x:430,
    y:groundY - 90,
    vx:0,
    vy:0,
    width:55,
    height:90,
    color:"#287cff",
    facing:1,
    onGround:true,
    shooting:false,
    shootCooldown:0
};

const player2 = {
    x:1170,
    y:groundY - 90,
    vx:0,
    vy:0,
    width:55,
    height:90,
    color:"#e63c3c",
    facing:-1,
    onGround:true,
    shooting:false,
    shootCooldown:0
};


// ===============================
// BOLA
// ===============================

const ball = {
    x:800,
    y:groundY - 100,
    z:0,

    vx:0,
    vy:0,
    vz:0,

    radius:18,

    heldBy:null,

    scored:false
};


// ===============================
// CESTAS
// ===============================

const basket1 = {
    x:125,
    rimY:405,
    rimWidth:90
};

const basket2 = {
    x:1475,
    rimY:405,
    rimWidth:90
};


// ===============================
// RESET
// ===============================

function resetBall(){

    ball.x = 800;
    ball.y = groundY - 100;
    ball.z = 0;

    ball.vx = 0;
    ball.vy = 0;
    ball.vz = 0;

    ball.heldBy = null;
    ball.scored = false;
}

function resetGame(){

    score1 = 0;
    score2 = 0;

    matchTime = 120;

    player1.x = 430;
    player1.y = groundY - 90;
    player1.vx = 0;
    player1.vy = 0;
    player1.facing = 1;
    player1.onGround = true;
    player1.shootCooldown = 0;

    player2.x = 1170;
    player2.y = groundY - 90;
    player2.vx = 0;
    player2.vy = 0;
    player2.facing = -1;
    player2.onGround = true;
    player2.shootCooldown = 0;

    resetBall();
}


// ===============================
// COMEÇAR
// ===============================

function startGame(){

    resetGame();

    menu.style.display = "none";
    gameOver.style.display = "none";

    playing = true;

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);
}


// ===============================
// MOVIMENTO
// ===============================

function updatePlayer(player, dt, controls){

    const speed = 330;
    const jumpPower = 720;

    if(keys[controls.left]){
        player.vx = -speed;
        player.facing = -1;
    }
    else if(keys[controls.right]){
        player.vx = speed;
        player.facing = 1;
    }
    else{
        player.vx *= 0.75;
    }

    if(keys[controls.jump] && player.onGround){

        player.vy = -jumpPower;
        player.onGround = false;
    }

    player.vy += 1700 * dt;

    player.x += player.vx * dt;
    player.y += player.vy * dt;

    if(player.y + player.height >= groundY){

        player.y = groundY - player.height;

        player.vy = 0;

        player.onGround = true;
    }

    player.x = Math.max(
        40,
        Math.min(WORLD_WIDTH - 40 - player.width, player.x)
    );

    if(player.shootCooldown > 0){
        player.shootCooldown -= dt;
    }
}


// ===============================
// POSIÇÃO DA BOLA NA MÃO
// ===============================

function getHandPosition(player){

    const crouching =
        keys[player === player1 ? "s" : "arrowdown"];

    const handX =
        player.x +
        (player.facing === 1 ? player.width + 5 : -5);

    const handY =
        player.y +
        (crouching ? 58 : 38);

    return {
        x:handX,
        y:handY
    };
}


// ===============================
// PEGAR BOLA
// ===============================

function tryPickupBall(){

    if(ball.heldBy) return;

    const players = [player1,player2];

    for(const player of players){

        const hand = getHandPosition(player);

        const dx = ball.x - hand.x;
        const dy = ball.y - hand.y;

        const dist = Math.sqrt(dx*dx + dy*dy);

        if(dist < 75 && ball.z < 70){

            ball.heldBy = player;
            return;
        }
    }
}


// ===============================
// ARREMESSO
// ===============================

function shootBall(player){

    if(ball.heldBy !== player) return;

    if(player.shootCooldown > 0) return;

    player.shootCooldown = .55;

    const target =
        player === player1
        ? basket2
        : basket1;

    const hand = getHandPosition(player);

    ball.heldBy = null;

    ball.x = hand.x;
    ball.y = hand.y;

    ball.z = 40;

    const dx = target.x - ball.x;

    /*
       A cesta é alta e o arremesso
       precisa ter bastante força vertical.
    */

    ball.vx = dx * 1.25;

    ball.vy = 0;

    ball.vz = 930;

    ball.scored = false;
}


// ===============================
// ATUALIZAR BOLA
// ===============================

function updateBall(dt){

    if(ball.heldBy){

        const hand = getHandPosition(ball.heldBy);

        ball.x = hand.x;
        ball.y = hand.y;
        ball.z = 40;

        ball.vx = 0;
        ball.vy = 0;
        ball.vz = 0;

        return;
    }

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    ball.z += ball.vz * dt;

    ball.vz -= 1900 * dt;

    ball.vx *= Math.pow(.995,dt * 60);

    // Quicar no chão
    if(ball.z <= 0){

        ball.z = 0;

        if(Math.abs(ball.vz) > 100){

            ball.vz *= -.55;
        }
        else{

            ball.vz = 0;
        }

        ball.vx *= .78;
    }

    // Limites
    if(ball.x < 20){

        ball.x = 20;
        ball.vx *= -.7;
    }

    if(ball.x > WORLD_WIDTH - 20){

        ball.x = WORLD_WIDTH - 20;
        ball.vx *= -.7;
    }
}


// ===============================
// ROUBAR BOLA
// ===============================

function checkSteal(){

    if(!ball.heldBy) return;

    const holder = ball.heldBy;

    const opponent =
        holder === player1
        ? player2
        : player1;

    const dx =
        (holder.x + holder.width/2) -
        (opponent.x + opponent.width/2);

    const dy =
        (holder.y + holder.height/2) -
        (opponent.y + opponent.height/2);

    const dist = Math.sqrt(dx*dx + dy*dy);

    if(dist < 60){

        const hand = getHandPosition(holder);

        ball.heldBy = null;

        ball.x = hand.x;
        ball.y = hand.y;
        ball.z = 50;

        ball.vx =
            opponent === player1
            ? 170
            : -170;

        ball.vz = 300;
    }
}


// ===============================
// COLISÃO COM A CESTA
// ===============================

function checkBasketCollision(){

    if(ball.heldBy) return;
    if(ball.scored) return;

    /*
       Como o jogo é lateral, a bola precisa
       passar pelo aro na altura correta.

       A cesta é propositalmente difícil:
       a bola precisa estar dentro de uma área
       pequena e estar descendo.
    */

    const baskets = [
        {
            basket:basket1,
            owner:2
        },
        {
            basket:basket2,
            owner:1
        }
    ];

    for(const item of baskets){

        const b = item.basket;

        const horizontalDistance =
            Math.abs(ball.x - b.x);

        const verticalDistance =
            Math.abs(
                (ball.y - ball.z) - b.rimY
            );

        /*
           A bola deve estar caindo.
        */

        if(
            horizontalDistance < b.rimWidth / 2 &&
            verticalDistance < 20 &&
            ball.vz < 0
        ){

            ball.scored = true;

            if(item.owner === 1){
                score1 += 2;
            }
            else{
                score2 += 2;
            }

            updateScore();

            /*
               PRIMEIRO A FAZER 5 CESTAS
            */

            if(score1 >= 5 || score2 >= 5){

                setTimeout(() => {

                    if(playing){
                        finishGame();
                    }

                },500);

                return;
            }

            resetTimer = 1.3;

            return;
        }
    }
}


// ===============================
// RESET APÓS CESTA
// ===============================

let resetTimer = 0;

function updateReset(dt){

    if(resetTimer > 0){

        resetTimer -= dt;

        if(resetTimer <= 0){

            resetBall();

            /*
               Após uma cesta a bola volta
               para o centro da quadra.
            */

            ball.x = WORLD_WIDTH / 2;
            ball.y = groundY - 100;
            ball.z = 0;
        }
    }
}


// ===============================
// TEMPO
// ===============================

function updateTimer(dt){

    matchTime -= dt;

    if(matchTime <= 0){

        matchTime = 0;

        /*
           Quando o tempo acaba:
           - maior número de cestas vence
           - empate = empate
        */

        finishGame();
    }
}


// ===============================
// FINAL DA PARTIDA
// ===============================

function finishGame(){

    if(!playing) return;

    playing = false;

    if(score1 > score2){

        winnerText.textContent = "🔵 JOGADOR 1 VENCEU!";

        resultText.textContent =
            "Vitória do Jogador 1!";
    }
    else if(score2 > score1){

        winnerText.textContent = "🔴 JOGADOR 2 VENCEU!";

        resultText.textContent =
            "Vitória do Jogador 2!";
    }
    else{

        winnerText.textContent = "🤝 EMPATE!";

        resultText.textContent =
            "A partida terminou empatada.";
    }

    finalScore.textContent =
        `Jogador 1: ${score1}  ×  ${score2} : Jogador 2`;

    gameOver.style.display = "flex";
}


// ===============================
// PLACAR
// ===============================

function updateScore(){
    // O placar é desenhado diretamente no canvas.
}


// ===============================
// DESENHO DA QUADRA
// ===============================

function drawCourt(){

    // Fundo
    ctx.fillStyle = "#171717";
    ctx.fillRect(0,0,WORLD_WIDTH,WORLD_HEIGHT);

    // Parede
    ctx.fillStyle = "#222";
    ctx.fillRect(0,0,WORLD_WIDTH,groundY - 15);

    // Piso
    ctx.fillStyle = "#3a3a3a";
    ctx.fillRect(0,groundY,WORLD_WIDTH,WORLD_HEIGHT-groundY);

    // Linhas do piso
    ctx.strokeStyle = "#777";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(0,groundY);
    ctx.lineTo(WORLD_WIDTH,groundY);
    ctx.stroke();

    // Linha central
    ctx.strokeStyle = "#666";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(WORLD_WIDTH/2,groundY);
    ctx.lineTo(WORLD_WIDTH/2,groundY-130);
    ctx.stroke();

    // Círculo central
    ctx.beginPath();
    ctx.arc(
        WORLD_WIDTH/2,
        groundY-10,
        95,
        Math.PI,
        0
    );
    ctx.stroke();

    // Áreas das cestas
    ctx.strokeStyle = "#666";
    ctx.lineWidth = 4;

    ctx.strokeRect(
        0,
        groundY-250,
        230,
        250
    );

    ctx.strokeRect(
        WORLD_WIDTH-230,
        groundY-250,
        230,
        250
    );

    drawBasket(basket1,true);
    drawBasket(basket2,false);
}


// ===============================
// DESENHAR CESTA
// ===============================

function drawBasket(basket,left){

    const poleX =
        left
        ? basket.x - 35
        : basket.x + 35;

    // Poste
    ctx.strokeStyle = "#999";
    ctx.lineWidth = 15;

    ctx.beginPath();

    ctx.moveTo(
        poleX,
        groundY
    );

    ctx.lineTo(
        poleX,
        basket.rimY - 40
    );

    ctx.stroke();

    // Suporte
    ctx.strokeStyle = "#aaa";
    ctx.lineWidth = 8;

    ctx.beginPath();

    ctx.moveTo(
        poleX,
        basket.rimY - 40
    );

    ctx.lineTo(
        basket.x,
        basket.rimY - 40
    );

    ctx.stroke();

    // Tabela
    ctx.fillStyle = "#eee";

    ctx.fillRect(
        basket.x - 8,
        basket.rimY - 95,
        16,
        90
    );

    // Aro
    ctx.strokeStyle = "#f45b2a";
    ctx.lineWidth = 8;

    ctx.beginPath();

    ctx.ellipse(
        basket.x,
        basket.rimY,
        45,
        13,
        0,
        0,
        Math.PI*2
    );

    ctx.stroke();

    // Rede
    ctx.strokeStyle = "#ddd";
    ctx.lineWidth = 2;

    for(let i=0;i<7;i++){

        const x =
            basket.x - 35 + i*12;

        ctx.beginPath();

        ctx.moveTo(
            x,
            basket.rimY + 5
        );

        ctx.lineTo(
            basket.x + (i-3)*8,
            basket.rimY + 65
        );

        ctx.stroke();
    }

    for(let i=0;i<5;i++){

        const y =
            basket.rimY + 15 + i*10;

        ctx.beginPath();

        ctx.moveTo(
            basket.x - 30 + i*15,
            y
        );

        ctx.lineTo(
            basket.x + 30 - i*15,
            y
        );

        ctx.stroke();
    }
}


// ===============================
// DESENHAR JOGADOR
// ===============================

function drawPlayer(player){

    const x = player.x;
    const y = player.y;

    // Sombra
    ctx.fillStyle = "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        x + player.width/2,
        groundY + 5,
        38,
        10,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    // Corpo
    ctx.fillStyle = player.color;

    ctx.fillRect(
        x + 12,
        y + 28,
        32,
        48
    );

    // Cabeça
    ctx.beginPath();

    ctx.arc(
        x + 28,
        y + 15,
        18,
        0,
        Math.PI*2
    );

    ctx.fill();

    // Pernas
    ctx.lineWidth = 12;
    ctx.strokeStyle = player.color;

    ctx.beginPath();

    ctx.moveTo(
        x + 20,
        y + 72
    );

    ctx.lineTo(
        x + 14,
        y + 88
    );

    ctx.moveTo(
        x + 37,
        y + 72
    );

    ctx.lineTo(
        x + 45,
        y + 88
    );

    ctx.stroke();

    // Braço
    ctx.lineWidth = 10;

    const hand = getHandPosition(player);

    ctx.beginPath();

    ctx.moveTo(
        x + 28,
        y + 38
    );

    ctx.lineTo(
        hand.x,
        hand.y
    );

    ctx.stroke();

    // Número
    ctx.fillStyle = "#fff";
    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        player === player1 ? "1" : "2",
        x + 28,
        y + 60
    );
}


// ===============================
// DESENHAR BOLA
// ===============================

function drawBall(){

    const screenY =
        ball.y - ball.z;

    // Sombra da bola
    ctx.fillStyle = "rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.ellipse(
        ball.x,
        ball.y + 5,
        ball.radius,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    // Bola
    ctx.fillStyle = "#d87928";

    ctx.beginPath();

    ctx.arc(
        ball.x,
        screenY,
        ball.radius,
        0,
        Math.PI*2
    );

    ctx.fill();

    // Linhas da bola
    ctx.strokeStyle = "#542a0f";
    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.arc(
        ball.x,
        screenY,
        ball.radius * .65,
        -Math.PI/2,
        Math.PI/2
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        ball.x-ball.radius,
        screenY
    );

    ctx.lineTo(
        ball.x+ball.radius,
        screenY
    );

    ctx.stroke();
}


// ===============================
// HUD
// ===============================

function drawHUD(){

    // Placar
    ctx.fillStyle = "rgba(0,0,0,.7)";

    ctx.fillRect(
        WORLD_WIDTH/2 - 250,
        25,
        500,
        100
    );

    ctx.textAlign = "center";

    ctx.font = "bold 38px Arial";

    ctx.fillStyle = player1.color;

    ctx.fillText(
        score1,
        WORLD_WIDTH/2 - 130,
        88
    );

    ctx.fillStyle = "#fff";

    ctx.font = "bold 30px Arial";

    ctx.fillText(
        "×",
        WORLD_WIDTH/2,
        88
    );

    ctx.fillStyle = player2.color;

    ctx.font = "bold 38px Arial";

    ctx.fillText(
        score2,
        WORLD_WIDTH/2 + 130,
        88
    );

    // Tempo
    const minutes =
        Math.floor(matchTime / 60);

    const seconds =
        Math.floor(matchTime % 60);

    const timeText =
        `${minutes}:${seconds.toString().padStart(2,"0")}`;

    ctx.fillStyle = "#fff";

    ctx.font = "bold 25px Arial";

    ctx.fillText(
        timeText,
        WORLD_WIDTH/2,
        117
    );

    // Regra de 5
    ctx.font = "bold 17px Arial";

    ctx.fillStyle = "#bbb";

    ctx.fillText(
        "Primeiro a 5 cestas vence",
        WORLD_WIDTH/2,
        150
    );
}


// ===============================
// LOOP
// ===============================

function update(dt){

    if(!playing) return;

    updatePlayer(
        player1,
        dt,
        {
            left:"a",
            right:"d",
            jump:"w"
        }
    );

    updatePlayer(
        player2,
        dt,
        {
            left:"arrowleft",
            right:"arrowright",
            jump:"arrowup"
        }
    );

    // Arremessos
    if(keys["f"]){
        shootBall(player1);
    }

    if(keys["l"]){
        shootBall(player2);
    }

    tryPickupBall();

    checkSteal();

    updateBall(dt);

    checkBasketCollision();

    updateReset(dt);

    updateTimer(dt);
}


// ===============================
// DESENHAR
// ===============================

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.save();

    ctx.translate(
        offsetX,
        offsetY
    );

    ctx.scale(
        scale,
        scale
    );

    drawCourt();

    drawPlayer(player1);
    drawPlayer(player2);

    drawBall();

    drawHUD();

    ctx.restore();
}


// ===============================
// GAME LOOP
// ===============================

function gameLoop(time){

    if(!playing){

        draw();

        return;
    }

    let dt =
        (time - lastTime) / 1000;

    lastTime = time;

    if(dt > .05){
        dt = .05;
    }

    update(dt);

    draw();

    if(playing){

        requestAnimationFrame(gameLoop);

    }
    else{

        draw();
    }
}

startBtn.addEventListener(

    startGame
);

restartBtn.addEventListener(
    "click",
    () => {

        gameOver.style.display = "none";

        startGame();
    }
);

// ===============================

resetGame();
draw();
