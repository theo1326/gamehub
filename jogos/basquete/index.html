<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ludix - Basquete 2 Jogadores</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,Helvetica,sans-serif;
    user-select:none;
    touch-action:none;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

#game{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* =========================================================
   MENU
========================================================= */

.screen{
    position:absolute;
    inset:0;
    z-index:20;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            #252525,
            #080808 75%
        );
}

.panel{
    width:min(460px,92vw);

    padding:35px 28px;

    text-align:center;

    background:#151515;

    border:1px solid #444;

    border-radius:18px;

    box-shadow:
        0 20px 60px #000;
}

.logo{
    font-size:clamp(40px,9vw,68px);

    font-weight:900;

    color:#fff;

    letter-spacing:2px;
}

.logo span{
    color:#f28c28;
}

.subtitle{
    margin-top:8px;

    color:#aaa;

    letter-spacing:4px;

    font-size:13px;
}

.btn{
    width:100%;

    margin-top:16px;

    padding:15px;

    border:0;

    border-radius:9px;

    background:#f28c28;

    color:#fff;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;
}

.btn:hover{
    background:#ff9f3e;
}

.btn.secondary{
    background:#292929;
}

.info{
    margin-top:25px;

    color:#999;

    line-height:1.7;

    font-size:14px;
}

.hidden{
    display:none !important;
}

/* =========================================================
   HUD
========================================================= */

#hud{
    position:absolute;

    top:15px;
    left:50%;

    transform:translateX(-50%);

    z-index:5;

    display:flex;

    align-items:center;

    gap:20px;

    pointer-events:none;
}

.score{
    min-width:90px;

    padding:7px 15px;

    text-align:center;

    border-radius:9px;

    background:#111d;

    border:1px solid #ffffff25;

    color:#fff;

    font-size:27px;

    font-weight:bold;
}

#score1{
    color:#4da6ff;
}

#score2{
    color:#ff5555;
}

.timer{
    min-width:75px;

    padding:7px 12px;

    text-align:center;

    border-radius:9px;

    background:#111d;

    border:1px solid #ffffff25;

    color:#fff;

    font-size:22px;

    font-weight:bold;
}

/* =========================================================
   CONTROLES TOUCH
========================================================= */

#touchControls{
    position:absolute;

    left:0;
    right:0;
    bottom:15px;

    z-index:10;

    display:none;

    justify-content:space-between;

    padding:0 15px;

    pointer-events:none;
}

.touchSide{
    display:flex;

    gap:8px;

    pointer-events:auto;
}

.touchButton{
    width:54px;
    height:54px;

    border-radius:50%;

    border:1px solid #ffffff44;

    background:#111b;

    color:#fff;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:20px;

    font-weight:bold;

    -webkit-tap-highlight-color:transparent;
}

.touchButton.orange{
    background:#f28c28cc;
}

.touchButton.blue{
    background:#287fd1cc;
}

@media(max-width:800px){

    #touchControls{
        display:flex;
    }

}

/* =========================================================
   GAME OVER
========================================================= */

.result{
    font-size:48px;

    font-weight:900;

    margin:20px 0;

    color:#fff;
}

#winnerText{
    color:#f28c28;

    font-size:21px;

    font-weight:bold;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>


<!-- =====================================================
     MENU
====================================================== -->

<div id="menu" class="screen">

    <div class="panel">

        <div class="logo">
            🏀 <span>BASQUETE</span>
        </div>

        <div class="subtitle">
            2 JOGADORES
        </div>

        <button id="playBtn" class="btn">
            ▶ JOGAR
        </button>

        <div class="info">

            <b style="color:#4da6ff;">
                JOGADOR 1
            </b>

            <br>

            W A S D → Movimento<br>
            F → Pegar / Arremessar

            <br><br>

            <b style="color:#ff5555;">
                JOGADOR 2
            </b>

            <br>

            ↑ ↓ ← → → Movimento<br>
            L → Pegar / Arremessar

            <br><br>

            🏀 Faça mais pontos antes do tempo acabar!

        </div>

    </div>

</div>


<!-- =====================================================
     GAME OVER
====================================================== -->

<div id="gameOver" class="screen hidden">

    <div class="panel">

        <div class="logo">
            🏀 FIM DE JOGO
        </div>

        <div class="result">
            <span id="finalScore1">0</span>
            -
            <span id="finalScore2">0</span>
        </div>

        <div id="winnerText">
            EMPATE!
        </div>

        <button id="restartBtn" class="btn">
            🔄 JOGAR NOVAMENTE
        </button>

        <button id="menuBtn" class="btn secondary">
            🏠 MENU
        </button>

    </div>

</div>


<!-- =====================================================
     HUD
====================================================== -->

<div id="hud" class="hidden">

    <div id="score1" class="score">
        0
    </div>

    <div id="timer" class="timer">
        2:00
    </div>

    <div id="score2" class="score">
        0
    </div>

</div>


<!-- =====================================================
     TOUCH
====================================================== -->

<div id="touchControls">

    <div class="touchSide">

        <button
            class="touchButton blue"
            data-key="KeyW">
            ▲
        </button>

        <button
            class="touchButton blue"
            data-key="KeyA">
            ◀
        </button>

        <button
            class="touchButton blue"
            data-key="KeyS">
            ▼
        </button>

        <button
            class="touchButton blue"
            data-key="KeyD">
            ▶
        </button>

        <button
            class="touchButton blue"
            data-key="KeyF">
            🏀
        </button>

    </div>


    <div class="touchSide">

        <button
            class="touchButton orange"
            data-key="ArrowUp">
            ▲
        </button>

        <button
            class="touchButton orange"
            data-key="ArrowLeft">
            ◀
        </button>

        <button
            class="touchButton orange"
            data-key="ArrowDown">
            ▼
        </button>

        <button
            class="touchButton orange"
            data-key="ArrowRight">
            ▶
        </button>

        <button
            class="touchButton orange"
            data-key="KeyL">
            🏀
        </button>

    </div>

</div>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;

let DPR = 1;


/* =========================================================
   ELEMENTOS
========================================================= */

const menu =
    document.getElementById("menu");

const gameOver =
    document.getElementById("gameOver");

const hud =
    document.getElementById("hud");

const playBtn =
    document.getElementById("playBtn");

const restartBtn =
    document.getElementById("restartBtn");

const menuBtn =
    document.getElementById("menuBtn");

const score1El =
    document.getElementById("score1");

const score2El =
    document.getElementById("score2");

const timerEl =
    document.getElementById("timer");

const finalScore1 =
    document.getElementById("finalScore1");

const finalScore2 =
    document.getElementById("finalScore2");

const winnerText =
    document.getElementById("winnerText");


/* =========================================================
   ESTADO
========================================================= */

let running = false;

let animationId = 0;

let lastTime = 0;

let timeLeft = 120;

let score1 = 0;

let score2 = 0;


/* =========================================================
   CONTROLES
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    e => {

        keys[e.code] = true;

        if(
            [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
                "Space"
            ].includes(e.code)
        ){

            e.preventDefault();

        }

    }
);


window.addEventListener(
    "keyup",
    e => {

        keys[e.code] = false;

    }
);


/* =========================================================
   TOUCH
========================================================= */

document
.querySelectorAll(".touchButton")
.forEach(button => {

    const key =
        button.dataset.key;


    button.addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            keys[key] = true;

        }
    );


    button.addEventListener(
        "pointerup",
        e => {

            e.preventDefault();

            keys[key] = false;

        }
    );


    button.addEventListener(
        "pointercancel",
        () => {

            keys[key] = false;

        }
    );


    button.addEventListener(
        "pointerleave",
        () => {

            keys[key] = false;

        }
    );

});


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

    createCourt();

    if(
        player1 &&
        player2
    ){

        keepPlayersInside();

    }

}

window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   QUADRA
========================================================= */

let court = null;

function createCourt(){

    court = {

        left: W * .06,

        right: W * .94,

        top: H * .12,

        bottom: H * .88,

        centerX: W / 2,

        centerY: H / 2

    };

}


/* =========================================================
   JOGADORES
========================================================= */

let player1 = null;

let player2 = null;


function createPlayers(){

    player1 = {

        x:
            W * .25,

        y:
            H / 2,

        radius:
            25,

        speed:
            4.5,

        color:
            "#4da6ff",

        vx:0,

        vy:0,

        hasBall:false,

        shootCooldown:0,

        stealCooldown:0

    };


    player2 = {

        x:
            W * .75,

        y:
            H / 2,

        radius:
            25,

        speed:
            4.5,

        color:
            "#ff5555",

        vx:0,

        vy:0,

        hasBall:false,

        shootCooldown:0,

        stealCooldown:0

    };

}


/* =========================================================
   BOLA
========================================================= */

let ball = null;


function createBall(){

    ball = {

        x:
            W / 2,

        y:
            H / 2,

        radius:
            10,

        vx:0,

        vy:0,

        z:0,

        vz:0,

        owner:null,

        shot:false,

        pickupCooldown:0

    };

}


/* =========================================================
   INICIAR JOGO
========================================================= */

function startGame(){

    menu.classList.add(
        "hidden"
    );

    gameOver.classList.add(
        "hidden"
    );

    hud.classList.remove(
        "hidden"
    );

    score1 = 0;

    score2 = 0;

    timeLeft = 120;

    createCourt();

    createPlayers();

    createBall();

    /*
       Jogador 1 começa com a bola.
    */

    player1.hasBall = true;

    ball.owner = 1;

    running = true;

    lastTime =
        performance.now();

    updateHUD();

    cancelAnimationFrame(
        animationId
    );

    animationId =
        requestAnimationFrame(
            loop
        );

}


/* =========================================================
   DISTÂNCIA
========================================================= */

function distanceBetween(
    a,
    b
){

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    return Math.sqrt(
        dx*dx +
        dy*dy
    );

}


/* =========================================================
   MOVIMENTO JOGADOR 1
========================================================= */

function movePlayer1(dt){

    let dx = 0;
    let dy = 0;

    if(keys["KeyA"])
        dx--;

    if(keys["KeyD"])
        dx++;

    if(keys["KeyW"])
        dy--;

    if(keys["KeyS"])
        dy++;


    if(dx || dy){

        const length =
            Math.sqrt(
                dx*dx +
                dy*dy
            );

        dx /= length;
        dy /= length;

        player1.x +=
            dx *
            player1.speed *
            dt;

        player1.y +=
            dy *
            player1.speed *
            dt;

    }

}


/* =========================================================
   MOVIMENTO JOGADOR 2
========================================================= */

function movePlayer2(dt){

    let dx = 0;
    let dy = 0;

    if(keys["ArrowLeft"])
        dx--;

    if(keys["ArrowRight"])
        dx++;

    if(keys["ArrowUp"])
        dy--;

    if(keys["ArrowDown"])
        dy++;


    if(dx || dy){

        const length =
            Math.sqrt(
                dx*dx +
                dy*dy
            );

        dx /= length;
        dy /= length;

        player2.x +=
            dx *
            player2.speed *
            dt;

        player2.y +=
            dy *
            player2.speed *
            dt;

    }

}


/* =========================================================
   LIMITAR JOGADORES
========================================================= */

function keepPlayersInside(){

    if(!court)
        return;


    for(
        const p of [
            player1,
            player2
        ]
    ){

        if(!p)
            continue;


        p.x =
            Math.max(
                court.left + p.radius,
                Math.min(
                    court.right - p.radius,
                    p.x
                )
            );


        p.y =
            Math.max(
                court.top + p.radius,
                Math.min(
                    court.bottom - p.radius,
                    p.y
                )
            );

    }

}


/* =========================================================
   PEGAR BOLA
========================================================= */

function tryPickupBall(
    player,
    id
){

    if(ball.owner)
        return;

    if(ball.pickupCooldown > 0)
        return;

    if(ball.z > 20)
        return;


    const distance =
        distanceBetween(
            player,
            ball
        );


    if(
        distance <
        player.radius +
        ball.radius +
        18
    ){

        ball.owner =
            id;

        player.hasBall =
            true;

        ball.vx = 0;
        ball.vy = 0;

    }

}


/* =========================================================
   ARREMESSO
========================================================= */

function shootBall(
    player,
    id
){

    if(!player.hasBall)
        return;

    if(
        player.shootCooldown >
        0
    )
        return;


    player.hasBall =
        false;

    ball.owner =
        null;

    ball.shot =
        true;

    ball.pickupCooldown =
        .45;

    ball.x =
        player.x;

    ball.y =
        player.y;

    /*
       Direção do arremesso:
       para a cesta adversária.
    */

    const targetX =
        id === 1
        ? court.right + 15
        : court.left - 15;


    const targetY =
        court.centerY;


    const dx =
        targetX - player.x;

    const dy =
        targetY - player.y;

    const length =
        Math.sqrt(
            dx*dx +
            dy*dy
        );


    const speed = 11;


    ball.vx =
        dx / length *
        speed;

    ball.vy =
        dy / length *
        speed;

    ball.z =
        10;

    ball.vz =
        8;

    player.shootCooldown =
        .45;

}


/* =========================================================
   ROUBAR BOLA
========================================================= */

function trySteal(
    player,
    id
){

    if(
        player.stealCooldown >
        0
    )
        return;


    const opponent =
        id === 1
        ? player2
        : player1;


    if(!opponent.hasBall)
        return;


    const distance =
        distanceBetween(
            player,
            opponent
        );


    if(
        distance <
        player.radius +
        opponent.radius +
        12
    ){

        opponent.hasBall =
            false;

        player.hasBall =
            true;

        ball.owner =
            id;

        player.stealCooldown =
            .8;

    }

}


/* =========================================================
   AÇÕES
========================================================= */

function handleActions(){

    if(
        keys["KeyF"]
    ){

        if(
            !player1.hasBall
        ){

            tryPickupBall(
                player1,
                1
            );

        }else{

            shootBall(
                player1,
                1
            );

        }

        keys["KeyF"] = false;

    }


    if(
        keys["KeyL"]
    ){

        if(
            !player2.hasBall
        ){

            tryPickupBall(
                player2,
                2
            );

        }else{

            shootBall(
                player2,
                2
            );

        }

        keys["KeyL"] = false;

    }


    /*
       Roubo automático ao encostar.
    */

    trySteal(
        player1,
        1
    );

    trySteal(
        player2,
        2
    );

}


/* =========================================================
   ATUALIZAR BOLA
========================================================= */

function updateBall(dt){

    if(ball.pickupCooldown > 0){

        ball.pickupCooldown -=
            dt / 60;

    }


    if(ball.owner === 1){

        ball.x =
            player1.x;

        ball.y =
            player1.y + 5;

        ball.z =
            12;

        return;

    }


    if(ball.owner === 2){

        ball.x =
            player2.x;

        ball.y =
            player2.y + 5;

        ball.z =
            12;

        return;

    }


    if(!ball.shot)
        return;


    /*
       Física da bola.
    */

    ball.x +=
        ball.vx *
        dt;

    ball.y +=
        ball.vy *
        dt;

    ball.z +=
        ball.vz *
        dt;

    ball.vz -=
        .35 *
        dt;


    /*
       Bola bate no chão.
    */

    if(
        ball.z <= 0
    ){

        ball.z = 0;

        if(
            Math.abs(
                ball.vz
            ) > 2
        ){

            ball.vz *=
                -.55;

        }else{

            ball.vz = 0;

            ball.shot = false;

        }

        ball.vx *= .92;
        ball.vy *= .92;

    }


    /*
       Limites laterais.
    */

    if(
        ball.x <
        court.left
    ){

        ball.x =
            court.left;

        ball.vx *=
            -.65;

    }


    if(
        ball.x >
        court.right
    ){

        ball.x =
            court.right;

        ball.vx *=
            -.65;

    }


    /*
       Limites verticais.
    */

    if(
        ball.y <
        court.top
    ){

        ball.y =
            court.top;

        ball.vy *=
            -.65;

    }


    if(
        ball.y >
        court.bottom
    ){

        ball.y =
            court.bottom;

        ball.vy *=
            -.65;

    }


    checkBasket();

}


/* =========================================================
   CESTAS
========================================================= */

function checkBasket(){

    /*
       Cesta esquerda:
       Jogador 2 marca.
    */

    const leftHoopX =
        court.left + 20;


    const rightHoopX =
        court.right - 20;


    const hoopY =
        court.centerY;


    const hoopRadius =
        38;


    if(
        distanceBetween(
            ball,
            {
                x:leftHoopX,
                y:hoopY
            }
        ) <
        hoopRadius
        &&
        ball.z <
        45
    ){

        if(
            ball.vx < 0
        ){

            score2++;

            basketEffect(
                leftHoopX,
                hoopY
            );

            resetAfterBasket(
                2
            );

        }

    }


    /*
       Cesta direita:
       Jogador 1 marca.
    */

    if(
        distanceBetween(
            ball,
            {
                x:rightHoopX,
                y:hoopY
            }
        ) <
        hoopRadius
        &&
        ball.z <
        45
    ){

        if(
            ball.vx > 0
        ){

            score1++;

            basketEffect(
                rightHoopX,
                hoopY
            );

            resetAfterBasket(
                1
            );

        }

    }

}


/* =========================================================
   EFEITO CESTA
========================================================= */

let basketEffects = [];


function basketEffect(
    x,
    y
){

    basketEffects.push({

        x:x,

        y:y,

        life:1

    });

}


/* =========================================================
   RESET DEPOIS DA CESTA
========================================================= */

function resetAfterBasket(
    scoringPlayer
){

    ball.owner = null;

    ball.shot = false;

    ball.vx = 0;

    ball.vy = 0;

    ball.z = 0;

    ball.vz = 0;


    player1.hasBall = false;

    player2.hasBall = false;


    /*
       Quem sofreu a cesta começa
       com a bola.
    */

    if(
        scoringPlayer === 1
    ){

        ball.owner = 2;

        player2.hasBall = true;

    }else{

        ball.owner = 1;

        player1.hasBall = true;

    }


    player1.x =
        W * .25;

    player1.y =
        H / 2;


    player2.x =
        W * .75;

    player2.y =
        H / 2;

}


/* =========================================================
   ATUALIZAR EFEITOS
========================================================= */

function updateEffects(dt){

    for(
        let i=basketEffects.length-1;
        i>=0;
        i--
    ){

        basketEffects[i].life -=
            .035 * dt;

        if(
            basketEffects[i].life <= 0
        ){

            basketEffects.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    movePlayer1(dt);

    movePlayer2(dt);

    keepPlayersInside();

    handleActions();

    updateBall(dt);

    updateEffects(dt);


    player1.shootCooldown =
        Math.max(
            0,
            player1.shootCooldown -
            dt/60
        );


    player2.shootCooldown =
        Math.max(
            0,
            player2.shootCooldown -
            dt/60
        );


    player1.stealCooldown =
        Math.max(
            0,
            player1.stealCooldown -
            dt/60
        );


    player2.stealCooldown =
        Math.max(
            0,
            player2.stealCooldown -
            dt/60
        );


    /*
       Cronômetro.
    */

    timeLeft -=
        dt / 60;


    if(
        timeLeft <= 0
    ){

        timeLeft = 0;

        endGame();

    }


    updateHUD();

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    score1El.textContent =
        score1;

    score2El.textContent =
        score2;


    const seconds =
        Math.ceil(
            timeLeft
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        seconds % 60;


    timerEl.textContent =
        minutes +
        ":" +
        String(secs)
        .padStart(2,"0");

}


/* =========================================================
   DESENHAR QUADRA
========================================================= */

function drawCourt(){

    /*
       Piso
    */

    ctx.fillStyle =
        "#b87333";

    ctx.fillRect(
        court.left,
        court.top,
        court.right-court.left,
        court.bottom-court.top
    );


    /*
       Madeira em faixas
    */

    ctx.strokeStyle =
        "#8f5729";

    ctx.lineWidth =
        2;


    for(
        let x=court.left;
        x<court.right;
        x+=45
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            court.top
        );

        ctx.lineTo(
            x,
            court.bottom
        );

        ctx.stroke();

    }


    /*
       Linhas externas
    */

    ctx.strokeStyle =
        "#fff";

    ctx.lineWidth =
        5;

    ctx.strokeRect(
        court.left,
        court.top,
        court.right-court.left,
        court.bottom-court.top
    );


    /*
       Linha central
    */

    ctx.beginPath();

    ctx.moveTo(
        court.centerX,
        court.top
    );

    ctx.lineTo(
        court.centerX,
        court.bottom
    );

    ctx.stroke();


    /*
       Círculo central
    */

    ctx.beginPath();

    ctx.arc(
        court.centerX,
        court.centerY,
        65,
        0,
        Math.PI*2
    );

    ctx.stroke();


    /*
       Áreas de cesta.
    */

    const keyWidth =
        130;

    const keyHeight =
        240;


    ctx.strokeRect(
        court.left,
        court.centerY-keyHeight/2,
        keyWidth,
        keyHeight
    );


    ctx.strokeRect(
        court.right-keyWidth,
        court.centerY-keyHeight/2,
        keyWidth,
        keyHeight
    );


    /*
       Arcos de 3 pontos.
    */

    ctx.beginPath();

    ctx.arc(
        court.left+20,
        court.centerY,
        190,
        -Math.PI/2,
        Math.PI/2
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.arc(
        court.right-20,
        court.centerY,
        190,
        Math.PI/2,
        -Math.PI/2
    );

    ctx.stroke();

}


/* =========================================================
   DESENHAR CESTAS
========================================================= */

function drawHoops(){

    const leftX =
        court.left + 20;

    const rightX =
        court.right - 20;

    const y =
        court.centerY;


    /*
       Tabelas
    */

    ctx.fillStyle =
        "#eee";

    ctx.fillRect(
        leftX-5,
        y-70,
        8,
        140
    );

    ctx.fillRect(
        rightX-3,
        y-70,
        8,
        140
    );


    /*
       Aros
    */

    ctx.strokeStyle =
        "#ff6a00";

    ctx.lineWidth =
        7;


    ctx.beginPath();

    ctx.arc(
        leftX,
        y,
        27,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.arc(
        rightX,
        y,
        27,
        0,
        Math.PI*2
    );

    ctx.stroke();


    /*
       Redes
    */

    ctx.strokeStyle =
        "#ffffffaa";

    ctx.lineWidth =
        1;


    for(
        let i=-3;
        i<=3;
        i++
    ){

        ctx.beginPath();

        ctx.moveTo(
            leftX+i*7,
            y+5
        );

        ctx.lineTo(
            leftX+i*5,
            y+45
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            rightX+i*7,
            y+5
        );

        ctx.lineTo(
            rightX+i*5,
            y+45
        );

        ctx.stroke();

    }

}


/* =========================================================
   DESENHAR JOGADOR
========================================================= */

function drawPlayer(
    p,
    number
){

    ctx.save();

    /*
       Sombra
    */

    ctx.fillStyle =
        "#0005";

    ctx.beginPath();

    ctx.ellipse(
        p.x,
        p.y+27,
        24,
        9,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Corpo
    */

    ctx.fillStyle =
        p.color;

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        p.radius,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Camisa
    */

    ctx.fillStyle =
        "#fff";

    ctx.font =
        "bold 17px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        number,
        p.x,
        p.y
    );


    /*
       Cabeça
    */

    ctx.fillStyle =
        "#f1c7a5";

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y-28,
        13,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Cabelo
    */

    ctx.fillStyle =
        "#222";

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y-32,
        12,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /*
       Bola na mão
    */

    if(
        p.hasBall
    ){

        const side =
            number === 1
            ? 1
            : -1;


        drawBall(
            p.x +
            side*28,
            p.y+8,
            0
        );

    }


    ctx.restore();

}


/* =========================================================
   DESENHAR BOLA
========================================================= */

function drawBall(
    x,
    y,
    z
){

    const scale =
        Math.max(
            .65,
            1 - z*.005
        );


    ctx.save();

    ctx.translate(
        x,
        y-z
    );

    ctx.scale(
        scale,
        scale
    );


    /*
       Sombra
    */

    ctx.globalAlpha =
        .25;

    ctx.fillStyle =
        "#000";

    ctx.beginPath();

    ctx.ellipse(
        0,
        z+8,
        11,
        5,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.globalAlpha =
        1;


    /*
       Bola
    */

    ctx.fillStyle =
        "#e87519";

    ctx.strokeStyle =
        "#572400";

    ctx.lineWidth =
        2;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        10,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.stroke();


    /*
       Linhas da bola
    */

    ctx.strokeStyle =
        "#522000";

    ctx.lineWidth =
        1.4;


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        6,
        -Math.PI/2,
        Math.PI/2
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        6,
        Math.PI/2,
        -Math.PI/2
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        -9,
        0
    );

    ctx.quadraticCurveTo(
        0,
        -4,
        9,
        0
    );

    ctx.stroke();


    ctx.restore();

}


/* =========================================================
   EFEITOS DE CESTA
========================================================= */

function drawEffects(){

    for(
        const e of basketEffects
    ){

        ctx.save();

        ctx.globalAlpha =
            e.life;

        ctx.strokeStyle =
            "#fff";

        ctx.lineWidth =
            4;

        ctx.beginPath();

        ctx.arc(
            e.x,
            e.y,
            30 +
            (1-e.life)*80,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.restore();

    }

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    /*
       Fundo
    */

    ctx.fillStyle =
        "#101010";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    drawCourt();

    drawHoops();

    drawEffects();

    drawPlayer(
        player1,
        1
    );

    drawPlayer(
        player2,
        2
    );


    if(
        ball &&
        !ball.owner
    ){

        drawBall(
            ball.x,
            ball.y,
            ball.z
        );

    }

}


/* =========================================================
   LOOP
========================================================= */

function loop(time){

    if(!running)
        return;


    const dt =
        Math.min(
            (time-lastTime)/16.67,
            2
        );


    lastTime =
        time;


    update(dt);

    draw();


    animationId =
        requestAnimationFrame(
            loop
        );

}


/* =========================================================
   FIM DE JOGO
========================================================= */

function endGame(){

    if(!running)
        return;


    running = false;

    cancelAnimationFrame(
        animationId
    );


    finalScore1.textContent =
        score1;

    finalScore2.textContent =
        score2;


    if(
        score1 > score2
    ){

        winnerText.textContent =
            "🔵 JOGADOR 1 VENCEU!";

        winnerText.style.color =
            "#4da6ff";

    }
    else if(
        score2 > score1
    ){

        winnerText.textContent =
            "🔴 JOGADOR 2 VENCEU!";

        winnerText.style.color =
            "#ff5555";

    }
    else{

        winnerText.textContent =
            "🏀 EMPATE!";

        winnerText.style.color =
            "#f28c28";

    }


    hud.classList.add(
        "hidden"
    );

    gameOver.classList.remove(
        "hidden"
    );

}


/* =========================================================
   BOTÕES
========================================================= */

playBtn.addEventListener(
    "click",
    startGame
);


restartBtn.addEventListener(
    "click",
    startGame
);


menuBtn.addEventListener(
    "click",
    () => {

        running = false;

        cancelAnimationFrame(
            animationId
        );

        gameOver.classList.add(
            "hidden"
        );

        hud.classList.add(
            "hidden"
        );

        menu.classList.remove(
            "hidden"
        );

        createCourt();

        createPlayers();

        createBall();

        draw();

    }
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

resize();

createPlayers();

createBall();

draw();

</script>
