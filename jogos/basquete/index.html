<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const menu = document.getElementById("menu");
const gameOver = document.getElementById("gameOver");

const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");

const winnerText = document.getElementById("winnerText");
const resultText = document.getElementById("resultText");
const finalScore = document.getElementById("finalScore");


// ======================================================
// MUNDO
// ======================================================

const WORLD_WIDTH = 1600;
const WORLD_HEIGHT = 900;

const groundY = 765;

let scale = 1;
let offsetX = 0;
let offsetY = 0;

function resize(){

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    scale = Math.min(
        canvas.width / WORLD_WIDTH,
        canvas.height / WORLD_HEIGHT
    );

    offsetX =
        (canvas.width - WORLD_WIDTH * scale) / 2;

    offsetY =
        (canvas.height - WORLD_HEIGHT * scale) / 2;
}

window.addEventListener("resize", resize);

resize();


// ======================================================
// CONTROLES
// ======================================================

const keys = {};
const justPressed = {};

window.addEventListener("keydown", e => {

    const key = e.key.toLowerCase();

    if(!keys[key]){
        justPressed[key] = true;
    }

    keys[key] = true;

    if([
        "arrowleft",
        "arrowright",
        "arrowup",
        "arrowdown",
        " "
    ].includes(key)){
        e.preventDefault();
    }
});

window.addEventListener("keyup", e => {

    keys[e.key.toLowerCase()] = false;
});

function consumeKey(key){

    if(justPressed[key]){

        delete justPressed[key];

        return true;
    }

    return false;
}


// ======================================================
// ESTADO
// ======================================================

let playing = false;

let matchTime = 120;

let score1 = 0;
let score2 = 0;

let lastTime = 0;

let resetTimer = 0;


// ======================================================
// JOGADORES
// ======================================================

const player1 = {

    x:400,
    y:groundY-105,

    vx:0,
    vy:0,

    width:62,
    height:105,

    color:"#287cff",
    dark:"#104aaf",

    facing:1,

    onGround:true,

    shootCooldown:0
};

const player2 = {

    x:1138,
    y:groundY-105,

    vx:0,
    vy:0,

    width:62,
    height:105,

    color:"#e63c3c",
    dark:"#9d1717",

    facing:-1,

    onGround:true,

    shootCooldown:0
};


// ======================================================
// BOLA
// ======================================================

const ball = {

    x:400,
    y:groundY-105,

    z:0,

    vx:0,
    vy:0,
    vz:0,

    radius:19,

    heldBy:player1,

    scored:false
};


// ======================================================
// CESTAS
// ======================================================

const basket1 = {

    x:125,
    rimY:405,
    rimWidth:86
};

const basket2 = {

    x:1475,
    rimY:405,
    rimWidth:86
};


// ======================================================
// RESET
// ======================================================

function resetGame(){

    score1 = 0;
    score2 = 0;

    matchTime = 120;

    resetTimer = 0;

    player1.x = 400;
    player1.y = groundY-105;

    player1.vx = 0;
    player1.vy = 0;

    player1.facing = 1;
    player1.onGround = true;
    player1.shootCooldown = 0;

    player2.x = 1138;
    player2.y = groundY-105;

    player2.vx = 0;
    player2.vy = 0;

    player2.facing = -1;
    player2.onGround = true;
    player2.shootCooldown = 0;

    ball.x = player1.x + player1.width + 10;
    ball.y = player1.y + 45;

    ball.z = 45;

    ball.vx = 0;
    ball.vy = 0;
    ball.vz = 0;

    ball.heldBy = player1;
    ball.scored = false;
}


// ======================================================
// INICIAR
// ======================================================

function startGame(){

    resetGame();

    menu.style.display = "none";
    gameOver.style.display = "none";

    playing = true;

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);
}


// ======================================================
// MOVIMENTO
// ======================================================

function updatePlayer(player,dt,controls){

    const speed = 340;
    const jumpPower = 760;

    if(keys[controls.left]){

        player.vx = -speed;
        player.facing = -1;
    }

    else if(keys[controls.right]){

        player.vx = speed;
        player.facing = 1;
    }

    else{

        player.vx *= Math.pow(.0008,dt);
    }

    if(
        keys[controls.jump] &&
        player.onGround
    ){

        player.vy = -jumpPower;
        player.onGround = false;
    }

    player.vy += 1850 * dt;

    player.x += player.vx * dt;
    player.y += player.vy * dt;

    if(player.y + player.height >= groundY){

        player.y = groundY-player.height;

        player.vy = 0;

        player.onGround = true;
    }

    player.x =
        Math.max(
            30,
            Math.min(
                WORLD_WIDTH-30-player.width,
                player.x
            )
        );

    if(player.shootCooldown > 0){

        player.shootCooldown -= dt;
    }
}


// ======================================================
// MÃO
// ======================================================

function getHandPosition(player){

    const crouching =
        player === player1
        ? keys["s"]
        : keys["arrowdown"];

    return {

        x:
            player.x +
            (
                player.facing === 1
                ? player.width+12
                : -12
            ),

        y:
            player.y +
            (
                crouching
                ? 65
                : 45
            )
    };
}


// ======================================================
// PEGAR BOLA
// ======================================================

function tryPickupBall(){

    if(ball.heldBy)
        return;

    if(ball.z > 100)
        return;

    const players = [
        player1,
        player2
    ];

    let closest = null;
    let closestDistance = Infinity;

    for(const player of players){

        const hand = getHandPosition(player);

        const dx = ball.x-hand.x;
        const dy = ball.y-hand.y;

        const distance =
            Math.sqrt(dx*dx+dy*dy);

        if(
            distance < 125 &&
            distance < closestDistance
        ){

            closest = player;
            closestDistance = distance;
        }
    }

    if(closest){

        ball.heldBy = closest;
    }
}


// ======================================================
// ARREMESSO
// ======================================================

function shootBall(player){

    /*
       O jogador pode arremessar
       de QUALQUER lugar da quadra.

       A única condição é estar
       com a bola.
    */

    if(ball.heldBy !== player){
        return;
    }

    if(player.shootCooldown > 0){
        return;
    }

    player.shootCooldown = 0.65;

    /*
       Cesta adversária.
    */

    const target =
        player === player1
        ? basket2
        : basket1;

    const hand =
        getHandPosition(player);

    /*
       Solta a bola exatamente
       da posição atual da mão.
    */

    ball.heldBy = null;

    ball.x = hand.x;
    ball.y = hand.y;

    ball.z = 45;

    /*
       DISTÂNCIA ATÉ A CESTA
    */

    const dx =
        target.x-ball.x;

    const distance =
        Math.abs(dx);

    const direction =
        Math.sign(dx);

    /*
       ARREMESSO DE QUALQUER LUGAR
       
       Quanto mais longe,
       maior a força horizontal.
    */

    ball.vx =
        direction *
        Math.min(
            1350,
            560 + distance * 0.82
        );

    /*
       Força vertical.
       Mantém uma parábola alta.
    */

    ball.vz =
        930 +
        Math.min(
            420,
            distance * 0.18
        );

    ball.vy = 0;

    ball.scored = false;
}


// ======================================================
// CONTROLE DOS ARREMESSOS
// ======================================================

function handleShooting(){

    if(consumeKey("f")){

        shootBall(player1);
    }

    if(consumeKey("l")){

        shootBall(player2);
    }
}


// ======================================================
// FÍSICA DA BOLA
// ======================================================

function updateBall(dt){

    if(ball.heldBy){

        const hand =
            getHandPosition(ball.heldBy);

        ball.x = hand.x;
        ball.y = hand.y;

        ball.z = 45;

        ball.vx = 0;
        ball.vy = 0;
        ball.vz = 0;

        return;
    }

    ball.x += ball.vx*dt;

    ball.y += ball.vy*dt;

    ball.z += ball.vz*dt;

    ball.vz -= 1900*dt;

    ball.vx *= Math.pow(.997,dt*60);

    if(ball.z <= 0){

        ball.z = 0;

        if(Math.abs(ball.vz)>100){

            ball.vz *= -.55;
        }

        else{

            ball.vz = 0;
        }

        ball.vx *= .78;
    }

    if(ball.x < 20){

        ball.x = 20;
        ball.vx *= -.65;
    }

    if(ball.x > WORLD_WIDTH-20){

        ball.x = WORLD_WIDTH-20;
        ball.vx *= -.65;
    }
}


// ======================================================
// ROUBAR BOLA
// ======================================================

function checkSteal(){

    if(!ball.heldBy)
        return;

    const holder = ball.heldBy;

    const opponent =
        holder === player1
        ? player2
        : player1;

    const holderCenter =
        holder.x+holder.width/2;

    const opponentCenter =
        opponent.x+opponent.width/2;

    const distance =
        Math.abs(
            holderCenter-opponentCenter
        );

    if(distance < 55){

        if(Math.random() < .025){

            const hand =
                getHandPosition(holder);

            ball.heldBy = opponent;

            ball.x = hand.x;
            ball.y = hand.y;
            ball.z = 45;
        }
    }
}


// ======================================================
// CESTA
// ======================================================

function checkBasketCollision(){

    if(ball.heldBy)
        return;

    if(ball.scored)
        return;

    const baskets = [

        {
            basket:basket1,
            player:2
        },

        {
            basket:basket2,
            player:1
        }

    ];

    for(const item of baskets){

        const b = item.basket;

        const horizontal =
            Math.abs(ball.x-b.x);

        const ballScreenY =
            ball.y-ball.z;

        const vertical =
            Math.abs(
                ballScreenY-b.rimY
            );

        if(
            horizontal < b.rimWidth/2 &&
            vertical < 18 &&
            ball.vz < 0
        ){

            ball.scored = true;

            if(item.player === 1){

                score1++;
            }
            else{

                score2++;
            }

            /*
               Primeiro a 5 cestas.
            */

            if(
                score1 >= 5 ||
                score2 >= 5
            ){

                setTimeout(()=>{

                    if(playing){

                        finishGame();
                    }

                },450);

                return;
            }

            resetTimer = 1.1;

            return;
        }
    }
}


// ======================================================
// RESET DEPOIS DA CESTA
// ======================================================

function updateReset(dt){

    if(resetTimer <= 0)
        return;

    resetTimer -= dt;

    if(resetTimer <= 0){

        ball.x = WORLD_WIDTH/2;
        ball.y = groundY-100;

        ball.z = 0;

        ball.vx = 0;
        ball.vy = 0;
        ball.vz = 0;

        ball.heldBy = null;

        ball.scored = false;
    }
}


// ======================================================
// TEMPO
// ======================================================

function updateTimer(dt){

    matchTime -= dt;

    if(matchTime <= 0){

        matchTime = 0;

        finishGame();
    }
}


// ======================================================
// FIM DA PARTIDA
// ======================================================

function finishGame(){

    if(!playing)
        return;

    playing = false;

    if(score1 > score2){

        winnerText.textContent =
            "🔵 JOGADOR 1 VENCEU!";

        resultText.textContent =
            "O Jogador 1 fez mais cestas.";
    }

    else if(score2 > score1){

        winnerText.textContent =
            "🔴 JOGADOR 2 VENCEU!";

        resultText.textContent =
            "O Jogador 2 fez mais cestas.";
    }

    else{

        winnerText.textContent =
            "🤝 EMPATE!";

        resultText.textContent =
            "Os dois jogadores terminaram empatados.";
    }

    finalScore.textContent =
        `JOGADOR 1  ${score1}  ×  ${score2}  JOGADOR 2`;

    gameOver.style.display = "flex";
}


// ======================================================
// QUADRA
// ======================================================

function drawCourt(){

    const bg =
        ctx.createLinearGradient(
            0,
            0,
            0,
            groundY
        );

    bg.addColorStop(0,"#090c11");
    bg.addColorStop(.55,"#161b21");
    bg.addColorStop(1,"#222a31");

    ctx.fillStyle = bg;

    ctx.fillRect(
        0,
        0,
        WORLD_WIDTH,
        WORLD_HEIGHT
    );


    /*
       ILUMINAÇÃO
    */

    for(let i=0;i<7;i++){

        const x = 80+i*245;

        const light =
            ctx.createRadialGradient(
                x,
                70,
                5,
                x,
                70,
                190
            );

        light.addColorStop(
            0,
            "rgba(255,255,255,.10)"
        );

        light.addColorStop(
            1,
            "rgba(255,255,255,0)"
        );

        ctx.fillStyle = light;

        ctx.fillRect(
            x-190,
            0,
            380,
            300
        );
    }


    /*
       ARQUIBANCADAS
    */

    ctx.fillStyle = "#101419";

    ctx.fillRect(
        0,
        190,
        WORLD_WIDTH,
        360
    );

    for(let row=0;row<6;row++){

        ctx.fillStyle =
            row%2===0
            ? "#1c2228"
            : "#151a1f";

        ctx.fillRect(
            0,
            210+row*55,
            WORLD_WIDTH,
            45
        );
    }


    /*
       PÚBLICO
    */

    for(let row=0;row<5;row++){

        for(let i=0;i<55;i++){

            const x =
                15+i*30+(row%2)*10;

            const y =
                225+row*55;

            ctx.fillStyle =
                i%3===0
                ? "#8a9097"
                : "#555b62";

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                8,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    }


    /*
       PAINEL
    */

    ctx.fillStyle = "#080a0d";

    ctx.fillRect(
        0,
        520,
        WORLD_WIDTH,
        45
    );

    ctx.font = "bold 18px Arial";

    ctx.textAlign = "center";

    ctx.fillStyle = "#59616a";

    ctx.fillText(
        "GAMEHUB  •  BASKETBALL ARENA",
        WORLD_WIDTH/2,
        548
    );


    /*
       PISO
    */

    const floor =
        ctx.createLinearGradient(
            0,
            groundY,
            0,
            WORLD_HEIGHT
        );

    floor.addColorStop(0,"#6b4b32");
    floor.addColorStop(.45,"#805a3b");
    floor.addColorStop(1,"#4c3525");

    ctx.fillStyle = floor;

    ctx.fillRect(
        0,
        groundY,
        WORLD_WIDTH,
        WORLD_HEIGHT-groundY
    );


    /*
       MADEIRA
    */

    ctx.strokeStyle =
        "rgba(255,255,255,.07)";

    ctx.lineWidth = 2;

    for(let x=0;x<WORLD_WIDTH;x+=80){

        ctx.beginPath();

        ctx.moveTo(x,groundY);
        ctx.lineTo(x,WORLD_HEIGHT);

        ctx.stroke();
    }


    /*
       LINHA CENTRAL
    */

    ctx.strokeStyle =
        "rgba(255,255,255,.65)";

    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.moveTo(
        WORLD_WIDTH/2,
        groundY
    );

    ctx.lineTo(
        WORLD_WIDTH/2,
        WORLD_HEIGHT
    );

    ctx.stroke();


    /*
       CÍRCULO CENTRAL
    */

    ctx.beginPath();

    ctx.arc(
        WORLD_WIDTH/2,
        groundY,
        115,
        Math.PI,
        0
    );

    ctx.stroke();


    /*
       ÁREAS
    */

    ctx.strokeStyle =
        "rgba(255,255,255,.55)";

    ctx.lineWidth = 5;

    ctx.strokeRect(
        0,
        groundY-260,
        250,
        260
    );

    ctx.strokeRect(
        WORLD_WIDTH-250,
        groundY-260,
        250,
        260
    );


    drawBasket(basket1,true);
    drawBasket(basket2,false);
}


// ======================================================
// CESTA
// ======================================================

function drawBasket(basket,left){

    const poleX =
        left
        ? basket.x-42
        : basket.x+42;


    /*
       SOMBRA
    */

    ctx.strokeStyle =
        "rgba(0,0,0,.35)";

    ctx.lineWidth = 25;

    ctx.beginPath();

    ctx.moveTo(
        poleX+8,
        groundY
    );

    ctx.lineTo(
        poleX+8,
        basket.rimY-55
    );

    ctx.stroke();


    /*
       POSTE
    */

    const pole =
        ctx.createLinearGradient(
            poleX-10,
            0,
            poleX+10,
            0
        );

    pole.addColorStop(0,"#353b42");
    pole.addColorStop(.5,"#b8bdc2");
    pole.addColorStop(1,"#30353a");

    ctx.strokeStyle = pole;

    ctx.lineWidth = 20;

    ctx.beginPath();

    ctx.moveTo(
        poleX,
        groundY
    );

    ctx.lineTo(
        poleX,
        basket.rimY-50
    );

    ctx.stroke();


    /*
       SUPORTE
    */

    ctx.strokeStyle = "#9da3a8";

    ctx.lineWidth = 10;

    ctx.beginPath();

    ctx.moveTo(
        poleX,
        basket.rimY-50
    );

    ctx.lineTo(
        basket.x,
        basket.rimY-50
    );

    ctx.stroke();


    /*
       TABELA
    */

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.fillRect(
        basket.x-74,
        basket.rimY-130,
        18,
        120
    );

    ctx.fillStyle = "#e7e9eb";

    ctx.fillRect(
        basket.x-66,
        basket.rimY-125,
        14,
        110
    );


    /*
       QUADRADO
    */

    ctx.strokeStyle = "#333";

    ctx.lineWidth = 4;

    ctx.strokeRect(
        basket.x-75,
        basket.rimY-85,
        32,
        45
    );


    /*
       ARO
    */

    ctx.strokeStyle = "#f05a28";

    ctx.lineWidth = 9;

    ctx.beginPath();

    ctx.ellipse(
        basket.x,
        basket.rimY,
        45,
        12,
        0,
        0,
        Math.PI*2
    );

    ctx.stroke();


    /*
       REDE
    */

    ctx.strokeStyle =
        "rgba(245,245,245,.8)";

    ctx.lineWidth = 2;

    for(let i=0;i<8;i++){

        const startX =
            basket.x-38+i*11;

        const endX =
            basket.x-26+i*7;

        ctx.beginPath();

        ctx.moveTo(
            startX,
            basket.rimY+7
        );

        ctx.lineTo(
            endX,
            basket.rimY+68
        );

        ctx.stroke();
    }

    for(let i=0;i<5;i++){

        const y =
            basket.rimY+15+i*12;

        ctx.beginPath();

        ctx.moveTo(
            basket.x-30,
            y
        );

        ctx.lineTo(
            basket.x+30,
            y
        );

        ctx.stroke();
    }
}


// ======================================================
// JOGADOR
// ======================================================

function drawPlayer(player){

    const x = player.x;
    const y = player.y;


    /*
       SOMBRA
    */

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        x+player.width/2,
        groundY+5,
        40,
        9,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       PERNAS
    */

    ctx.strokeStyle =
        player.dark;

    ctx.lineWidth = 14;

    ctx.lineCap = "round";

    ctx.beginPath();

    ctx.moveTo(
        x+22,
        y+75
    );

    ctx.lineTo(
        x+13,
        y+100
    );

    ctx.moveTo(
        x+40,
        y+75
    );

    ctx.lineTo(
        x+48,
        y+100
    );

    ctx.stroke();


    /*
       TÊNIS
    */

    ctx.fillStyle = "#111";

    ctx.fillRect(
        x+3,
        y+96,
        27,
        9
    );

    ctx.fillRect(
        x+36,
        y+96,
        27,
        9
    );


    /*
       CORPO
    */

    const shirt =
        ctx.createLinearGradient(
            x,
            y,
            x+player.width,
            y
        );

    shirt.addColorStop(
        0,
        player.dark
    );

    shirt.addColorStop(
        .5,
        player.color
    );

    shirt.addColorStop(
        1,
        player.dark
    );

    ctx.fillStyle = shirt;

    ctx.beginPath();

    ctx.roundRect(
        x+8,
        y+30,
        46,
        50,
        9
    );

    ctx.fill();


    /*
       CAMISA
    */

    ctx.fillStyle =
        "rgba(255,255,255,.18)";

    ctx.fillRect(
        x+25,
        y+35,
        12,
        40
    );


    /*
       CABEÇA
    */

    ctx.fillStyle = "#b87952";

    ctx.beginPath();

    ctx.arc(
        x+31,
        y+16,
        22,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       CABELO
    */

    ctx.fillStyle = "#181818";

    ctx.beginPath();

    ctx.arc(
        x+31,
        y+7,
        21,
        Math.PI,
        0
    );

    ctx.fill();


    /*
       OLHO
    */

    const faceX =
        player.facing===1
        ? x+47
        : x+15;

    ctx.fillStyle = "#1b1b1b";

    ctx.beginPath();

    ctx.arc(
        faceX,
        y+16,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       BRAÇO
    */

    const hand =
        getHandPosition(player);

    ctx.strokeStyle =
        "#b87952";

    ctx.lineWidth = 11;

    ctx.lineCap = "round";

    ctx.beginPath();

    ctx.moveTo(
        x+32,
        y+42
    );

    ctx.lineTo(
        hand.x,
        hand.y
    );

    ctx.stroke();


    /*
       NÚMERO
    */

    ctx.textAlign = "center";

    ctx.font = "bold 20px Arial";

    ctx.fillStyle = "#fff";

    ctx.fillText(
        player===player1 ? "1" : "2",
        x+31,
        y+66
    );


    /*
       INDICADOR DE POSSE
    */

    if(ball.heldBy===player){

        ctx.strokeStyle =
            "rgba(255,255,255,.65)";

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.arc(
            x+31,
            y+16,
            31,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }
}


// ======================================================
// BOLA
// ======================================================

function drawBall(){

    const screenY =
        ball.y-ball.z;


    /*
       SOMBRA
    */

    const shadowSize =
        Math.max(
            5,
            18-ball.z*.025
        );

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        ball.x,
        ball.y+4,
        shadowSize*1.5,
        shadowSize*.35,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       BOLA
    */

    const gradient =
        ctx.createRadialGradient(
            ball.x-6,
            screenY-7,
            2,
            ball.x,
            screenY,
            ball.radius
        );

    gradient.addColorStop(
        0,
        "#ffb35c"
    );

    gradient.addColorStop(
        .45,
        "#e47a27"
    );

    gradient.addColorStop(
        1,
        "#9e3f0d"
    );

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.arc(
        ball.x,
        screenY,
        ball.radius,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       LINHAS
    */

    ctx.strokeStyle =
        "rgba(50,20,5,.8)";

    ctx.lineWidth = 2.5;

    ctx.beginPath();

    ctx.arc(
        ball.x,
        screenY,
        ball.radius*.62,
        -Math.PI/2,
        Math.PI/2
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        ball.x-ball.radius,
        screenY
    );

    ctx.lineTo(
        ball.x+ball.radius,
        screenY
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.arc(
        ball.x,
        screenY,
        ball.radius*.75,
        Math.PI*.2,
        Math.PI*1.2
    );

    ctx.stroke();
}

    );

    );

// ======================================================
// ATUALIZAÇÃO
// ======================================================

function update(dt){

    if(!playing)
        return;

    updatePlayer(
        player1,
        dt,
        {
            left:"a",
            right:"d",
            jump:"w"
        }
    );

    updatePlayer(
        player2,
        dt,
        {
            left:"arrowleft",
            right:"arrowright",
            jump:"arrowup"
        }
    );


    /*
       ARREMESSOS
    */

    handleShooting();


    /*
       BOLA NO CHÃO
    */

    tryPickupBall();


    /*
       ROUBO
    */

    checkSteal();


    /*
       FÍSICA
    */

    updateBall(dt);


    /*
       CESTA
    */

    checkBasketCollision();


    /*
       RESET
    */

    updateReset(dt);


    /*
       TEMPO
    */

    updateTimer(dt);
}


// ======================================================
// DESENHAR
// ======================================================

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.save();

    ctx.translate(
        offsetX,
        offsetY
    );

    ctx.scale(
        scale,
        scale
    );

    drawCourt();

    drawPlayer(player1);

    drawPlayer(player2);

    drawBall();

    drawHUD();

    ctx.restore();
}


// ======================================================
// LOOP
// ======================================================

function gameLoop(time){

    if(!playing){

        draw();

        return;
    }

    let dt =
        (time-lastTime)/1000;

    lastTime = time;

    if(dt>.05){
        dt=.05;
    }

    update(dt);

    draw();


    /*
       Limpa os comandos de uma vez.
    */

    for(const key in justPressed){

        delete justPressed[key];
    }


    if(playing){

        requestAnimationFrame(gameLoop);
    }

    else{

        draw();
    }
}

draw();

</script>
