<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>They Are Coming - GameHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         MENU
    ========================== -->

    <div id="shopScreen">

        <div class="shop-container">

            <div class="shop-header">

                <div>
                    <h1>THEY ARE COMING</h1>
                    <p>PREPARAÇÃO</p>
                </div>

                <div class="money">
                    💵 $<span id="money">1000</span>
                </div>

            </div>


            <!-- NOME -->

            <div class="player-box">

                <input
                    id="playerName"
                    type="text"
                    maxlength="16"
                    placeholder="Nome do jogador"
                >

            </div>


            <!-- CATEGORIAS -->

            <div class="categories">

                <button class="category-btn active" data-category="armadura">
                    🛡️ Armadura
                </button>

                <button class="category-btn" data-category="amigo">
                    🐕 Amigo
                </button>

                <button class="category-btn" data-category="armas">
                    🔫 Armas
                </button>

                <button class="category-btn" data-category="kits">
                    🩹 Kits
                </button>

                <button class="category-btn" data-category="bombas">
                    💣 Bombas
                </button>

                <button class="category-btn" data-category="armadilhas">
                    🪤 Armadilhas
                </button>

                <button class="category-btn" data-category="barricadas">
                    🧱 Barricadas
                </button>

            </div>


            <!-- PRODUTOS -->

            <div id="shopContent"></div>


            <!-- INVENTÁRIO -->

            <div class="inventory-menu">

                <h2>🎒 INVENTÁRIO</h2>

                <div id="menuInventory" class="inventory-slots"></div>

            </div>


            <!-- AÇÕES -->

            <div class="shop-actions">

                <button id="startWaveBtn" class="start-button">
                    ▶ INICIAR ONDA
                </button>

            </div>


            <div class="shop-info">

                <p>
                    🧟 Cada zumbi eliminado:
                    <strong>$100</strong>
                </p>

                <p>
                    ❤️ Vida:
                    <strong>100</strong>
                </p>

                <p>
                    💡 Kits médicos só podem ser usados no menu.
                </p>

                <p>
                    🪤 Armadilhas e barricadas podem ser colocadas durante a onda.
                </p>

            </div>

        </div>

    </div>


    <!-- =========================
         JOGO
    ========================== -->

    <canvas id="game"></canvas>


    <!-- =========================
         HUD
    ========================== -->

    <div id="hud">

        <div class="hud-left">

            <div id="nameHud">
                Jogador
            </div>

            <div class="bar-title">
                ❤️ VIDA
            </div>

            <div class="health-box">
                <div id="healthBar"></div>
            </div>


            <!-- ARMADURA FICA OCULTA -->

            <div id="armorHud">

                <div class="bar-title">
                    🛡️ ARMADURA
                </div>

                <div class="armor-box">
                    <div id="armorBar"></div>
                </div>

            </div>

        </div>


        <div class="hud-center">

            <div id="wave">
                ONDA 1
            </div>

            <div id="enemies">
                Zumbis: 0
            </div>

        </div>


        <div class="hud-right">

            <div id="weapon">
                PISTOLA
            </div>

            <div id="ammo">
                12 / 60
            </div>

            <div id="moneyHud">
                💵 $1000
            </div>

        </div>

    </div>


    <!-- =========================
         INVENTÁRIO DO JOGO
    ========================== -->

    <div id="gameInventory">

        <div class="inventory-slots" id="gameInventorySlots"></div>

    </div>


    <!-- =========================
         GAME OVER
    ========================== -->

    <div id="gameOver">

        <h1>VOCÊ MORREU</h1>

        <p id="finalScore"></p>

        <button id="restartBtn">
            VOLTAR À LOJA
        </button>

    </div>


    <script src="game.js"></script>

</body>

</html>
