<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ludix - Space Waves</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#050509;
    color:white;
    touch-action:none;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#game{
    position:relative;
    width:100%;
    height:100%;
    max-width:1500px;
    overflow:hidden;
    background:#050509;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* =========================================================
   TELAS
========================================================= */

.screen{
    position:absolute;
    inset:0;
    z-index:20;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
        radial-gradient(
            circle at center,
            rgba(30,30,45,.70),
            rgba(3,3,7,.94) 75%

}

.panel{
    width:min(450px,94vw);

    padding:35px 28px;

    text-align:center;

    border:1px solid #ffffff25;
    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(20,20,27,.96),
            rgba(7,7,11,.96)

    box-shadow:
        0 0 50px rgba(255,255,255,.05),
        inset 0 0 35px rgba(255,255,255,.025);

    backdrop-filter:blur(12px);
}

.logo{
    font-size:clamp(38px,8vw,65px);
    font-weight:900;
    letter-spacing:3px;

}

.subtitle{

}

.input{

    margin-top:30px;

    border:1px solid #555;

    color:white;

    font-size:17px;
    text-align:center;
}

.input:focus{
    border-color:#aaa;

    box-shadow:

}

    cursor:pointer;

            135deg,

}

.btn.secondary{

/* =========================================================
   HUD
========================================================= */

#hud{

    left:18px;
    right:18px;

    display:flex;
    justify-content:space-between;

}

.hudBox{

}

.hudLabel{

}

.hudValue{

}

/* =========================================================
   RANKING

.rankTitle{

.ranking{

.rankRow{

.rankScore{

}

/* =========================================================

.finalScore{

/* =========================================================

@media(max-width:600px){

</style>

        <div id="speed" class="hudValue">

        </div>

    </div>

</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://vkswxahmirkhcynwlzys.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_pGNNupmDtxbXRgs01aZdeg_6dJqw4Kc";

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;

let DPR = 1;


function resize(){

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

    createStars();
}


window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   ELEMENTOS
========================================================= */

const menu =
    document.getElementById("menu");

const rankingScreen =
    document.getElementById("rankingScreen");

const gameOver =
    document.getElementById("gameOver");

const hud =
    document.getElementById("hud");

const playerName =
    document.getElementById("playerName");

const playBtn =
    document.getElementById("playBtn");

const rankingBtn =
    document.getElementById("rankingBtn");

const backRankingBtn =
    document.getElementById("backRankingBtn");

const restartBtn =
    document.getElementById("restartBtn");

const menuBtn =
    document.getElementById("menuBtn");

const scoreEl =
    document.getElementById("score");

const distanceEl =
    document.getElementById("distance");

const speedEl =
    document.getElementById("speed");

const finalScoreEl =
    document.getElementById("finalScore");

const savingText =
    document.getElementById("savingText");

const rankingList =
    document.getElementById("rankingList");


/* =========================================================
   ESTADO
========================================================= */

let running = false;

let animationId = 0;

let player = null;

let obstacles = [];

let particles = [];

let stars = [];

let score = 0;

let distance = 0;

let gameSpeed = 5;

let lastTime = 0;

let playerNameValue = "";

let holding = false;

let cameraX = 0;


/* =========================================================
   ESTRELAS
========================================================= */

function createStars(){

    stars = [];

    const amount =
        Math.max(
            80,
            Math.floor(W * H / 9000)
        );

    for(
        let i = 0;
        i < amount;
        i++
    ){

        stars.push({

            x:
                Math.random() * W,

            y:
                Math.random() * H,

            size:
                Math.random() * 1.8 + .3,

            speed:
                Math.random() * .8 + .2,

            alpha:
                Math.random() * .7 + .2

        });

    }

}


/* =========================================================
   NAVE
========================================================= */

function createPlayer(){

    player = {

        x:
            W * .22,

        y:
            H / 2,

        size:
            11,

        velocity:
            0,

        waveSpeed:
            6.8,

        angle:
            0

    };

}


/* =========================================================
   INICIAR
========================================================= */

function startGame(){

    const name =
        playerName.value.trim();

    if(!name){

        playerName.focus();

        playerName.style.borderColor =
            "#ff5555";

        return;

    }

    playerName.style.borderColor =
        "#555";

    playerNameValue =
        name.substring(
            0,
            16
        );

    menu.classList.add("hidden");

    rankingScreen.classList.add("hidden");

    gameOver.classList.add("hidden");

    hud.classList.remove("hidden");

    score = 0;

    distance = 0;

    gameSpeed = 5;

    cameraX = 0;

    obstacles = [];

    particles = [];

    createPlayer();

    createLevel();

    running = true;

    lastTime =
        performance.now();

    cancelAnimationFrame(
        animationId
    );

    animationId =
        requestAnimationFrame(
            loop
        );

}


/* =========================================================
   CONTROLE
========================================================= */

function setHolding(value){

    holding = value;

}


/* =========================================================
   TECLADO
========================================================= */

window.addEventListener(
    "keydown",
    e => {

        if(
            e.code === "Space"
        ){

            e.preventDefault();

            holding = true;

        }

    }
);


window.addEventListener(
    "keyup",
    e => {

        if(
            e.code === "Space"
        ){

            e.preventDefault();

            holding = false;

        }

    }
);


/* =========================================================
   TOUCH / MOUSE
========================================================= */

canvas.addEventListener(
    "pointerdown",
    e => {

        if(!running)
            return;

        e.preventDefault();

        holding = true;

    }
);


window.addEventListener(
    "pointerup",
    () => {

        holding = false;

    }
);


/* =========================================================
   CRIAR MAPA
========================================================= */

function createLevel(){

    obstacles = [];

    let x = W + 300;

    const levelLength =
        12000;

    while(
        x < levelLength + W
    ){

        const type =
            Math.floor(
                Math.random() * 6
            );

        const gap =
            Math.max(
                125,
                190 - distance * .01
            );

        const center =
            100 +
            Math.random() *
            Math.max(
                100,
                H - 200
            );

        if(type === 0){

            obstacles.push({

                type:"triangle",

                x:x,

                y:
                    center,

                size:55

            });

            x += 280;

        }

        else if(type === 1){

            obstacles.push({

                type:"triangle",

                x:x,

                y:
                    center - 100,

                size:65,

                flip:true

            });

            obstacles.push({

                type:"triangle",

                x:x + 110,

                y:
                    center + 100,

                size:65

            });

            x += 370;

        }

        else if(type === 2){

            obstacles.push({

                type:"wall",

                x:x,

                y:0,

                width:45,

                height:
                    center - gap/2

            });

            obstacles.push({

                type:"wall",

                x:x,

                y:
                    center + gap/2,

                width:45,

                height:
                    H -
                    (center + gap/2)

            });

            x += 330;

        }

        else if(type === 3){

            obstacles.push({

                type:"slope",

                x:x,

                y:0,

                width:220,

                height:100,

                direction:1

            });

            x += 400;

        }

        else if(type === 4){

            obstacles.push({

                type:"slope",

                x:x,

                y:H,

                width:220,

                height:100,

                direction:-1

            });

            x += 400;

        }

        else{

            obstacles.push({

                type:"block",

                x:x,

                y:
                    center - 35,

                width:70,

                height:70

            });

            x += 300;

        }

    }

}


/* =========================================================
   PARTÍCULAS
========================================================= */

function createParticles(
    x,
    y,
    amount
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
                -Math.random()*3 -
                1,

            vy:
                (Math.random()-.5)*3,

            life:1,

            size:
                Math.random()*3+1

        });

    }

}


/* =========================================================
   COLISÃO
========================================================= */

function pointInTriangle(
    px,
    py,
    ax,
    ay,
    bx,
    by,
    cx,
    cy
){

    const d =
        (by-cy)*(ax-cx) +
        (cx-bx)*(ay-cy);

    const a =
        ((by-cy)*(px-cx) +
        (cx-bx)*(py-cy)) / d;

    const b =
        ((cy-ay)*(px-cx) +
        (ax-cx)*(py-cy)) / d;

    const c =
        1-a-b;

    return (
        a>=0 &&
        b>=0 &&
        c>=0
    );

}


function collision(){

    const p =
        player;

    /* teto */

    if(
        p.y - p.size <= 0 ||
        p.y + p.size >= H
    ){

        return true;

    }


    for(
        const o of obstacles
    ){

        if(
            o.type === "triangle"
        ){

            const left =
                o.x;

            const right =
                o.x + o.size;

            const top =
                o.y - o.size;

            const bottom =
                o.y + o.size;

            if(
                p.x + p.size > left &&
                p.x - p.size < right &&
                p.y + p.size > top &&
                p.y - p.size < bottom
            ){

                let ax,ay,bx,by,cx,cy;

                if(o.flip){

                    ax =
                        left;

                    ay =
                        o.y;

                    bx =
                        right;

                    by =
                        top;

                    cx =
                        right;

                    cy =
                        bottom;

                }else{

                    ax =
                        left;

                    ay =
                        top;

                    bx =
                        left;

                    by =
                        bottom;

                    cx =
                        right;

                    cy =
                        o.y;

                }

                if(
                    pointInTriangle(
                        p.x,
                        p.y,
                        ax,ay,
                        bx,by,
                        cx,cy
                    )
                ){

                    return true;

                }

            }

        }


        if(
            o.type === "wall" ||
            o.type === "block"
        ){

            if(
                p.x + p.size > o.x &&
                p.x - p.size <
                    o.x + o.width &&
                p.y + p.size > o.y &&
                p.y - p.size <
                    o.y + o.height
            ){

                return true;

            }

        }


        if(
            o.type === "slope"
        ){

            if(
                p.x + p.size >
                    o.x &&
                p.x - p.size <
                    o.x + o.width
            ){

                const local =
                    p.x - o.x;

                let line;

                if(
                    o.direction === 1
                ){

                    line =
                        o.y +
                        local *
                        (o.height/o.width);

                }else{

                    line =
                        o.y -
                        local *
                        (o.height/o.width);

                }

                if(
                    o.y < H/2
                ){

                    if(
                        p.y - p.size <
                        line
                    ){

                        return true;

                    }

                }else{

                    if(
                        p.y + p.size >
                        line
                    ){

                        return true;

                    }

                }

            }

        }

    }

    return false;

}


/* =========================================================
   LOOP
========================================================= */

function loop(time){

    if(!running)
        return;

    const dt =
        Math.min(
            (time-lastTime)/16.67,
            2
        );

    lastTime =
        time;

    update(dt);

    draw();

    animationId =
        requestAnimationFrame(
            loop
        );

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    cameraX +=
        gameSpeed *
        dt;

    distance +=
        gameSpeed *
        .09 *
        dt;

    score =
        Math.floor(
            distance
        );

    gameSpeed =
        5 +
        Math.min(
            7,
            distance / 300
        );


    scoreEl.textContent =
        score;

    distanceEl.textContent =
        Math.floor(distance) +
        "m";

    speedEl.textContent =
        (gameSpeed/5)
        .toFixed(1) +
        "x";


    /* =====================================================
       MOVIMENTO WAVE
    ===================================================== */

    const direction =
        holding
        ? -1
        : 1;

    player.velocity =
        direction *
        player.waveSpeed;

    player.y +=
        player.velocity *
        dt;

    player.angle =
        direction < 0
        ? -.65
        : .65;


    /* =====================================================
       OBSTÁCULOS
    ===================================================== */

    for(
        let i=obstacles.length-1;
        i>=0;
        i--
    ){

        const o =
            obstacles[i];

        o.x -=
            gameSpeed *
            dt;

        if(
            o.x <
            -300
        ){

            obstacles.splice(
                i,
                1
            );

            continue;

        }

    }


    /* =====================================================
       ESTRELAS
    ===================================================== */

    for(
        const star of stars
    ){

        star.x -=
            star.speed *
            gameSpeed *
            .35 *
            dt;

        if(
            star.x < -10
        ){

            star.x =
                W +
                Math.random()*100;

            star.y =
                Math.random()*H;

        }

    }


    /* =====================================================
       PARTÍCULAS
    ===================================================== */

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];

        p.x +=
            p.vx *
            dt;

        p.y +=
            p.vy *
            dt;

        p.life -=
            .035 *
            dt;

        if(
            p.life <= 0
        ){

            particles.splice(
                i,
                1
            );

        }

    }


    /* =====================================================
       RASTRO DA NAVE
    ===================================================== */

    if(
        Math.random() < .7
    ){

        particles.push({

            x:
                player.x - 12,

            y:
                player.y,

            vx:
                -2 -
                Math.random()*2,

            vy:
                (Math.random()-.5),

            life:
                .7,

            size:
                Math.random()*2+1

        });

    }


    if(
        collision()
    ){

        endGame();

    }

}


/* =========================================================
   FUNDO
========================================================= */

function drawBackground(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#08080c"
    );

    gradient.addColorStop(
        .5,
        "#111116"
    );

    gradient.addColorStop(
        1,
        "#050507"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* estrelas */

    for(
        const star of stars
    ){

        ctx.globalAlpha =
            star.alpha;

        ctx.fillStyle =
            "#ffffff";

        ctx.fillRect(
            star.x,
            star.y,
            star.size,
            star.size
        );

    }

    ctx.globalAlpha = 1;


    /* linhas horizontais */

    ctx.globalAlpha =
        .08;

    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth =
        1;

    for(
        let y=0;
        y<H;
        y+=45
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();

    }

    ctx.globalAlpha = 1;


    /* linhas de velocidade */

    ctx.globalAlpha =
        .08;

    for(
        let i=0;
        i<12;
        i++
    ){

        const y =
            (i/12)*H;

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();

    }

    ctx.globalAlpha = 1;

}


/* =========================================================
   OBSTÁCULOS
========================================================= */

function drawObstacles(){

    for(
        const o of obstacles
    ){

        /* TRIÂNGULOS */

        if(
            o.type === "triangle"
        ){

            ctx.save();

            ctx.shadowBlur =
                14;

            ctx.shadowColor =
                "#ffffff55";

            ctx.fillStyle =
                "#dedee2";

            ctx.strokeStyle =
                "#ffffff";

            ctx.lineWidth =
                2;

            ctx.beginPath();

            if(o.flip){

                ctx.moveTo(
                    o.x,
                    o.y
                );

                ctx.lineTo(
                    o.x+o.size,
                    o.y-o.size
                );

                ctx.lineTo(
                    o.x+o.size,
                    o.y+o.size
                );

            }else{

                ctx.moveTo(
                    o.x,
                    o.y-o.size
                );

                ctx.lineTo(
                    o.x,
                    o.y+o.size
                );

                ctx.lineTo(
                    o.x+o.size,
                    o.y
                );

            }

            ctx.closePath();

            ctx.fill();

            ctx.stroke();

            ctx.restore();

        }


        /* PAREDES */

        if(
            o.type === "wall"
        ){

            ctx.save();

            ctx.fillStyle =
                "#cfcfd3";

            ctx.strokeStyle =
                "#ffffff";

            ctx.lineWidth =
                2;

            ctx.shadowBlur =
                12;

            ctx.shadowColor =
                "#ffffff44";

            ctx.fillRect(
                o.x,
                o.y,
                o.width,
                o.height
            );

            ctx.strokeRect(
                o.x,
                o.y,
                o.width,
                o.height
            );

            ctx.restore();

        }


        /* BLOCOS */

        if(
            o.type === "block"
        ){

            ctx.save();

            ctx.fillStyle =
                "#bcbcc2";

            ctx.strokeStyle =
                "#ffffff";

            ctx.lineWidth =
                2;

            ctx.shadowBlur =
                14;

            ctx.shadowColor =
                "#ffffff44";

            ctx.fillRect(
                o.x,
                o.y,
                o.width,
                o.height
            );

            ctx.strokeRect(
                o.x,
                o.y,
                o.width,
                o.height
            );

            /* detalhe interno */

            ctx.strokeStyle =
                "#77777d";

            ctx.lineWidth =
                2;

            ctx.beginPath();

            ctx.moveTo(
                o.x+10,
                o.y+10
            );

            ctx.lineTo(
                o.x+o.width-10,
                o.y+o.height-10
            );

            ctx.moveTo(
                o.x+o.width-10,
                o.y+10
            );

            ctx.lineTo(
                o.x+10,
                o.y+o.height-10
            );

            ctx.stroke();

            ctx.restore();

        }


        /* RAMPAS */

        if(
            o.type === "slope"
        ){

            ctx.save();

            ctx.fillStyle =
                "#cfcfd3";

            ctx.strokeStyle =
                "#ffffff";

            ctx.lineWidth =
                2;

            ctx.shadowBlur =
                15;

            ctx.shadowColor =
                "#ffffff44";

            ctx.beginPath();

            if(
                o.direction === 1
            ){

                ctx.moveTo(
                    o.x,
                    o.y
                );

                ctx.lineTo(
                    o.x+o.width,
                    o.y+o.height
                );

                ctx.lineTo(
                    o.x+o.width,
                    o.y
                );

            }else{

                ctx.moveTo(
                    o.x,
                    o.y
                );

                ctx.lineTo(
                    o.x+o.width,
                    o.y-o.height
                );

                ctx.lineTo(
                    o.x+o.width,
                    o.y
                );

            }

            ctx.closePath();

            ctx.fill();

            ctx.stroke();

            ctx.restore();

        }

    }

}


/* =========================================================
   NAVE
========================================================= */

function drawPlayer(){

    if(!player)
        return;

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );

    ctx.rotate(
        player.angle
    );


    /* rastro */

    const trail =
        ctx.createLinearGradient(
            -65,
            0,
            0,
            0
        );

    trail.addColorStop(
        0,
        "transparent"
    );

    trail.addColorStop(
        .6,
        "#ffffff18"
    );

    trail.addColorStop(
        1,
        "#ffffff"
    );

    ctx.fillStyle =
        trail;

    ctx.beginPath();

    ctx.moveTo(
        -65,
        0
    );

    ctx.lineTo(
        -5,
        -4
    );

    ctx.lineTo(
        -5,
        4
    );

    ctx.closePath();

    ctx.fill();


    /* brilho */

    ctx.shadowBlur =
        18;

    ctx.shadowColor =
        "#ffffff";


    /* nave */

    ctx.fillStyle =
        "#ffffff";

    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth =
        2;

    ctx.beginPath();

    ctx.moveTo(
        18,
        0
    );

    ctx.lineTo(
        -8,
        -9
    );

    ctx.lineTo(
        -3,
        0
    );

    ctx.lineTo(
        -8,
        9
    );

    ctx.closePath();

    ctx.fill();

    ctx.stroke();


    /* centro */

    ctx.shadowBlur = 0;

    ctx.fillStyle =
        "#55555c";

    ctx.beginPath();

    ctx.moveTo(
        9,
        0
    );

    ctx.lineTo(
        -3,
        -4
    );

    ctx.lineTo(
        -3,
        4
    );

    ctx.closePath();

    ctx.fill();


    ctx.restore();

}


/* =========================================================
   PARTÍCULAS
========================================================= */

function drawParticles(){

    for(
        const p of particles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life
            );

        ctx.fillStyle =
            "#ffffff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha = 1;

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    drawBackground();

    drawObstacles();

    drawParticles();

    drawPlayer();

}


/* =========================================================
   GAME OVER
========================================================= */

async function endGame(){

    if(!running)
        return;

    running = false;

    holding = false;

    cancelAnimationFrame(
        animationId
    );

    createParticles(
        player.x,
        player.y,
        35
    );

    finalScoreEl.textContent =
        score;

    gameOver.classList.remove(
        "hidden"
    );

    savingText.textContent =
        "Salvando seu score...";


    try{

        const {error} =
            await db
            .from(
                "space_waves_scores"
            )
            .insert({

                player_name:
                    playerNameValue,

                score:
                    score

            });


        if(error){

            console.error(error);

            savingText.textContent =
                "Não foi possível salvar o score.";

        }else{

            savingText.textContent =
                "Score salvo no ranking global!";

        }

    }catch(error){

        console.error(error);

        savingText.textContent =
            "Erro ao salvar o score.";

    }

}


/* =========================================================
   RANKING
========================================================= */

async function loadRanking(){

    rankingList.innerHTML =
        '<div class="loading">Carregando ranking...</div>';

    try{

        const {data,error} =
            await db
            .from(
                "space_waves_scores"
            )
            .select(
                "player_name,score,created_at"
            )
            .order(
                "score",
                {
                    ascending:false
                }
            )
            .limit(100);


        if(error){

            console.error(error);

            rankingList.innerHTML =
                '<div class="loading">Erro ao carregar ranking.</div>';

            return;

        }


        if(
            !data ||
            data.length === 0
        ){

            rankingList.innerHTML =
                '<div class="loading">Ainda não existem scores.</div>';

            return;

        }


        const best = {};


        for(
            const row of data
        ){

            const name =
                String(
                    row.player_name ||
                    "Jogador"
                ).trim();


            if(
                !best[name] ||
                Number(row.score) >
                Number(best[name].score)
            ){

                best[name] =
                    row;

            }

        }


        const ranking =
            Object.values(best)
            .sort(
                (a,b) =>
                    Number(b.score) -
                    Number(a.score)
            )
            .slice(
                0,
                50
            );


        rankingList.innerHTML =
            ranking
            .map(
                (row,index) => {

                    return `

                        <div class="rankRow">

                            <div class="rankPosition">
                                #${index+1}
                            </div>

                            <div class="rankName">
                                ${escapeHTML(
                                    row.player_name
                                )}
                            </div>

                            <div class="rankScore">
                                ${Number(
                                    row.score
                                )}
                            </div>

                        </div>

                    `;

                }
            )
            .join("");


    }catch(error){

        console.error(error);

        rankingList.innerHTML =
            '<div class="loading">Erro ao carregar ranking.</div>';

    }

}


/* =========================================================
   SEGURANÇA
========================================================= */

function escapeHTML(text){

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

restartBtn.addEventListener(
