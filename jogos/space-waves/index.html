<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ludix - Space Waves</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#050509;
    color:white;
    touch-action:none;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#game{
    position:relative;
    width:100%;
    height:100%;
    max-width:1500px;
    overflow:hidden;
    background:#050509;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* =========================================================
   TELAS
========================================================= */

.screen{
    position:absolute;
    inset:0;
    z-index:20;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
        radial-gradient(
            circle at center,
            rgba(30,30,45,.70),
            rgba(3,3,7,.94) 75%
        );
}

.panel{
    width:min(450px,94vw);

    padding:35px 28px;

    text-align:center;

    border:1px solid #ffffff25;
    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(20,20,27,.96),
            rgba(7,7,11,.96)
        );

    box-shadow:
        0 0 50px rgba(255,255,255,.05),
        inset 0 0 35px rgba(255,255,255,.025);

    backdrop-filter:blur(12px);
}

.logo{
    font-size:clamp(38px,8vw,65px);
    font-weight:900;
    letter-spacing:3px;

    color:#f2f2f2;

    text-shadow:
        0 0 8px #ffffff,
        0 0 25px #ffffff55;
}

.subtitle{
    margin-top:8px;

    color:#888;

    font-size:14px;
    letter-spacing:5px;
    text-transform:uppercase;
}

.input{
    width:100%;

    margin-top:30px;

    padding:15px;

    border:1px solid #555;
    border-radius:10px;

    outline:none;

    background:#08080b;

    color:white;

    font-size:17px;
    text-align:center;
}

.input:focus{
    border-color:#aaa;

    box-shadow:
        0 0 15px #ffffff20;
}

.btn{
    width:100%;

    margin-top:15px;

    padding:15px;

    border:1px solid #ffffff30;
    border-radius:10px;

    cursor:pointer;

    color:white;

    font-size:17px;
    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #25252c,
            #111116
        );

    box-shadow:
        0 0 20px #00000055;

    transition:.15s;
}

.btn:hover{
    transform:translateY(-2px);

    border-color:#ffffff70;

    box-shadow:
        0 0 25px #ffffff12;
}

.btn.secondary{
    background:#0c0c11;
    border-color:#333;
}

.help{
    margin-top:25px;

    color:#777;

    font-size:14px;

    line-height:1.7;
}

.hidden{
    display:none !important;
}

/* =========================================================
   HUD
========================================================= */

#hud{
    position:absolute;

    top:18px;
    left:18px;
    right:18px;

    z-index:5;

    display:flex;
    justify-content:space-between;

    pointer-events:none;
}

.hudBox{
    min-width:90px;

    padding:8px 14px;

    border:1px solid #ffffff18;
    border-radius:6px;

    background:#050507cc;

    backdrop-filter:blur(5px);
}

.hudLabel{
    color:#777;

    font-size:10px;

    text-transform:uppercase;
    letter-spacing:1px;
}

.hudValue{
    margin-top:2px;

    font-size:20px;

    font-weight:bold;

    color:#eee;
}

/* =========================================================
   RANKING
========================================================= */

.rankTitle{
    font-size:32px;

    margin-bottom:20px;

    text-shadow:
        0 0 20px #ffffff44;
}

.ranking{
    max-height:360px;

    overflow-y:auto;

    text-align:left;

    margin-top:10px;
}

.rankRow{
    display:flex;
    align-items:center;

    gap:10px;

    padding:12px;

    margin-bottom:7px;

    border-radius:7px;

    background:#101014;

    border:1px solid #25252b;
}

.rankPosition{
    width:30px;

    font-weight:bold;

    color:#888;
}

.rankName{
    flex:1;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.rankScore{
    font-weight:bold;

    color:#ddd;
}

.loading{
    color:#777;

    padding:20px;

    text-align:center;
}

/* =========================================================
   GAME OVER
========================================================= */

.finalScore{
    margin:20px 0;

    font-size:48px;

    font-weight:900;

    color:#eee;

    text-shadow:
        0 0 20px #ffffff44;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .panel{
        padding:28px 20px;
    }

    .hudBox{
        min-width:auto;
        padding:7px 10px;
    }

    .hudValue{
        font-size:16px;
    }

    .help{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>


<!-- ======================================================
     MENU
======================================================= -->

<div id="menu" class="screen">

    <div class="panel">

        <div class="logo">
            SPACE WAVES
        </div>

        <div class="subtitle">
            LUDIX
        </div>

        <input
            id="playerName"
            class="input"
            maxlength="16"
            autocomplete="off"
            placeholder="Digite seu nome"
        >

        <button id="playBtn" class="btn">
            ▶ JOGAR
        </button>

        <button id="rankingBtn" class="btn secondary">
            🏆 RANKING GLOBAL
        </button>

        <div class="help">
            ⌨️ Segure <b>ESPAÇO</b> para subir<br>
            📱 Segure a tela para subir<br>
            🚀 Desvie dos obstáculos e sobreviva!
        </div>

    </div>

</div>


<!-- ======================================================
     RANKING
======================================================= -->

<div id="rankingScreen" class="screen hidden">

    <div class="panel">

        <div class="rankTitle">
            🏆 RANKING GLOBAL
        </div>

        <div id="rankingList" class="ranking">

            <div class="loading">
                Carregando ranking...
            </div>

        </div>

        <button id="backRankingBtn" class="btn secondary">
            ← VOLTAR
        </button>

    </div>

</div>


<!-- ======================================================
     GAME OVER
======================================================= -->

<div id="gameOver" class="screen hidden">

    <div class="panel">

        <div class="rankTitle">
            GAME OVER
        </div>

        <div id="finalScore" class="finalScore">
            0
        </div>

        <div id="savingText" class="help">
            Salvando seu score...
        </div>

        <button id="restartBtn" class="btn">
            🔄 JOGAR NOVAMENTE
        </button>

        <button id="menuBtn" class="btn secondary">
            🏠 MENU
        </button>

    </div>

</div>


<!-- ======================================================
     HUD
======================================================= -->

<div id="hud" class="hidden">

    <div class="hudBox">

        <div class="hudLabel">
            Score
        </div>

        <div id="score" class="hudValue">
            0
        </div>

    </div>

    <div class="hudBox">

        <div class="hudLabel">
            Distância
        </div>

        <div id="distance" class="hudValue">
            0m
        </div>

    </div>

    <div class="hudBox">

        <div class="hudLabel">
            Velocidade
        </div>

        <div id="speed" class="hudValue">
            1x
        </div>

    </div>

</div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://vkswxahmirkhcynwlzys.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_pGNNupmDtxbXRgs01aZdeg_6dJqw4Kc";

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;

let DPR = 1;


function resize(){

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

    createStars();
}


window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   ELEMENTOS
========================================================= */

const menu =
    document.getElementById("menu");

const rankingScreen =
    document.getElementById("rankingScreen");

const gameOver =
    document.getElementById("gameOver");

const hud =
    document.getElementById("hud");

const playerName =
    document.getElementById("playerName");

const playBtn =
    document.getElementById("playBtn");

const rankingBtn =
    document.getElementById("rankingBtn");

const backRankingBtn =
    document.getElementById("backRankingBtn");

const restartBtn =
    document.getElementById("restartBtn");

const menuBtn =
    document.getElementById("menuBtn");

const scoreEl =
    document.getElementById("score");

const distanceEl =
    document.getElementById("distance");

const speedEl =
    document.getElementById("speed");

const finalScoreEl =
    document.getElementById("finalScore");

const savingText =
    document.getElementById("savingText");

const rankingList =
    document.getElementById("rankingList");


/* =========================================================
   ESTADO
========================================================= */

let running = false;

let animationId = 0;

let player = null;

let obstacles = [];

let particles = [];

let stars = [];

let score = 0;

let distance = 0;

let gameSpeed = 5;

let lastTime = 0;

let playerNameValue = "";

let holding = false;


/* =========================================================
   PROGRESSÃO
========================================================= */

let speedLevel = 0;

let obstacleLevel = 0;

let nextSpeedDistance = 150;

let nextObstacleScore = 500;


/* =========================================================
   ESTRELAS
========================================================= */

function createStars(){

    stars = [];

    const amount =
        Math.max(
            80,
            Math.floor(W * H / 9000)
        );

    for(
        let i = 0;
        i < amount;
        i++
    ){

        stars.push({

            x:
                Math.random() * W,

            y:
                Math.random() * H,

            size:
                Math.random() * 1.8 + .3,

            speed:
                Math.random() * .8 + .2,

            alpha:
                Math.random() * .7 + .2

        });

    }

}


/* =========================================================
   NAVE
========================================================= */

function createPlayer(){

    player = {

        x:
            W * .22,

        y:
            H / 2,

        size:
            11,

        velocity:
            0,

        waveSpeed:
            6.8,

        angle:
            0

    };

}


/* =========================================================
   INICIAR
========================================================= */

function startGame(){

    const name =
        playerName.value.trim();

    if(!name){

        playerName.focus();

        playerName.style.borderColor =
            "#ff5555";

        return;

    }

    playerName.style.borderColor =
        "#555";

    playerNameValue =
        name.substring(
            0,
            16
        );

    menu.classList.add("hidden");

    rankingScreen.classList.add("hidden");

    gameOver.classList.add("hidden");

    hud.classList.remove("hidden");

    score = 0;

    distance = 0;

    gameSpeed = 5;

    speedLevel = 0;

    obstacleLevel = 0;

    nextSpeedDistance = 150;

    nextObstacleScore = 500;

    obstacles = [];

    particles = [];

    createPlayer();

    createInitialObstacles();

    running = true;

    holding = false;

    lastTime =
        performance.now();

    cancelAnimationFrame(
        animationId
    );

    animationId =
        requestAnimationFrame(
            loop
        );

}


/* =========================================================
   CONTROLE
========================================================= */

window.addEventListener(
    "keydown",
    e => {

        if(
            e.code === "Space"
        ){

            e.preventDefault();

            if(running)
                holding = true;

        }

    }
);


window.addEventListener(
    "keyup",
    e => {

        if(
            e.code === "Space"
        ){

            e.preventDefault();

            holding = false;

        }

    }
);


canvas.addEventListener(
    "pointerdown",
    e => {

        if(!running)
            return;

        e.preventDefault();

        holding = true;

    }
);


window.addEventListener(
    "pointerup",
    () => {

        holding = false;

    }
);


/* =========================================================
   CRIAR OBSTÁCULOS INICIAIS
========================================================= */

function createInitialObstacles(){

    obstacles = [];

    let x =
        W + 300;

    for(
        let i=0;
        i<12;
        i++
    ){

        createObstacleAt(
            x
        );

        x +=
            300 +
            Math.random()*180;

    }

}


/* =========================================================
   CRIAR UM OBSTÁCULO
========================================================= */

function createObstacleAt(x){

    const margin =
        90;

    const usableHeight =
        Math.max(
            100,
            H - margin*2
        );

    const y =
        margin +
        Math.random()*usableHeight;


    const typeRoll =
        Math.random();


    /* ESPINHO */

    if(
        typeRoll < .32
    ){

        obstacles.push({

            type:
                "spike",

            x:
                x,

            y:
                y,

            size:
                28 +
                obstacleLevel * 2,

            flip:
                Math.random() < .5

        });

        return;

    }


    /* SERRA */

    if(
        typeRoll < .57
    ){

        obstacles.push({

            type:
                "saw",

            x:
                x,

            y:
                y,

            radius:
                22 +
                obstacleLevel * 2,

            rotation:
                0,

            rotationSpeed:
                .15

        });

        return;

    }


    /* FORMA GEOMÉTRICA */

    if(
        typeRoll < .82
    ){

        obstacles.push({

            type:
                "diamond",

            x:
                x,

            y:
                y,

            size:
                28 +
                obstacleLevel * 2,

            rotation:
                Math.PI / 4

        });

        return;

    }


    /* BLOCO COM ESPINHOS */

    obstacles.push({

        type:
            "dangerBlock",

        x:
            x,

        y:
            y,

        width:
            50,

        height:
            50

    });

}


/* =========================================================
   ADICIONAR MAIS OBSTÁCULOS
========================================================= */

function addMoreObstacles(){

    obstacleLevel++;

    const amount =
        3 +
        obstacleLevel;

    let x =
        W + 300;

    for(
        let i=0;
        i<amount;
        i++
    ){

        createObstacleAt(
            x
        );

        x +=
            180 +
            Math.random()*160;

    }

}


/* =========================================================
   PARTÍCULAS
========================================================= */

function createParticles(
    x,
    y,
    amount
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
                -Math.random()*3 -
                1,

            vy:
                (Math.random()-.5)*3,

            life:1,

            size:
                Math.random()*3+1

        });

    }

}


/* =========================================================
   COLISÃO CÍRCULO / CÍRCULO
========================================================= */

function circleCollision(
    x1,
    y1,
    r1,
    x2,
    y2,
    r2
){

    const dx =
        x1-x2;

    const dy =
        y1-y2;

    return (
        dx*dx +
        dy*dy
    ) <
    (
        r1+r2
    ) *
    (
        r1+r2
    );

}


/* =========================================================
   COLISÃO
========================================================= */

function collision(){

    const p =
        player;


    /*
       IMPORTANTE:
       O chão e o teto NÃO MATAM.
       Eles apenas impedem a nave
       de sair da área jogável.
    */

    const ceiling =
        38;

    const floor =
        H - 38;


    if(
        p.y - p.size < ceiling
    ){

        p.y =
            ceiling +
            p.size;

        p.velocity = 0;

    }


    if(
        p.y + p.size > floor
    ){

        p.y =
            floor -
            p.size;

        p.velocity = 0;

    }


    for(
        const o of obstacles
    ){

        /* =================================================
           ESPINHO
        ================================================= */

        if(
            o.type === "spike"
        ){

            const dx =
                p.x -
                o.x;

            const dy =
                p.y -
                o.y;

            const dist =
                Math.sqrt(
                    dx*dx +
                    dy*dy
                );

            if(
                dist <
                p.size +
                o.size*.55
            ){

                return true;

            }

        }


        /* =================================================
           SERRA
        ================================================= */

        if(
            o.type === "saw"
        ){

            if(
                circleCollision(
                    p.x,
                    p.y,
                    p.size,
                    o.x,
                    o.y,
                    o.radius
                )
            ){

                return true;

            }

        }


        /* =================================================
           DIAMANTE
        ================================================= */

        if(
            o.type === "diamond"
        ){

            if(
                Math.abs(
                    p.x-o.x
                ) <
                o.size &&
                Math.abs(
                    p.y-o.y
                ) <
                o.size
            ){

                return true;

            }

        }


        /* =================================================
           BLOCO PERIGOSO
        ================================================= */

        if(
            o.type === "dangerBlock"
        ){

            if(
                p.x+p.size >
                    o.x &&
                p.x-p.size <
                    o.x+o.width &&
                p.y+p.size >
                    o.y &&
                p.y-p.size <
                    o.y+o.height
            ){

                return true;

            }

        }

    }

    return false;

}


/* =========================================================
   LOOP
========================================================= */

function loop(time){

    if(!running)
        return;

    const dt =
        Math.min(
            (time-lastTime)/16.67,
            2
        );

    lastTime =
        time;

    update(dt);

    draw();

    animationId =
        requestAnimationFrame(
            loop
        );

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    distance +=
        gameSpeed *
        .09 *
        dt;

    score =
        Math.floor(
            distance
        );


    /* =====================================================
       VELOCIDADE A CADA 150 METROS
    ===================================================== */

    while(
        distance >=
        nextSpeedDistance
    ){

        speedLevel++;

        /*
           Aumenta a velocidade
           progressivamente.
        */

        gameSpeed =
            5 +
            speedLevel * 1.15;

        nextSpeedDistance +=
            150;

    }


    /*
       Garante a velocidade correta
       mesmo depois de grandes saltos.
    */

    gameSpeed =
        5 +
        Math.floor(
            distance / 150
        ) * 1.15;


    /* =====================================================
       MAIS OBSTÁCULOS A CADA 500 SCORE
    ===================================================== */

    while(
        score >=
        nextObstacleScore
    ){

        addMoreObstacles();

        nextObstacleScore +=
            500;

    }


    scoreEl.textContent =
        score;

    distanceEl.textContent =
        Math.floor(distance) +
        "m";

    speedEl.textContent =
        (gameSpeed/5)
        .toFixed(1) +
        "x";


    /* =====================================================
       MOVIMENTO DA NAVE
    ===================================================== */

    const direction =
        holding
        ? -1
        : 1;


    player.velocity =
        direction *
        player.waveSpeed;


    player.y +=
        player.velocity *
        dt;


    player.angle =
        direction < 0
        ? -.65
        : .65;


    /* =====================================================
       MOVIMENTO DOS OBSTÁCULOS
    ===================================================== */

    for(
        let i=obstacles.length-1;
        i>=0;
        i--
    ){

        const o =
            obstacles[i];

        o.x -=
            gameSpeed *
            dt;


        if(
            o.type === "saw"
        ){

            o.rotation +=
                o.rotationSpeed *
                dt;

        }


        if(
            o.x < -150
        ){

            obstacles.splice(
                i,
                1
            );

        }

    }


    /*
       Mantém obstáculos chegando
       continuamente.
    */

    const lastObstacle =
        obstacles.length
        ? obstacles[
            obstacles.length-1
          ]
        : null;


    if(
        !lastObstacle ||
        lastObstacle.x <
        W - 250
    ){

        let amount =
            1 +
            Math.floor(
                obstacleLevel / 2
            );


        for(
            let i=0;
            i<amount;
            i++
        ){

            const last =
                obstacles.length
                ? obstacles[
                    obstacles.length-1
                  ]
                : null;

            const x =
                last
                ? last.x +
                  240 +
                  Math.random()*180
                : W + 300;

            createObstacleAt(
                x
            );

        }

    }


    /* =====================================================
       ESTRELAS
    ===================================================== */

    for(
        const star of stars
    ){

        star.x -=
            star.speed *
            gameSpeed *
            .35 *
            dt;

        if(
            star.x < -10
        ){

            star.x =
                W +
                Math.random()*100;

            star.y =
                Math.random()*H;

        }

    }


    /* =====================================================
       PARTÍCULAS
    ===================================================== */

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];

        p.x +=
            p.vx *
            dt;

        p.y +=
            p.vy *
            dt;

        p.life -=
            .035 *
            dt;

        if(
            p.life <= 0
        ){

            particles.splice(
                i,
                1
            );

        }

    }


    /* =====================================================
       RASTRO
    ===================================================== */

    if(
        Math.random() < .7
    ){

        particles.push({

            x:
                player.x - 12,

            y:
                player.y,

            vx:
                -2 -
                Math.random()*2,

            vy:
                (Math.random()-.5),

            life:
                .7,

            size:
                Math.random()*2+1

        });

    }


    if(
        collision()
    ){

        endGame();

    }

}


/* =========================================================
   FUNDO
========================================================= */

function drawBackground(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#08080c"
    );

    gradient.addColorStop(
        .5,
        "#111116"
    );

    gradient.addColorStop(
        1,
        "#050507"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* estrelas */

    for(
        const star of stars
    ){

        ctx.globalAlpha =
            star.alpha;

        ctx.fillStyle =
            "#ffffff";

        ctx.fillRect(
            star.x,
            star.y,
            star.size,
            star.size
        );

    }

    ctx.globalAlpha = 1;


    /* linhas horizontais */

    ctx.globalAlpha =
        .08;

    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth =
        1;

    for(
        let y=0;
        y<H;
        y+=45
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();

    }

    ctx.globalAlpha = 1;

}


/* =========================================================
   CHÃO E TETO
========================================================= */

function drawBorders(){

    const borderHeight =
        38;


    /*
       TETO
    */

    ctx.fillStyle =
        "#cfcfd3";

    ctx.fillRect(
        0,
        0,
        W,
        borderHeight
    );


    /*
       CHÃO
    */

    ctx.fillStyle =
        "#cfcfd3";

    ctx.fillRect(
        0,
        H-borderHeight,
        W,
        borderHeight
    );


    /*
       linhas internas
    */

    ctx.fillStyle =
        "#77777d";

    ctx.fillRect(
        0,
        borderHeight-3,
        W,
        3
    );

    ctx.fillRect(
        0,
        H-borderHeight,
        W,
        3
    );


    /*
       pequenos detalhes
    */

    ctx.strokeStyle =
        "#ffffff55";

    ctx.lineWidth =
        2;

    for(
        let x=0;
        x<W;
        x+=45
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            8
        );

        ctx.lineTo(
            x+20,
            30
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            x,
            H-8
        );

        ctx.lineTo(
            x+20,
            H-30
        );

        ctx.stroke();

    }

}


/* =========================================================
   OBSTÁCULOS
========================================================= */

function drawObstacles(){

    for(
        const o of obstacles
    ){

        /* =================================================
           ESPINHO
        ================================================= */

        if(
            o.type === "spike"
        ){

            ctx.save();

            ctx.fillStyle =
                "#cfcfd3";

            ctx.strokeStyle =
                "#ffffff";

            ctx.lineWidth =
                2;

            ctx.shadowBlur =
                12;

            ctx.shadowColor =
                "#ffffff44";


            ctx.beginPath();


            if(
                o.flip
            ){

                ctx.moveTo(
                    o.x-o.size,
                    o.y+o.size
                );

                ctx.lineTo(
                    o.x,
                    o.y-o.size
                );

                ctx.lineTo(
                    o.x+o.size,
                    o.y+o.size
                );

            }else{

                ctx.moveTo(
                    o.x-o.size,
                    o.y-o.size
                );

                ctx.lineTo(
                    o.x,
                    o.y+o.size
                );

                ctx.lineTo(
                    o.x+o.size,
                    o.y-o.size
                );

            }

            ctx.closePath();

            ctx.fill();

            ctx.stroke();

            ctx.restore();

        }


        /* =================================================
           SERRA CIRCULAR
        ================================================= */

        if(
            o.type === "saw"
        ){

            ctx.save();

            ctx.translate(
                o.x,
                o.y
            );

            ctx.rotate(
                o.rotation
            );


            ctx.shadowBlur =
                14;

            ctx.shadowColor =
                "#ffffff55";


            /*
               dentes da serra
            */

            ctx.fillStyle =
                "#d5d5d9";

            ctx.strokeStyle =
                "#ffffff";

            ctx.lineWidth =
                2;

            ctx.beginPath();


            const teeth =
                16;

            for(
                let i=0;
                i<teeth;
                i++
            ){

                const angle =
                    i *
                    Math.PI*2 /
                    teeth;

                const radius =
                    i%2===0
                    ? o.radius+7
                    : o.radius;

                const x =
                    Math.cos(angle) *
                    radius;

                const y =
                    Math.sin(angle) *
                    radius;

                if(i===0)
                    ctx.moveTo(x,y);
                else
                    ctx.lineTo(x,y);

            }

            ctx.closePath();

            ctx.fill();

            ctx.stroke();


            /*
               centro
            */

            ctx.fillStyle =
                "#55555b";

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                o.radius*.38,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.stroke();


            ctx.fillStyle =
                "#111116";

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                o.radius*.14,
                0,
                Math.PI*2
            );

            ctx.fill();


            ctx.restore();

        }


        /* =================================================
           DIAMANTE
        ================================================= */

        if(
            o.type === "diamond"
        ){

            ctx.save();

            ctx.translate(
                o.x,
                o.y
            );

            ctx.rotate(
                o.rotation
            );

            ctx.fillStyle =
                "#bfc0c5";

            ctx.strokeStyle =
                "#ffffff";

            ctx.lineWidth =
                2;

            ctx.shadowBlur =
                12;

            ctx.shadowColor =
                "#ffffff44";

            ctx.beginPath();

            ctx.moveTo(
                o.size,
                0
            );

            ctx.lineTo(
                0,
                o.size
            );

            ctx.lineTo(
                -o.size,
                0
            );

            ctx.lineTo(
                0,
                -o.size
            );

            ctx.closePath();

            ctx.fill();

            ctx.stroke();

            ctx.restore();

        }


        /* =================================================
           BLOCO PERIGOSO
        ================================================= */

        if(
            o.type === "dangerBlock"
        ){

            ctx.save();

            ctx.fillStyle =
                "#bfc0c5";

            ctx.strokeStyle =
                "#ffffff";

            ctx.lineWidth =
                2;

            ctx.shadowBlur =
                12;

            ctx.shadowColor =
                "#ffffff44";

            ctx.fillRect(
                o.x,
                o.y,
                o.width,
                o.height
            );

            ctx.strokeRect(
                o.x,
                o.y,
                o.width,
                o.height
            );


            /*
               X no centro
            */

            ctx.strokeStyle =
                "#55555b";

            ctx.lineWidth =
                3;

            ctx.beginPath();

            ctx.moveTo(
                o.x+8,
                o.y+8
            );

            ctx.lineTo(
                o.x+o.width-8,
                o.y+o.height-8
            );

            ctx.moveTo(
                o.x+o.width-8,
                o.y+8
            );

            ctx.lineTo(
                o.x+8,
                o.y+o.height-8
            );

            ctx.stroke();


            /*
               pequenos espinhos
            */

            ctx.fillStyle =
                "#eeeeef";

            for(
                let i=0;
                i<4;
                i++
            ){

                const sx =
                    o.x +
                    5 +
                    i*13;

                ctx.beginPath();

                ctx.moveTo(
                    sx,
                    o.y
                );

                ctx.lineTo(
                    sx+5,
                    o.y-10
                );

                ctx.lineTo(
                    sx+10,
                    o.y
                );

                ctx.closePath();

                ctx.fill();

            }

            ctx.restore();

        }

    }

}


/* =========================================================
   NAVE
========================================================= */

function drawPlayer(){

    if(!player)
        return;

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );

    ctx.rotate(
        player.angle
    );


    /* rastro */

    const trail =
        ctx.createLinearGradient(
            -65,
            0,
            0,
            0
        );

    trail.addColorStop(
        0,
        "transparent"
    );

    trail.addColorStop(
        .6,
        "#ffffff18"
    );

    trail.addColorStop(
        1,
        "#ffffff"
    );

    ctx.fillStyle =
        trail;

    ctx.beginPath();

    ctx.moveTo(
        -65,
        0
    );

    ctx.lineTo(
        -5,
        -4
    );

    ctx.lineTo(
        -5,
        4
    );

    ctx.closePath();

    ctx.fill();


    /* brilho */

    ctx.shadowBlur =
        18;

    ctx.shadowColor =
        "#ffffff";


    /* nave */

    ctx.fillStyle =
        "#ffffff";

    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth =
        2;

    ctx.beginPath();

    ctx.moveTo(
        18,
        0
    );

    ctx.lineTo(
        -8,
        -9
    );

    ctx.lineTo(
        -3,
        0
    );

    ctx.lineTo(
        -8,
        9
    );

    ctx.closePath();

    ctx.fill();

    ctx.stroke();


    /* centro */

    ctx.shadowBlur = 0;

    ctx.fillStyle =
        "#55555c";

    ctx.beginPath();

    ctx.moveTo(
        9,
        0
    );

    ctx.lineTo(
        -3,
        -4
    );

    ctx.lineTo(
        -3,
        4
    );

    ctx.closePath();

    ctx.fill();


    ctx.restore();

}


/* =========================================================
   PARTÍCULAS
========================================================= */

function drawParticles(){

    for(
        const p of particles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life
            );

        ctx.fillStyle =
            "#ffffff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha = 1;

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    drawBackground();

    drawBorders();

    drawObstacles();

    drawParticles();

    drawPlayer();

}


/* =========================================================
   GAME OVER
========================================================= */

async function endGame(){

    if(!running)
        return;

    running = false;

    holding = false;

    cancelAnimationFrame(
        animationId
    );

    createParticles(
        player.x,
        player.y,
        35
    );

    finalScoreEl.textContent =
        score;

    gameOver.classList.remove(
        "hidden"
    );

    savingText.textContent =
        "Salvando seu score...";


    try{

        const {error} =
            await db
            .from(
                "space_waves_scores"
            )
            .insert({

                player_name:
                    playerNameValue,

                score:
                    score

            });


        if(error){

            console.error(error);

            savingText.textContent =
                "Não foi possível salvar o score.";

        }else{

            savingText.textContent =
                "Score salvo no ranking global!";

        }

    }catch(error){

        console.error(error);

        savingText.textContent =
            "Erro ao salvar o score.";

    }

}


/* =========================================================
   RANKING
========================================================= */

async function loadRanking(){

    rankingList.innerHTML =
        '<div class="loading">Carregando ranking...</div>';

    try{

        const {data,error} =
            await db
            .from(
                "space_waves_scores"
            )
            .select(
                "player_name,score,created_at"
            )
            .order(
                "score",
                {
                    ascending:false
                }
            )
            .limit(100);


        if(error){

            console.error(error);

            rankingList.innerHTML =
                '<div class="loading">Erro ao carregar ranking.</div>';

            return;

        }


        if(
            !data ||
            data.length === 0
        ){

            rankingList.innerHTML =
                '<div class="loading">Ainda não existem scores.</div>';

            return;

        }


        const best = {};


        for(
            const row of data
        ){

            const name =
                String(
                    row.player_name ||
                    "Jogador"
                ).trim();


            if(
                !best[name] ||
                Number(row.score) >
                Number(best[name].score)
            ){

                best[name] =
                    row;

            }

        }


        const ranking =
            Object.values(best)
            .sort(
                (a,b) =>
                    Number(b.score) -
                    Number(a.score)
            )
            .slice(
                0,
                50
            );


        rankingList.innerHTML =
            ranking
            .map(
                (row,index) => {

                    return `

                        <div class="rankRow">

                            <div class="rankPosition">
                                #${index+1}
                            </div>

                            <div class="rankName">
                                ${escapeHTML(
                                    row.player_name
                                )}
                            </div>

                            <div class="rankScore">
                                ${Number(
                                    row.score
                                )}
                            </div>

                        </div>

                    `;

                }
            )
            .join("");


    }catch(error){

        console.error(error);

        rankingList.innerHTML =
            '<div class="loading">Erro ao carregar ranking.</div>';

    }

}


/* =========================================================
   SEGURANÇA
========================================================= */

function escapeHTML(text){

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}
